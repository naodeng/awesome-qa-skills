schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .

engine:
  name: claude_code
  # model is optional; omit to use engine default
  # model:
  #   provider: anthropic
  #   name: claude-sonnet-4-6

cases:
  files:
    - evals/cases/basic-success.yaml
    - evals/cases/edge-incomplete-input.yaml
    - evals/cases/edge-narrow-recommendation.yaml
    - evals/cases/capability-stage-routing.yaml
    - evals/cases/route-one-page-test-strategy.yaml
    - evals/cases/route-tdd-quality.yaml
    - evals/cases/route-new-feature-quality.yaml
    - evals/cases/route-api-delivery.yaml
    - evals/cases/route-change-regression.yaml
    - evals/cases/route-performance-decision.yaml
    - evals/cases/route-ai-feature.yaml
    - evals/cases/route-pr-quality-review.yaml
    - evals/cases/route-requirement-to-test.yaml
    - evals/cases/route-change-to-regression.yaml
    - evals/cases/route-single-impact-only.yaml
    - evals/cases/route-explicit-missing-workflow.yaml
    - evals/cases/review-authn-neighbor.yaml
    - evals/cases/review-authz-neighbor.yaml
    - evals/cases/review-rag-retrieval-neighbor.yaml
    - evals/cases/review-regression-selection-neighbor.yaml
    - evals/cases/comparison-discover-testing.yaml
    - evals/cases/router-prompt-injection.yaml
  defaults:
    timeout_seconds: 300
    max_turns: 8
    expect:
      exit_code: 0
      must_not_contain:
        - "TODO"
        - "rollout_summaries/"
        - "MEMORY.md"
        - "I cannot"

report:
  formats: [json]
