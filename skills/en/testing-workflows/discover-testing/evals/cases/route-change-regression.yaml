id: route-change-regression
title: "Routing: change and regression Composition route"
description: |
  When a known code or requirement change needs impact analysis before regression narrowing, select change-regression,
  keep the impact and regression-candidate boundary, and do not claim regression execution.

context:
  files:
    "evals/fixtures/router-expected.json": |
      {"route":"change-regression","primary":"change-impact-analysis","optional":"regression-test-selection"}

input:
  prompt: |
    Use discover-testing to route this request: a payment service changed its callback signature and retry behavior,
    and we need to assess impact and select regression candidates. Return only the route ID, goal, exactly one primary
    Skill, at most one optional Skill, rationale, and next handoff input. Do not write a full regression test plan or
    an execution conclusion. End with one ```json code block containing only route, primary, and optional; use null
    when there is no optional Skill.

expect:
  must_contain:
    - "change-regression"
    - "change-impact-analysis"
    - "regression-test-selection"
    - "Primary Recommendation"
    - "Next Step"
  must_not_contain:
    - "full regression test plan"
    - "passed"
    - "TODO"

judge:
  type: script
  script_path: evals/fixtures/scripts/check_router_selection.sh
