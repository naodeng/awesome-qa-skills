id: capability-stage-routing
title: "Routing: distinguish AI Native QA from AI for QA"
description: |
  A request to evaluate LLM hallucination and refusal behavior must be identified as an AI Native QA capability,
  use the currently installed AI feature/LLM Skill, and not be classified as AI for QA. ai-assisted-testing applies when AI assists an existing QA task.

input:
  prompt: |
    Trusted Host inventory for this case: `ai-feature-testing` and `llm-testing` are installed and callable.
    Use discover-testing to route this request: evaluate a customer-support LLM for hallucination and refusal behavior.
    Return `ai-feature-testing` as primary and `llm-testing` as the one optional specialist for model-output evaluation; do not classify it as AI for QA or invent another skill.

expect:
  must_contain:
    - "AI Native QA"
    - "llm-testing"
  must_not_contain:
    - "ai-assisted-testing"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "AI Native QA"
          - "llm-testing"
