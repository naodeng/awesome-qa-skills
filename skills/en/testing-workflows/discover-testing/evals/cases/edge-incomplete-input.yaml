id: edge-incomplete-input
title: Routing: clarify when the request is vague
description: |
  With only "please test the new feature", clarify scope/type/phase instead of pretending a skill is ready to execute.

input:
  prompt: |
    Use discover-testing.
    The user only said: "Please test the new feature." No scope, test type, or phase.
    Clarify what must be asked first; do not pretend a skill is already selected and actionable.

expect:
  must_contain:
    - "clarif"
    - "gap"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "clarif"
          - "gap"
