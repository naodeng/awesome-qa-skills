id: edge-incomplete-input
title: "Routing: clarify when the request is vague"
description: |
  With only "please test the new feature", clarify scope/type/phase instead of pretending a skill is ready to execute.

input:
  prompt: |
    Use discover-testing.
    Reply in English.
    The user only said: "Please test the new feature." No scope, test type, or phase.
    Reply with the three numbered plain-text questions for feature/scope, current phase, and requested deliverable.
    Do not recommend a Skill, ask about an environment, or call tools; the user has not requested execution.
    Do not pretend a Skill is already selected and actionable.

expect:
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: script
  script_path: evals/graders/clarification.py
  timeout_seconds: 30
