id: edge-narrow-recommendation
title: "Routing: do not recommend a pile of skills"
description: |
  Even if the user lists many types, recommend one primary and at most one supporting skill, and explain why not a menu.

input:
  prompt: |
    Use discover-testing.
    User: we need functional, API, performance, security, and accessibility—list every related skill.
    Requirement: recommend only 1 primary skill and at most 1 supporting skill; explain why not a long list; give the next step.

expect:
  must_contain:
    - "Primary Recommendation"
    - "Supporting"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "Primary Recommendation"
          - "Next Step"
