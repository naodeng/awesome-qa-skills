{
  "schema_version": "1.0.0",
  "id": "discover-testing",
  "version": "1.0.0",
  "kind": "router",
  "title": {
    "zh": "测试技能路由",
    "en": "Testing Skill Router"
  },
  "summary": {
    "zh": "将 QA 请求路由到当前可用的一个主 Skill，必要时推荐一个辅助 Skill。",
    "en": "Route a QA request to one available primary Skill and, when needed, one optional Skill."
  },
  "lifecycle_state": "UNASSESSED",
  "inputs": [
    {
      "id": "user_request",
      "required": true,
      "description": "User request and available project evidence."
    }
  ],
  "outputs": [
    {
      "id": "workflow_result",
      "description": "Scoped result, evidence states, open gaps, and next handoff.",
      "evidence_kind": "fact"
    }
  ],
  "steps": [
    {
      "id": "classify",
      "description": "Classify",
      "skill_ids": [],
      "prompt": "prompts/discover-testing.md",
      "depends_on": [],
      "on_failure": "continue_with_gap",
      "permission": "read_only",
      "approval_required": false
    },
    {
      "id": "select",
      "description": "Select",
      "skill_ids": [],
      "prompt": "prompts/discover-testing.md",
      "depends_on": [],
      "on_failure": "continue_with_gap",
      "permission": "read_only",
      "approval_required": false
    },
    {
      "id": "availability",
      "description": "Availability",
      "skill_ids": [],
      "prompt": "prompts/discover-testing.md",
      "depends_on": [],
      "on_failure": "continue_with_gap",
      "permission": "read_only",
      "approval_required": false
    },
    {
      "id": "handoff",
      "description": "Handoff",
      "skill_ids": [],
      "prompt": "prompts/discover-testing.md",
      "depends_on": [],
      "on_failure": "continue_with_gap",
      "permission": "read_only",
      "approval_required": false
    }
  ],
  "failure_policy": {
    "on_missing_dependency": "continue_with_limitations",
    "on_blocked": "stop"
  },
  "permission_policy": {
    "default": "read_only",
    "approval_required_for": [
      "execute_command",
      "write_repo",
      "external_write",
      "publish",
      "delete",
      "release_approval"
    ]
  },
  "checkpoint_policy": {
    "host_runtime_required": true,
    "fingerprint_fields": [
      "inputs",
      "commit_sha"
    ],
    "invalidate_on_change": [
      "inputs",
      "commit_sha"
    ],
    "automatic_replay": "side_effect_free_only"
  },
  "handoff": {
    "required_fields": [
      "workflow_id",
      "source",
      "status",
      "open_gaps",
      "next_step"
    ]
  },
  "evidence_contract_version": "1.0.0"
}
