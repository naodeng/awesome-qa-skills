id: edge-role-conflict
title: "UX perspective: preserve conflict between experience evidence and QA summary"
description: |
  When role conclusions conflict, UX should preserve traceable experience evidence without rewriting another role's test facts.
input:
  prompt: |
    Use ux-quality-perspective.
    stage: test-reporting
    UX record UX-RUN-206 v2 shows keyboard users cannot leave the payment-method list and two of three screen-reader tasks fail. QA summary QA-206 v5 says '50/50 functional cases passed; no quality risk', but contains no keyboard or screen-reader cases.
    Produce a UX-quality report that explains the conflict, scope, and actions.
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Attributes UX-RUN-206 v2 and QA-206 v5 separately and explains that QA functional scope did not cover the UX keyboard/screen-reader results."
    - "Preserves the keyboard blocker and 2/3 screen-reader task failures instead of using 50/50 functional pass to claim no UX risk."
    - "States scope boundaries, impact, evidence/retest actions, and an authorized resolver without rewriting QA facts or approving release."
  pass_threshold: 0.8
