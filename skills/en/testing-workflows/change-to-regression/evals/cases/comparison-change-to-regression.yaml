    "must_not_contain": [
      "regression passed",
      "TODO"
    ]
  },
  "judge": {
    "type": "rule_based",
    "success": [
      {
        "output_contains": {
          "all": [
            "8f1a23",
            "Required",
            "Deferred",
            "Excluded",
            "Deferred",
            "NOT_RUN"
          ]
        }
      }
    ]
  }
