id: edge-unsupported-stage
title: "QA perspective: do not analyze an unsupported stage"
description: |
  QA must validate stage and not substitute a nearby prompt for an unsupported stage.
input:
  prompt: |
    Use qa-quality-perspective.
    stage: defect-triage
    Give a QA-quality conclusion now.
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Returns not applicable or equivalent, says defect-triage is unsupported, and lists or points to the eight valid stages."
    - "Does not silently use another stage or generate filler QA findings or a quality conclusion."
  pass_threshold: 0.8
