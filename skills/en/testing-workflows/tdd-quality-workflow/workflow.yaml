{
  "schema_version": "1.0.0",
  "id": "tdd-quality-workflow",
  "version": "1.0.0",
  "kind": "sequence",
  "title": {
    "zh": "TDD 质量工作流",
    "en": "TDD Quality Workflow"
  },
  "summary": {
    "zh": "记录 Red、Green、Refactor 与质量证据阶段。",
    "en": "Record Red, Green, Refactor, and quality-evidence stages."
  },
  "lifecycle_state": "EXPERIMENTAL",
  "inputs": [
    {
      "id": "user_request",
      "required": true,
      "description": "User request and available project evidence."
    }
  ],
  "outputs": [
    {
      "id": "workflow_result",
      "description": "Scoped result, evidence states, open gaps, and next handoff.",
      "evidence_kind": "fact"
    }
  ],
  "steps": [
    {
      "id": "red",
      "description": "Red",
      "skill_ids": [
        "test-code-review"
      ],
      "prompt": "prompts/tdd-quality-workflow.md",
      "depends_on": [],
      "on_failure": "stop",
      "permission": "read_only",
      "approval_required": false
    },
    {
      "id": "green",
      "description": "Green",
      "skill_ids": [],
      "prompt": "prompts/tdd-quality-workflow.md",
      "depends_on": [
        "red"
      ],
      "on_failure": "stop",
      "permission": "read_only",
      "approval_required": false
    },
    {
      "id": "refactor",
      "description": "Refactor",
      "skill_ids": [],
      "prompt": "prompts/tdd-quality-workflow.md",
      "depends_on": [
        "red",
        "green"
      ],
      "on_failure": "stop",
      "permission": "read_only",
      "approval_required": false
    },
    {
      "id": "evidence",
      "description": "Evidence",
      "skill_ids": [
        "test-effectiveness-analysis"
      ],
      "prompt": "prompts/tdd-quality-workflow.md",
      "depends_on": [
        "red",
        "green",
        "refactor"
      ],
      "on_failure": "stop",
      "permission": "read_only",
      "approval_required": false
    }
  ],
  "failure_policy": {
    "on_missing_dependency": "continue_with_limitations",
    "on_blocked": "stop"
  },
  "permission_policy": {
    "default": "read_only",
    "approval_required_for": [
      "execute_command",
      "write_repo",
      "external_write",
      "publish",
      "delete",
      "release_approval"
    ]
  },
  "checkpoint_policy": {
    "host_runtime_required": true,
    "fingerprint_fields": [
      "inputs",
      "commit_sha"
    ],
    "invalidate_on_change": [
      "inputs",
      "commit_sha"
    ],
    "automatic_replay": "side_effect_free_only"
  },
  "handoff": {
    "required_fields": [
      "workflow_id",
      "source",
      "status",
      "open_gaps",
      "next_step"
    ]
  },
  "evidence_contract_version": "1.0.0"
}
