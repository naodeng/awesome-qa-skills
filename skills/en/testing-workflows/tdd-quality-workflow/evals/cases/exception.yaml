id: exception
title: "exception evidence boundary"
input:
  prompt: "Use $tdd-quality-workflow to assess only a documentation-only change: the project owner approved a non-TDD exception because behavior did not change; manual review was completed but no tests ran. RED, GREEN, refactor regression, and mutation tests definitely were not run. Do not execute tests or modify the project; you may use read-only shell commands to read the Skill files. Record the exception, alternative verification, and residual risk.\nFinish with an evaluation table containing exactly one row per phase in the format `phase | status | evidence`; phase names must be RED, GREEN, REFACTOR, MUTATION. Use VERIFIED_RED, VERIFIED_GREEN, VERIFIED_REFACTOR, INCONCLUSIVE or NOT_EXECUTED for the matching TDD phases, and EXECUTED, INCONCLUSIVE or NOT_EXECUTED for MUTATION. Each evidence cell must be nonempty."
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/graders/exception.py
  timeout_seconds: 30
