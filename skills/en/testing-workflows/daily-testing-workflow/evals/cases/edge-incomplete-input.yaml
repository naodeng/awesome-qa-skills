id: edge-incomplete-input
title: Daily workflow: incomplete input still yields a draft
description: |
  Missing stories/env should still yield a day-cadence draft with explicit assumptions and gaps.

input:
  prompt: |
    Use daily-testing-workflow.
    I only know "test the new feature today"—no story list, environment, or blockers.
    Give a usable first draft of today's cadence and list the information we must fill in.

expect:
  must_contain:
    - "assumption"
    - "gap"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "assumption"
          - "gap"
