id: edge-gates-handoff
title: "Daily workflow: entry/exit gates and handoff"
description: |
  Define day's entry/exit criteria and how to hand off to execution skills by name (no hard links to other skill files).

input:
  prompt: |
    Use daily-testing-workflow.
    Scenario: if morning smoke fails, do not start exploratory; afternoon needs a defect summary before wrap-up.
    Write clear entry/exit criteria (gates) and how each stage hands off to execution skills (e.g. test-case-writing, bug-reporting, test-reporting—skill names and handoff points only; no file-path links to other skills).

expect:
  must_contain:
    - "entry"
    - "handoff"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "gate"
          - "handoff"
