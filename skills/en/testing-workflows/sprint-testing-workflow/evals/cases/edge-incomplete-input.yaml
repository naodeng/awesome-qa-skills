id: edge-incomplete-input
title: Sprint workflow: incomplete input still yields a draft
description: |
  Missing stories/env/DoD should still yield a sprint cadence draft with assumptions and gaps.

input:
  prompt: |
    Use sprint-testing-workflow.
    I only know "we need to test this sprint"—no story list, capacity, environment, or Definition of Done.
    Give a usable first draft of the sprint testing cadence and list the information we must fill in.

expect:
  must_contain:
    - "assumption"
    - "gap"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "assumption"
          - "gap"
