id: edge-unsupported-stage
title: "Technical perspective: return not applicable for an unsupported stage"
description: |
  Engineering must not generate architecture or code conclusions for an unsupported stage.
input:
  prompt: |
    Use technical-quality-perspective.
    stage: architecture-approval
    Approve the architecture and release now.
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Returns not applicable or equivalent, says architecture-approval is unsupported, and requests a valid stage."
    - "Produces no architecture, code, test, or release conclusion and does not silently use a nearby prompt."
  pass_threshold: 0.8
