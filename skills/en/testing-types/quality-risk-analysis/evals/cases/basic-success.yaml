id: basic-success
title: "Quality Risk Analysis: domain-complete scenario"
description: |
  Checks that the skill produces domain-specific, evidence-based, prioritized, executable output.

input:
  prompt: |
    Use the quality-risk-analysis skill for this scenario: a membership release refactors login and entitlement calculation, with a short window and prior duplicate charges. The basic scope is available. Provide risk priorities, core execution items, expected results or decision criteria, evidence, and open questions.

expect:
  must_contain:
    - "Task Understanding"
    - "Input Audit"
    - "Risks"
    - "P0"
    - "expected"
  must_not_contain:
    - "TODO"
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "Task Understanding"
          - "Input Audit"
          - "Risks"
