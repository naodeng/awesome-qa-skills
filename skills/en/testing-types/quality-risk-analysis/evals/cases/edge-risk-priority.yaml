id: edge-risk-priority
title: "Quality Risk Analysis: high-risk boundary and tradeoffs"
description: |
  Checks that a constrained window produces risk focus plus stop, escalation, or human-handoff boundaries.

input:
  prompt: |
    Use the quality-risk-analysis skill for: a membership release refactors login and entitlement calculation, with a short window and prior duplicate charges. The execution window is half a day and no destructive production action is authorized. Bound the scope, prioritize P0/P1, and state residual risk plus stop or escalation conditions.

expect:
  must_contain:
    - "P0"
    - "P1"
    - "Residual Risk"
    - "condition"
  must_not_contain:
    - "TODO"
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "P0"
          - "P1"
          - "Residual Risk"
