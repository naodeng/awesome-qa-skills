id: review-missing-evaluation-evidence
title: "agent-failure-recovery-testing: Agent failure recovery: retry and side-effect trace — missing run evidence"
description: "Checks recovery analysis for failure, retry, idempotency, and duplicate side effects."
context:
  files:
    "structured-trace.json": |-
      {
        "trace_id": "TRACE-NORUN-AGENT-FAILURE-RECOVERY-TESTING",
        "subject": "agent-failure-recovery-testing",
        "identity": {
          "model_version": "model-A",
          "prompt_version": "prompt-1",
          "dataset_version": "dataset-1"
        },
        "run_id": null,
        "attempted": false,
        "run_evidence": [],
        "evaluation_status": "NOT_RUN"
      }
input:
  prompt: |
    Use agent-failure-recovery-testing to review structured-trace.json. Determine whether retry followed a side effect, whether idempotency_key stayed stable, and separate observed evidence from recovery advice.
    The trace has no run_id and no raw result. Output exactly these machine-readable lines:
    evaluation_status: NOT_RUN
    run_evidence: []
    domain_conclusion: UNASSESSED
expect:
  must_contain:
    - "evaluation_status: NOT_RUN"
    - "run_evidence: []"
    - "domain_conclusion: UNASSESSED"
judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "evaluation_status: NOT_RUN"
          - "run_evidence: []"
          - "domain_conclusion: UNASSESSED"
