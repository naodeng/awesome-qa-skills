id: edge-semantic-agent-judge
title: "Requirements analysis: separate facts, assumptions, and risk"
description: |
  This case requires semantic review because keyword checks alone cannot tell whether the analysis invents policy or prioritizes the right risk.

input:
  prompt: |
    Use requirements-analysis.
    Story: a marketplace checkout should reserve inventory before charging a card, and an abandoned reservation should expire.
    The only confirmed fact is that the checkout flow exists; inventory TTL, payment retry behavior, and the expiry ownership are unspecified.
    Produce a first-draft analysis that separates confirmed facts from assumptions, prioritizes release-blocking risks, and asks targeted questions.

constraints:
  timeout_seconds: 720

expect:
  must_contain:
    - "assumption"
    - "Open Questions"

judge:
  type: agent_judge
  model: openai/gpt-5.6-sol
  criteria:
    - "Separates the confirmed checkout fact from assumptions instead of inventing inventory TTL or payment policy."
    - "Prioritizes reservation-before-charge, payment retry, and expiry ownership as release-relevant risks rather than treating every gap equally."
    - "Asks targeted questions that would resolve the stated gaps and keeps the result useful as a first draft."
  pass_threshold: 0.67
