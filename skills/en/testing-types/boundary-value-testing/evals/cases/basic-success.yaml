id: basic-success
title: "Boundary Value Test Design: basic-success"
description: |
  This case checks the boundary-value-testing evidence and boundary contract.

input:
  prompt: |
    Use boundary-value-testing for this material: a note is limited to 50 characters and an amount is non-negative, but multibyte length and amount precision are unspecified. Start with known, missing, conflicting, stale, out_of_scope, and assumptions, then produce BVT-## with source, evidence state, priority, close condition, and validation. Do not claim tests ran.

expect:
  must_contain:
    - "BVT-"
    - "known"
    - "evidence"
    - "validation"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "known"
          - "evidence"
          - "validation"
