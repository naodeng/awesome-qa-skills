id: edge-incomplete-input
title: "Bruno: one-line ask still yields draft"
description: |
  With only one sentence and no schema, still draft Bruno assets and list gaps/assumptions.

input:
  prompt: |
    Use api-test-bruno. I only know: please test the points redemption API. No OpenAPI, no fields, no path.
    Give a usable Bruno collection draft structure and list required gaps and assumptions.

expect:
  must_contain:
    - "assumption"
    - "Open Questions"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "assumption"
          - "Bruno"
