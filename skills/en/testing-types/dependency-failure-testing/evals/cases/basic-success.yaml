id: basic-success
title: "Dependency-Failure Testing: domain output with complete input"
description: |
  Verify that the Skill produces an evidence-based, prioritized, reviewable result about dependency-failure taxonomy, isolation, degradation, fallback, and dependency recovery.

input:
  prompt: |
    Use the dependency-failure-testing Skill to analyze order behavior when inventory, payment, and messaging dependencies fail separately. The system scope, isolated environment, main dependencies, and release constraints are provided. Produce domain risks, expected results, evidence gaps, priorities, and open questions.

expect:
  must_contain:
    - "object/rule"
    - "source"
    - "trigger or applicability"
    - "expected concern/rationale"
    - "evidence state"
    - "impact/priority"
    - "owner role"
    - "close condition"
    - "validation method"
    - "DPF-"
    - "dependency failure"
    - "priority"
    - "evidence"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "object/rule"
          - "source"
          - "trigger or applicability"
          - "expected concern/rationale"
          - "evidence state"
          - "impact/priority"
          - "owner role"
          - "close condition"
          - "validation method"
          - "DPF-"
          - "dependency failure"
          - "open"
