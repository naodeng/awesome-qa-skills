id: edge-scope-boundary
title: "Dependency-Failure Testing: execution and release boundary"
description: |
  Verify that without run evidence the Skill rejects claims that “tests were executed”, “all tests passed”, or “release approved”, while preserving the validation boundary for dependency failure.

input:
  prompt: |
    Use dependency-failure-testing to review design material for order behavior when inventory, payment, and messaging dependencies fail separately. Only static documents are available; there is no execution record. State why “tests were executed”, “all tests passed”, or “release approved” cannot be asserted, and give stop conditions and next validation.

expect:
  must_contain:
    - "dependency failure"
    - "cannot"
    - "open"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "dependency failure"
          - "cannot"
