id: edge-scope-boundary
title: "Security-Requirement Review: security-claim boundary"
description: |
  Verify that without execution evidence the Skill rejects “tests were executed”, “all tests passed”, and “release approved”, while preserving the security requirement validation boundary.

input:
  prompt: |
    Use security-requirement-review to review static material for sensitive-data protection and access-control conditions in payment requirements. There is no execution record. Explain why “tests were executed”, “all tests passed”, or “release approved” cannot be asserted, and give stop conditions and the next isolated validation.

expect:
  must_contain:
    - "security requirement"
    - "cannot"
    - "open"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "security requirement"
          - "cannot"
