id: basic-success
title: "Security-Requirement Review: security output with complete input"
description: |
  Verify that the Skill produces an evidence-based, prioritized, reviewable security result about security objectives, testability, trace links, acceptance conditions, and evidence gaps.

input:
  prompt: |
    Use the security-requirement-review Skill to analyze sensitive-data protection and access-control conditions in payment requirements. System scope, test environment, roles, and security constraints are provided. Produce security requirement risks, expected results, evidence gaps, priorities, and open questions.

expect:
  must_contain:
    - "security requirement"
    - "priority"
    - "evidence"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "security requirement"
          - "open"
