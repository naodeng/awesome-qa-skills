id: domain-method-regression
title: "ai-assisted-testing: Domain outcomes, correct controls, and evidence boundaries"
description: "Checks per-item domain decisions, legitimate controls, and unknown evidence rather than generic headings."
input:
  prompt: |
    Use ai-assisted-testing to analyze this sanitized static fixture, without external actions. Follow the main prompt with domain steps, observable oracles, sources, gaps, and minimal validation.
    Append a decision table with columns `ID | DECISION | Evidence`; the only allowed rows are AIA-01 ACCEPTED, AIA-02 DRAFT, and AIA-03 UNSUPPORTED. `review_decision` still uses ACCEPTED/DRAFT/REJECTED; keep execution state separate from review decision.

    Same 10 checkout cases at equal scope and complexity: manual baseline 60 minutes; AI generation 10, review 25, rework 35, acceptance 10. Input is sanitized; QA R1 reviews D1 assertions, adopts V2, and raw evidence for run R7 shows 10/10 passing; review finds one false-green assertion and reworks it. D2 is unreviewed. No token counts or billing evidence are available. Show provenance and human gates.

    Decision table has exactly one row per fixture ID, three cells, and nonempty evidence, with no duplicates or unknown IDs. Add a `METRIC | VALUE | Evidence` table with exactly human_baseline_minutes=60, generate_minutes=10, review_minutes=25, rework_minutes=35, acceptance_minutes=10, total_minutes=80, token_cost=UNSUPPORTED, defects_found=1, rework_count=1, false_green_count=1. Each evidence cell is nonempty; do not invent values.
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
