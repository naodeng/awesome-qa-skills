id: basic-success
title: "AI-assisted: split work and human gates"
description: |
  Return AI/human split, provenance, AIA IDs, cost accounting, and human gates.

input:
  prompt: |
    Use ai-assisted-testing.
    Task: in two days, draft points-redemption cases plus an exploration checklist; team may use AI drafts.
    Use AIA-## IDs for draft findings and include source_snapshot_id, assistant/model, prompt/instruction_version, draft_id, reviewer, review_decision, adopted_version_id, execution_evidence, cost fields, and human gates. Nothing has been generated or executed yet; preserve unknown and unrun states.

expect:
  must_contain:
    - "human"
    - "review"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "Task and Sources"
          - "AIA-01"
          - "source_snapshot_id"
          - "DRAFT"
