id: edge-incomplete-input
title: "AI-assisted: draft split when goals are vague"
description: |
  Vague scope gets a constrained draft with missing provenance, model version, baseline, and run state explicit.

input:
  prompt: |
    Use ai-assisted-testing. Teammate says 'let AI do all the testing' with no module or quality bar.
    Give a usable first split, and list limits, assumptions, and must-confirm items. Do not invent a source snapshot, model version, reviewer, manual baseline, or run evidence; use UNKNOWN, DRAFT, NOT_RUN, or UNSUPPORTED as applicable.

expect:
  must_contain:
    - "assumption"
    - "limit"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "human"
          - "assumption"
          - "UNKNOWN"
          - "DRAFT"
