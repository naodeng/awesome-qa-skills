schema_version: v1alpha1
environment:
  type: none
skills:
  - source: local_path
    path: .
engine:
  name: claude_code
cases:
  files:
    - evals/cases/basic-success.yaml
    - evals/cases/edge-incomplete-input.yaml
    - evals/cases/edge-risk-boundary.yaml
    - evals/cases/trajectory-evidence.yaml
    - evals/cases/edge-evidence-boundary.yaml
  defaults:
    timeout_seconds: 180
    max_turns: 8
    expect:
      exit_code: 0
report:
  formats: [json]
benchmark:
  enabled: true
