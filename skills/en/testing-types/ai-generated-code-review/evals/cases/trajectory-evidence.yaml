id: trajectory-evidence
title: "Agent code trajectory: compare events with the final diff"
description: "Uses structured Agent trace as source evidence and identifies links and gaps between trace and changes."
context:
  files:
    "agent-trajectory.json": |-
      {
        "run_id": "RUN-71",
        "source": {"tool": "coding-agent", "model": "UNKNOWN", "prompt_version": "UNKNOWN"},
        "events": [
          {"step_id": "S1", "type": "task.received", "goal": "Preserve one charge per order across webhook retries", "source_id": "PAY-12"},
          {"step_id": "S2", "type": "tool.call", "tool": "read_file", "args": {"path": "src/payment/capture.py"}, "result_id": "R2"},
          {"step_id": "S3", "type": "tool.call", "tool": "edit_file", "args": {"path": "src/payment/capture.py", "change": "replace stable order idempotency key with a new UUID on every retry"}, "result_id": "R3"},
          {"step_id": "S4", "type": "tool.call", "tool": "edit_file", "args": {"path": "tests/test_capture.py", "change": "remove duplicate-webhook assertion; retain HTTP 200 assertion"}, "result_id": "R4"},
          {"step_id": "S5", "type": "tool.call", "tool": "run_command", "args": {"command": "pytest tests/test_capture.py"}, "result": "Agent-reported exit 0", "artifact": null}
        ],
        "final_diff": ["src/payment/capture.py", "tests/test_capture.py"],
        "patch": "- payment.capture(order.id, key=order.id)\n+ payment.capture(order.id, key=str(uuid4()))",
        "ci_run": null,
        "human_review": null
      }
input:
  prompt: |
    Use ai-generated-code-review to review `agent-trajectory.json` read-only. Compare goal PAY-12, events S1-S5, and the final file list; decide whether S3/S4 conflict with the goal, what S5 proves, and which independent evidence is missing. Preserve run/step/result IDs and run no commands.
expect:
  must_contain: ["RUN-71", "S3", "S4", "PAY-12", "UNKNOWN"]
  must_not_contain: ["tests executed and passed", "Human approved"]
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Retains RUN-71 and relevant S1-S5 step IDs; identifies S3's per-retry UUID as conflicting with one-charge idempotency and S4 as removing the negative-path assertion."
    - "Treats S5 as an Agent-reported command result with no artifact, not independent proof of test execution; marks CI and Human review absent/UNKNOWN."
    - "Connects the final changed-file list to the trace without claiming it proves diff completeness or correctness; makes no external call or execution claim."
