id: edge-incomplete-input
title: Pytest: one-line ask still yields draft
description: |
  With only one sentence and no schema, still draft pytest structure and list gaps/assumptions.

input:
  prompt: |
    Use api-test-pytest. I only know: we need to test points redemption. No path, fields, or auth notes.
    Give a usable pytest draft (layout + fixture approach) and list required gaps and assumptions.

expect:
  must_contain:
    - "assumption"
    - "gap"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "assumption"
          - "pytest"
