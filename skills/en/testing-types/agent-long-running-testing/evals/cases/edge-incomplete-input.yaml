id: edge-incomplete-input
title: "Long-Running Agent Testing: bounded first pass with incomplete input"
description: |
  Checks that missing context leads to a bounded first pass with assumptions and gaps, not refusal or invention.

input:
  prompt: |
    Use the agent-long-running-testing skill. The only known fact is: a data-migration Agent may run for hours, and the team needs evidence boundaries for checkpoints, heartbeats, resume, cancellation, and duplicate submission. No more environment, version, model, or supporting evidence is available. Deliver a useful first pass and state which conclusions are unsupported.

expect:
  must_contain:
    - "Working Assumptions"
    - "Open Questions"
    - "evidence"
    - "Next Actions"
  must_not_contain:
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "Working Assumptions"
          - "Open Questions"
