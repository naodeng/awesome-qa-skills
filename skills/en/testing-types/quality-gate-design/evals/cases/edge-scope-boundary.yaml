id: edge-scope-boundary
title: "Quality Gate Design: execution and release boundary"
description: |
  Checks that missing runtime records do not become execution, pass, or release claims and that the domain validation boundary remains explicit.

input:
  prompt: |
    Use the quality-gate-design skill to review this scenario: a payment-service release needs a quality gate covering critical business risk, automated results, known defects, and the human-approval boundary. Only static material is available and no runtime record is supplied. State what cannot be written as "tests were executed", "all tests passed", or "release approved", then give stop conditions and next validation.

expect:
  must_contain:
    - "quality gate"
    - "cannot"
    - "Open Questions"
  must_not_contain:
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "quality gate"
          - "cannot"
