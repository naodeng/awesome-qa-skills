id: edge-incomplete-input
title: "Quality Gate Design: bounded first pass with incomplete input"
description: |
  Checks that missing context leads to a bounded first pass with assumptions and gaps, not refusal or invention.

input:
  prompt: |
    Use the quality-gate-design skill. The only known fact is: a payment-service release needs a quality gate covering critical business risk, automated results, known defects, and the human-approval boundary. No more environment, version, definitions, or supporting evidence are available. Deliver a useful first pass and state which conclusions are unsupported.

expect:
  must_contain:
    - "Working Assumptions"
    - "Open Questions"
    - "evidence"
    - "Next Actions"
  must_not_contain:
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "Working Assumptions"
          - "Open Questions"
