id: edge-incomplete-input
title: "API Error Contract Testing: edge-incomplete-input"
description: |
  This case checks that missing inputs remain explicit and bounded.

input:
  prompt: |
    Use api-error-contract-testing with only an endpoint name and one business sentence. List missing evidence and open questions, then produce bounded AEC-## candidates without inventing a contract or execution result.

expect:
  must_contain:
    - "AEC-"
    - "missing"
    - "open question"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "missing"
          - "open question"
