id: basic-success
title: "State Transition Test Design: basic-success"
description: |
  This case checks the state-transition-testing evidence and boundary contract.

input:
  prompt: |
    Use state-transition-testing for this material: a payment order has created, authorized, captured, and refunded states, but the post-failure refund state is undefined. Start with known, missing, conflicting, stale, out_of_scope, and assumptions, then produce STT-## with source, evidence state, priority, close condition, and validation. Do not claim tests ran.

expect:
  must_contain:
    - "STT-"
    - "known"
    - "evidence"
    - "validation"
    - "state"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "known"
          - "evidence"
          - "validation"
          - "state"
