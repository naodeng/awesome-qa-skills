id: review-missing-evaluation-evidence
title: "ai-feature-testing: AI feature: runtime trace review — missing run evidence"
description: "Checks that AI feature assessment binds a run, model, and input versions while separating gaps from conclusions."
context:
  files:
    "structured-trace.json": |-
      {
        "trace_id": "TRACE-NORUN-AI-FEATURE-TESTING",
        "subject": "ai-feature-testing",
        "identity": {
          "model_version": "model-A",
          "prompt_version": "prompt-1",
          "dataset_version": "dataset-1"
        },
        "run_id": null,
        "attempted": false,
        "run_evidence": [],
        "evaluation_status": "NOT_RUN"
      }
input:
  prompt: |
    Use ai-feature-testing to review structured-trace.json. Analyze only the supplied trace, identify trace_id, run_id, model/dataset identity, and observed quality evidence; do not generalize one sample into a release conclusion.
    The trace has no run_id and no raw result. Output exactly these machine-readable lines:
    evaluation_status: NOT_RUN
    run_evidence: []
    domain_conclusion: UNASSESSED
expect:
  must_contain:
    - "evaluation_status: NOT_RUN"
    - "run_evidence: []"
    - "domain_conclusion: UNASSESSED"
judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "evaluation_status: NOT_RUN"
          - "run_evidence: []"
          - "domain_conclusion: UNASSESSED"
