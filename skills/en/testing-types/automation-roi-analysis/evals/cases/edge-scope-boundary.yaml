id: edge-scope-boundary
title: "Automation ROI Analysis: execution and release boundary"
description: |
  Checks that missing runtime records do not become execution, pass, or release claims and that the domain validation boundary remains explicit.

input:
  prompt: |
    Use the automation-roi-analysis skill to review this scenario: a team must decide whether to automate a regression suite, but has only rough execution frequency and maintenance estimates without a comparable horizon or sensitivity analysis. Only static material is available and no runtime record is supplied. State what cannot be written as "tests were executed", "all tests passed", or "release approved", then give stop conditions and next validation.

expect:
  must_contain:
    - "automation ROI"
    - "cannot"
    - "Open Questions"
  must_not_contain:
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "automation ROI"
          - "cannot"
