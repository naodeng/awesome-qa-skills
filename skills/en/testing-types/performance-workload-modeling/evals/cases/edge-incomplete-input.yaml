id: edge-incomplete-input
title: "Performance Workload Modeling: bounded first pass with incomplete input"
description: |
  Checks that missing context leads to a bounded first pass with assumptions and gaps, not refusal or invention.

input:
  prompt: |
    Use the performance-workload-modeling skill. The only known fact is: daily peak has 600k requests: search 55%, detail 30%, order 10%, payment 5%, with ten-minute bursts. No environment, version, or supporting evidence is available. Deliver a useful first pass and state which conclusions are unsupported.

expect:
  must_contain:
    - "Working Assumptions"
    - "Open Questions"
    - "evidence"
    - "Next Actions"
  must_not_contain:
    - "TODO"
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "Working Assumptions"
          - "Open Questions"
          - "evidence"
