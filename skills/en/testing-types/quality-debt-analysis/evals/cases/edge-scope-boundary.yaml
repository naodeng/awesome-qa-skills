id: edge-scope-boundary
title: "Quality Debt Analysis: execution and release boundary"
description: |
  Checks that missing runtime records do not become execution, pass, or release claims and that the domain validation boundary remains explicit.

input:
  prompt: |
    Use the quality-debt-analysis skill to review this scenario: an order system has uncovered boundary cases, flaky tests, and stale test data, and the team needs to decide which quality debt to pay down first. Only static material is available and no runtime record is supplied. State what cannot be written as "tests were executed", "all tests passed", or "release approved", then give stop conditions and next validation.

expect:
  must_contain:
    - "quality debt"
    - "cannot"
    - "Open Questions"
  must_not_contain:
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "quality debt"
          - "cannot"
