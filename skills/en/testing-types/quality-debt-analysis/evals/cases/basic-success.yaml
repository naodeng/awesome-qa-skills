id: basic-success
title: "Quality Debt Analysis: domain-complete scenario"
description: |
  Checks that the skill produces domain-specific quality debt analysis that is evidence-based, prioritized, and executable.

input:
  prompt: |
    Use the quality-debt-analysis skill for this scenario: an order system has uncovered boundary cases, flaky tests, and stale test data, and the team needs to decide which quality debt to pay down first. Provide quality debt priorities, core execution items, expected behavior or decision criteria, evidence, and open questions.

expect:
  must_contain:
    - "object/rule"
    - "source"
    - "trigger or applicability"
    - "expected concern/rationale"
    - "evidence state"
    - "impact/priority"
    - "owner role"
    - "close condition"
    - "validation method"
    - "QDA-"
    - "Task Understanding"
    - "Input Audit"
    - "quality debt"
    - "expected"
  must_not_contain:
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "object/rule"
          - "source"
          - "trigger or applicability"
          - "expected concern/rationale"
          - "evidence state"
          - "impact/priority"
          - "owner role"
          - "close condition"
          - "validation method"
          - "QDA-"
          - "Task Understanding"
          - "Input Audit"
          - "quality debt"
