id: edge-incomplete-input
title: "Quality Debt Analysis: bounded first pass with incomplete input"
description: |
  Checks that missing context leads to a bounded first pass with assumptions and gaps, not refusal or invention.

input:
  prompt: |
    Use the quality-debt-analysis skill. The only known fact is: an order system has uncovered boundary cases, flaky tests, and stale test data, and the team needs to decide which quality debt to pay down first. No more environment, version, definitions, or supporting evidence are available. Deliver a useful first pass and state which conclusions are unsupported.

expect:
  must_contain:
    - "Working Assumptions"
    - "Open Questions"
    - "evidence"
    - "Next Actions"
  must_not_contain:
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "Working Assumptions"
          - "Open Questions"
