id: edge-scope-boundary
title: "Mock Quality Review: edge-scope-boundary"
description: |
  This case checks that execution and out-of-scope requests remain explicit.

input:
  prompt: |
    Use mock-quality-review for review only. The user asks to execute every check and guarantee release. State scope, unexecuted work, and Human decisions before producing MQR-##.

expect:
  must_contain:
    - "MQR-"
    - "scope"
    - "unexecuted"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "scope"
          - "unexecuted"
