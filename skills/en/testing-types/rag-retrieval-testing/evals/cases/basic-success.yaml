id: basic-success
title: "RAG Retrieval Testing: domain-complete scenario"
description: |
  Checks that the skill produces domain-specific retrieval result analysis that is evidence-based, prioritized, and executable.

input:
  prompt: |
    Use the rag-retrieval-testing skill for this scenario: retrieval results decreased after an enterprise knowledge-base change, and the team needs to separate evidence differences from query rewriting, chunking, filters, and ranking. Provide retrieval result priorities, core execution items, expected behavior or decision criteria, evidence, and open questions.

expect:
  must_contain:
    - "object/rule"
    - "source"
    - "trigger or applicability"
    - "expected concern/rationale"
    - "evidence state"
    - "impact/priority"
    - "owner role"
    - "close condition"
    - "validation method"
    - "RAGT-"
    - "Task Understanding"
    - "Input Audit"
    - "retrieval result"
    - "expected"
  must_not_contain:
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "object/rule"
          - "source"
          - "trigger or applicability"
          - "expected concern/rationale"
          - "evidence state"
          - "impact/priority"
          - "owner role"
          - "close condition"
          - "validation method"
          - "RAGT-"
          - "Task Understanding"
          - "Input Audit"
          - "retrieval result"
