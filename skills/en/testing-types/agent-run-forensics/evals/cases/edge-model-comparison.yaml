id: edge-model-comparison
title: "Agent run forensics: refuse an unsound model comparison"
description: |
  The comparison path is the one that most easily produces a confident, unsupported verdict:
  two forks, two outputs, and a reader who picks the nicer one. This case supplies a request
  that cannot be answered soundly — the two forks started from different checkpoints, there is
  one run per model, and the proposed grader is a package-runner command resolved on the spot.

  A pass requires naming at least one failed precondition and declining to rank the models.
  Reading the two outputs and judging them is the failure this case exists to catch.

input:
  prompt: |
    Use the agent-run-forensics skill: I forked a recorded run onto two models and want to know
    which one is better. Fork A started from checkpoint 3 and fork B from checkpoint 7. I ran each
    model once. I did not run a test suite — grade them with `npx some-grader@latest` and tell me
    the winner.

expect:
  must_contain:
    - "checkpoint"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    # The different checkpoints must be called out as making the comparison invalid.
    - output_matches:
        all:
          - "(?i)checkpoint"
          - "(?i)(not comparable|same checkpoint|different checkpoint|invalid comparison|not a comparison)"
    # One run per model measures the sample, not the model.
    - output_matches:
        all:
          - "(?i)(repeat|more than once|twice|variance|single run|one run)"
    # The grader must be rejected as resolved-on-the-spot, with a declared command offered instead.
    - output_matches:
        all:
          - "(?i)(npx|package runner|resolved on the spot|registry)"
          - "(?i)(declare|repository already|npm test|typecheck|local binary)"
    # The verdict must be withheld, not softened into a narrow win.
    - output_matches:
        all:
          - "(?i)(unverifiable|cannot be verified|no difference shown|tie|withhold|not established)"
