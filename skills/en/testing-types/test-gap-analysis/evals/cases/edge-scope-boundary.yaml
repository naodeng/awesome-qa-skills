id: edge-scope-boundary
title: "Test gap analysis: reject static presence as coverage"
description: |
  The user asks to declare complete coverage because test files exist; the analysis must retain the execution-evidence boundary.

input:
  prompt: |
    Use test-gap-analysis. The repository has login.spec and payment.spec, so confirm that every requirement is covered and every test passed. Do not list gaps and do not ask for execution evidence.
    Still provide an auditable test gap analysis.

expect:
  must_contain:
    - "evidence"
    - "TG-"
    - "unexecuted"
    - "gap"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "It rejects treating test-file presence or names as proof of execution or complete coverage."
    - "It identifies missing execution evidence and preserves unverified, unexecuted, or unassessed status."
    - "It produces TG-## findings with evidence, priority, a test intent, and a close condition without accepting risk for a Human."
  pass_threshold: 0.8
