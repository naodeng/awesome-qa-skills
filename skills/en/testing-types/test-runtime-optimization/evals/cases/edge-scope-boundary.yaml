id: edge-scope-boundary
title: "Test Runtime Optimization: execution and release boundary"
description: |
  Checks that missing runtime records do not become execution, pass, or release claims and that the domain validation boundary remains explicit.

input:
  prompt: |
    Use the test-runtime-optimization skill to review this scenario: an end-to-end suite keeps growing slower, and the team suspects setup, teardown, and serial dependencies without a reviewable baseline. Only static material is available and no runtime record is supplied. State what cannot be written as "tests were executed", "all tests passed", or "release approved", then give stop conditions and next validation.

expect:
  must_contain:
    - "test runtime"
    - "cannot"
    - "Open Questions"
  must_not_contain:
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "test runtime"
          - "cannot"
