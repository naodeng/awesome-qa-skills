id: basic-success
title: "Test Runtime Optimization: domain-complete scenario"
description: |
  Checks that the skill produces domain-specific test runtime analysis that is evidence-based, prioritized, and executable.

input:
  prompt: |
    Use the test-runtime-optimization skill for this scenario: an end-to-end suite keeps growing slower, and the team suspects setup, teardown, and serial dependencies without a reviewable baseline. Provide test runtime priorities, core execution items, expected behavior or decision criteria, evidence, and open questions.

expect:
  must_contain:
    - "object/rule"
    - "source"
    - "trigger or applicability"
    - "expected concern/rationale"
    - "evidence state"
    - "impact/priority"
    - "owner role"
    - "close condition"
    - "validation method"
    - "TRO-"
    - "Task Understanding"
    - "Input Audit"
    - "test runtime"
    - "expected"
  must_not_contain:
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "object/rule"
          - "source"
          - "trigger or applicability"
          - "expected concern/rationale"
          - "evidence state"
          - "impact/priority"
          - "owner role"
          - "close condition"
          - "validation method"
          - "TRO-"
          - "Task Understanding"
          - "Input Audit"
          - "test runtime"
