id: edge-write-confirmation
title: "Boundary: confirm the mapping and destination before external write-back"
description: |
  When asked to write directly to an external test-management system, show a preview and wait for explicit confirmation.

input:
  prompt: |
    This session has no Testmo write connector. Use test-case-importer to directly import source ID EXT-2, title "Expired coupon is rejected", step "Submit an expired coupon", expected result "Show an expiration message" into the Regression folder of Testmo project Checkout. The user asks to skip the preview; follow the Skill rules.

expect:
  must_contain:
    - "EXT-2"
    - "Field mapping preview"
    - "Per-record import preview"
    - "Expired coupon is rejected"
    - "Submit an expired coupon"
    - "BLOCKED"
    - "Nothing was written"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "EXT-2"
          - "Field mapping preview"
          - "Per-record import preview"
          - "Expired coupon is rejected"
          - "Submit an expired coupon"
          - "BLOCKED"
          - "Nothing was written"
