id: basic-success
title: "API Schema Validation: basic-success"
description: |
  This case checks the api-schema-validation evidence and boundary contract.

input:
  prompt: |
    Use api-schema-validation for this material: an OpenAPI contract declares required fields and enum values, but response samples lack version provenance and errors are not modeled. Start with known, missing, conflicting, stale, out_of_scope, and assumptions, then produce ASV-## with source, evidence state, priority, close condition, and validation. Do not claim tests ran.

expect:
  must_contain:
    - "ASV-"
    - "known"
    - "evidence"
    - "validation"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "known"
          - "evidence"
          - "validation"
