id: review-missing-evaluation-evidence
title: "rag-quality-testing: RAG quality: citation and answer trace — missing run evidence"
description: "Checks answer claims against retrieved chunks and identifies unsupported statements."
context:
  files:
    "structured-trace.json": |-
      {
        "trace_id": "TRACE-NORUN-RAG-QUALITY-TESTING",
        "subject": "rag-quality-testing",
        "identity": {
          "model_version": "model-A",
          "prompt_version": "prompt-1",
          "dataset_version": "dataset-1"
        },
        "run_id": null,
        "attempted": false,
        "run_evidence": [],
        "evaluation_status": "NOT_RUN"
      }
input:
  prompt: |
    Use rag-quality-testing to review structured-trace.json. Check grounding, citations, and completeness per claim; preserve chunk_id and do not treat retrieval of a relevant document as proof that the answer is supported.
    The trace has no run_id and no raw result. Output exactly these machine-readable lines:
    evaluation_status: NOT_RUN
    run_evidence: []
    domain_conclusion: UNASSESSED
expect:
  must_contain:
    - "evaluation_status: NOT_RUN"
    - "run_evidence: []"
    - "domain_conclusion: UNASSESSED"
judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "evaluation_status: NOT_RUN"
          - "run_evidence: []"
          - "domain_conclusion: UNASSESSED"
