id: edge-incomplete-input
title: "Manual testing: draft checklist from one line"
description: |
  Thin requirements still get a draft checklist plus open questions.

input:
  prompt: |
    Use manual-testing. Requirement: support points redemption. No cases, no environment notes.
    Provide a draft manual checklist and list open questions.

expect:
  must_contain:
    - "assumption"
    - "Open Question"
    - "gaps"
    - "assumptions"
    - "confirm"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "assumption"
          - "Open Questions"
          - "gaps"
          - "assumptions"
