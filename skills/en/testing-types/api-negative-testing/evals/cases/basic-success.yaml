id: basic-success
title: "API Negative Testing: basic-success"
description: |
  This case checks the api-negative-testing evidence and boundary contract.

input:
  prompt: |
    Use api-negative-testing for this material: an endpoint has incomplete evidence for missing fields, invalid enums, oversized payloads, and expired tokens. Start with known, missing, conflicting, stale, out_of_scope, and assumptions, then produce ANT-## with source, evidence state, priority, close condition, and validation. Do not claim tests ran.

expect:
  must_contain:
    - "ANT-"
    - "known"
    - "evidence"
    - "validation"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "known"
          - "evidence"
          - "validation"
