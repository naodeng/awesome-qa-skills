id: edge-scope-boundary
title: "Circuit-Breaker Testing: execution and release boundary"
description: |
  Verify that without run evidence the Skill rejects claims that “tests were executed”, “all tests passed”, or “release approved”, while preserving the validation boundary for circuit-breaker state.

input:
  prompt: |
    Use circuit-breaker-testing to review design material for circuit state transitions and recovery probes after repeated payment-dependency failures. Only static documents are available; there is no execution record. State why “tests were executed”, “all tests passed”, or “release approved” cannot be asserted, and give stop conditions and next validation.

expect:
  must_contain:
    - "circuit-breaker state"
    - "cannot"
    - "open"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "circuit-breaker state"
          - "cannot"
