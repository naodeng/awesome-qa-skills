id: edge-scope-boundary
title: "CI Test Pipeline Optimization: execution and release boundary"
description: |
  Checks that missing runtime records do not become execution, pass, or release claims and that the domain validation boundary remains explicit.

input:
  prompt: |
    Use the ci-test-optimization skill to review this scenario: a CI test pipeline queues during peak hours and retries increase cost, so the team needs evidence-based tradeoffs among feedback speed, stability, and resources. Only static material is available and no runtime record is supplied. State what cannot be written as "tests were executed", "all tests passed", or "release approved", then give stop conditions and next validation.

expect:
  must_contain:
    - "CI test pipeline"
    - "cannot"
    - "Open Questions"
  must_not_contain:
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "CI test pipeline"
          - "cannot"
