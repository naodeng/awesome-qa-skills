id: basic-success
title: "CI Test Pipeline Optimization: domain-complete scenario"
description: |
  Checks that the skill produces domain-specific CI test pipeline analysis that is evidence-based, prioritized, and executable.

input:
  prompt: |
    Use the ci-test-optimization skill for this scenario: a CI test pipeline queues during peak hours and retries increase cost, so the team needs evidence-based tradeoffs among feedback speed, stability, and resources. Provide CI test pipeline priorities, core execution items, expected behavior or decision criteria, evidence, and open questions.

expect:
  must_contain:
    - "Task Understanding"
    - "Input Audit"
    - "CI test pipeline"
    - "expected"
  must_not_contain:
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "Task Understanding"
          - "Input Audit"
          - "CI test pipeline"
