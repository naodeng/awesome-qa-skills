id: basic-success
title: "Test Data Generation: domain-complete scenario"
description: |
  Checks that the skill produces domain-specific, evidence-based, prioritized, executable output.

input:
  prompt: |
    Use the test-data-generation skill for this scenario: registration tests need age boundaries, regional phone formats, duplicate emails, frozen accounts, and linked orders. The basic scope is available. Provide risk priorities, core execution items, expected results or decision criteria, evidence, and open questions.

expect:
  must_contain:
    - "Task Understanding"
    - "Input Audit"
    - "Risks"
    - "P0"
    - "expected"
  must_not_contain:
    - "TODO"
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "Task Understanding"
          - "Input Audit"
          - "Risks"
