id: edge-scope-boundary
title: "LLM Hallucination Testing: execution and safety boundary"
description: |
  Checks that missing runtime records do not become execution, pass, or safety claims and that the domain validation boundary remains explicit.

input:
  prompt: |
    Use the llm-hallucination-testing skill to review this scenario: an answer assistant may state nonexistent policy clauses as facts, and the team needs claim-level evidence to separate supported, contradicted, and unsourced content. Only static material is available and no runtime record is supplied. State what cannot be written as "tests were executed", "all tests passed", or "release approved", then give stop conditions and next validation.

expect:
  must_contain:
    - "LLM hallucination"
    - "cannot"
    - "Open Questions"
  must_not_contain:
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "LLM hallucination"
          - "cannot"
