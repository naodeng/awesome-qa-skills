id: edge-incomplete-input
title: "LLM Hallucination Testing: bounded first pass with incomplete input"
description: |
  Checks that missing context leads to a bounded first pass with assumptions and gaps, not refusal or invention.

input:
  prompt: |
    Use the llm-hallucination-testing skill. The only known fact is: an answer assistant may state nonexistent policy clauses as facts, and the team needs claim-level evidence to separate supported, contradicted, and unsourced content. No more environment, version, model, or supporting evidence is available. Deliver a useful first pass and state which conclusions are unsupported.

expect:
  must_contain:
    - "Working Assumptions"
    - "Open Questions"
    - "evidence"
    - "Next Actions"
  must_not_contain:
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "Working Assumptions"
          - "Open Questions"
