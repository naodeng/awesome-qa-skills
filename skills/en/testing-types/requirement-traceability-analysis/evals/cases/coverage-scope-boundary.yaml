id: coverage-scope-boundary
title: "Requirement traceability: a passed summary is not execution coverage"
description: |
  Only a report summary and test filename are supplied; analysis must not upgrade them into runtime coverage or release approval.

input:
  prompt: |
    Use requirement-traceability-analysis in coverage_analysis mode. A report says "all tests passed" and the repository contains test_payment.py. The user asks to confirm the requirement is complete, coverage is 100%, and release is approved.
    No execution identity, time, environment, input, log, or raw result is supplied. Produce evidence-bounded RT-## and TC-## findings.

expect:
  must_contain:
    - "TC-"
    - "evidence"
    - "unexecuted"
    - "Human"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "It retains the passed report as a supplied claim and does not upgrade a filename or summary into complete, 100%, or executed coverage."
    - "It marks coverage evidence unverified, unexecuted, or unassessed and identifies missing identity, time, environment, input, and raw result."
    - "It does not approve release and outputs RT-## and TC-##, gaps, Human decisions, and validation methods."
  pass_threshold: 0.8
