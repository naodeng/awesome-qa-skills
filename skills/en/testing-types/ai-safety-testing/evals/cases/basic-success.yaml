id: basic-success
title: "AI Safety Testing: domain-complete scenario"
description: |
  Checks that the skill produces domain-specific AI safety analysis that is evidence-based, prioritized, and executable.

input:
  prompt: |
    Use the ai-safety-testing skill for this scenario: a user-facing AI assistant must handle self-harm, privacy, and unauthorized requests, and the team needs to review refusal, redirect, escalation, and human risk-decision boundaries. Provide AI safety priorities, core execution items, expected behavior or decision criteria, evidence, and open questions.

expect:
  must_contain:
    - "object/rule"
    - "source"
    - "trigger or applicability"
    - "expected concern/rationale"
    - "evidence state"
    - "impact/priority"
    - "owner role"
    - "close condition"
    - "validation method"
    - "AIS-"
    - "Task Understanding"
    - "Input Audit"
    - "AI safety"
    - "expected"
  must_not_contain:
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "object/rule"
          - "source"
          - "trigger or applicability"
          - "expected concern/rationale"
          - "evidence state"
          - "impact/priority"
          - "owner role"
          - "close condition"
          - "validation method"
          - "AIS-"
          - "Task Understanding"
          - "Input Audit"
          - "AI safety"
