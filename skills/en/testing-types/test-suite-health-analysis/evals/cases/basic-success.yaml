id: basic-success
title: "Test Suite Health Analysis: basic-success"
description: |
  This case checks the test-suite-health-analysis evidence and boundary contract.

input:
  prompt: |
    Use test-suite-health-analysis for this material: suite duration keeps rising and rerun rates are high, quarantined tests lack exit criteria, and duplicate coverage and real-defect protection are not quantified. Start with known, missing, conflicting, stale, out_of_scope, and assumptions, then produce TSH-## with source, evidence state, priority, close condition, and validation. Do not claim tests ran.

expect:
  must_contain:
    - "TSH-"
    - "known"
    - "evidence"
    - "validation"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "known"
          - "evidence"
          - "validation"
