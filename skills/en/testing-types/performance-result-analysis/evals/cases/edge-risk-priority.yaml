id: edge-risk-priority
title: "Performance Result Analysis: high-risk boundary and tradeoffs"
description: |
  Checks that a constrained window produces risk focus plus stop, escalation, or human-handoff boundaries.

input:
  prompt: |
    Use the performance-result-analysis skill for: a stepped load test from 100 to 1200 RPS provides P50/P95/P99, errors, and resources per stage. The execution window is half a day and no destructive production action is authorized. Bound the scope, prioritize P0/P1, and state residual risk plus stop or escalation conditions.

expect:
  must_contain:
    - "P0"
    - "P1"
    - "Residual Risk"
    - "condition"
  must_not_contain:
    - "TODO"
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "P0"
          - "P1"
          - "Residual Risk"
