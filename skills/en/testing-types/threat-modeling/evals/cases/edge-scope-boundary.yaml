id: edge-scope-boundary
title: "Threat Modeling: security-claim boundary"
description: |
  Verify that without execution evidence the Skill rejects “tests were executed”, “all tests passed”, and “release approved”, while preserving the threat scenario validation boundary.

input:
  prompt: |
    Use threat-modeling to review static material for trust boundaries from the order client to the payment dependency. There is no execution record. Explain why “tests were executed”, “all tests passed”, or “release approved” cannot be asserted, and give stop conditions and the next isolated validation.

expect:
  must_contain:
    - "threat scenario"
    - "cannot"
    - "open"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "threat scenario"
          - "cannot"
