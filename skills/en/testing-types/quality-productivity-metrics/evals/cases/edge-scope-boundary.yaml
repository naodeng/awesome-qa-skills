id: edge-scope-boundary
title: "Quality Productivity Metrics: execution and release boundary"
description: |
  Checks that missing runtime records do not become execution, pass, or release claims and that the domain validation boundary remains explicit.

input:
  prompt: |
    Use the quality-productivity-metrics skill to review this scenario: an organization wants to compare teams using delivery speed, escaped defects, and test output while avoiding individual-performance misuse and risk-avoidance incentives. Only static material is available and no runtime record is supplied. State what cannot be written as "tests were executed", "all tests passed", or "release approved", then give stop conditions and next validation.

expect:
  must_contain:
    - "quality productivity"
    - "cannot"
    - "Open Questions"
  must_not_contain:
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "quality productivity"
          - "cannot"
