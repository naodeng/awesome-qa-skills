id: edge-incomplete-input
title: "Quality Productivity Metrics: bounded first pass with incomplete input"
description: |
  Checks that missing context leads to a bounded first pass with assumptions and gaps, not refusal or invention.

input:
  prompt: |
    Use the quality-productivity-metrics skill. The only known fact is: an organization wants to compare teams using delivery speed, escaped defects, and test output while avoiding individual-performance misuse and risk-avoidance incentives. No more environment, version, definitions, or supporting evidence are available. Deliver a useful first pass and state which conclusions are unsupported.

expect:
  must_contain:
    - "Working Assumptions"
    - "Open Questions"
    - "evidence"
    - "Next Actions"
  must_not_contain:
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "Working Assumptions"
          - "Open Questions"
