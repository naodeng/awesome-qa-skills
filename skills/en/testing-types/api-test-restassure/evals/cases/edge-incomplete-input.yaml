id: edge-incomplete-input
title: "RestAssured: one-line ask still yields draft"
description: |
  With only one sentence and no schema, still draft RestAssured structure and list gaps/assumptions.

input:
  prompt: |
    Use api-test-restassure. I only know: automate points redemption. No OpenAPI and no existing Maven layout notes.
    Give a usable REST Assured draft structure and list required gaps and assumptions.

expect:
  must_contain:
    - "assumption"
    - "Open Questions"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "assumption"
          - "REST Assured"
