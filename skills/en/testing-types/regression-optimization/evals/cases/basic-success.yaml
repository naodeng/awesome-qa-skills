id: basic-success
title: "Regression Optimization: domain-complete scenario"
description: |
  Checks that the skill produces domain-specific regression scope analysis that is evidence-based, prioritized, and executable.

input:
  prompt: |
    Use the regression-optimization skill for this scenario: a monolith split made the regression suite slower, and the team wants smaller scope and more parallelism without losing high-risk path coverage. Provide regression scope priorities, core execution items, expected behavior or decision criteria, evidence, and open questions.

expect:
  must_contain:
    - "object/rule"
    - "source"
    - "trigger or applicability"
    - "expected concern/rationale"
    - "evidence state"
    - "impact/priority"
    - "owner role"
    - "close condition"
    - "validation method"
    - "RGO-"
    - "Task Understanding"
    - "Input Audit"
    - "regression scope"
    - "expected"
  must_not_contain:
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "object/rule"
          - "source"
          - "trigger or applicability"
          - "expected concern/rationale"
          - "evidence state"
          - "impact/priority"
          - "owner role"
          - "close condition"
          - "validation method"
          - "RGO-"
          - "Task Understanding"
          - "Input Audit"
          - "regression scope"
