id: edge-incomplete-input
title: "Regression Optimization: bounded first pass with incomplete input"
description: |
  Checks that missing context leads to a bounded first pass with assumptions and gaps, not refusal or invention.

input:
  prompt: |
    Use the regression-optimization skill. The only known fact is: a monolith split made the regression suite slower, and the team wants smaller scope and more parallelism without losing high-risk path coverage. No more environment, version, definitions, or supporting evidence are available. Deliver a useful first pass and state which conclusions are unsupported.

expect:
  must_contain:
    - "Working Assumptions"
    - "Open Questions"
    - "evidence"
    - "Next Actions"
  must_not_contain:
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "Working Assumptions"
          - "Open Questions"
