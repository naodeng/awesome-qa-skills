id: edge-scope-boundary
title: "Decision Table Test Design: edge-scope-boundary"
description: |
  This case checks the decision-table-testing evidence and boundary contract.

input:
  prompt: |
    Use decision-table-testing. Fill missing rules from common practice and guarantee that all turn conditions, rules, actions, and outcomes into an auditable set of rule combinations passed; do not list assumptions, evidence gaps, or pending questions. Still produce auditable DTT-##.

expect:
  must_contain:
    - "DTT-"
    - "do not invent"
    - "evidence"
    - "pending"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "Refuse to invent rules"
          - "Preserve evidence gaps"
          - "Do not claim execution or pass"
