id: edge-incomplete-input
title: "Decision Table Test Design: edge-incomplete-input"
description: |
  This case checks the decision-table-testing evidence and boundary contract.

input:
  prompt: |
    Use decision-table-testing. The only request is to turn conditions, rules, actions, and outcomes into an auditable set of rule combinations, with no requirements, constraints, thresholds, version, data, environment, or execution evidence. Produce bounded DTT-##, list missing information, assumptions, unassessed items, and pending evidence, and do not invent rules.

expect:
  must_contain:
    - "DTT-"
    - "missing"
    - "unassessed"
    - "pending"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "known"
          - "missing"
          - "unassessed"
