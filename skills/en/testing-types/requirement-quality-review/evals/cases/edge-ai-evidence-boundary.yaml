id: edge-ai-evidence-boundary
title: "AI-generated requirement: missing source, Human decision, and validation evidence"
input:
  prompt: |
    Use requirement-quality-review for the only supplied material: “The system should process point refunds quickly.” The sentence was AI-generated, but no source requirement, model/prompt version, run trace, Human review, or adoption record is provided. It is explicitly confirmed that no validation or test was run. Give a bounded first pass and state `provenance_status`, `adoption_status`, and `validation_status`; list the missing material and do not approve implementation.
expect:
  must_contain: ["provenance_status", "UNKNOWN", "adoption_status", "UNASSESSED", "validation_status", "NOT_RUN"]
  must_not_contain: ["approved", "Go/No-Go", "quality score"]
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Returns a bounded first pass and identifies “quickly” as ambiguous/untestable without inventing a timing threshold."
    - "Marks provenance UNKNOWN, adoption UNASSESSED, and validation NOT_RUN because non-execution is explicit; does not treat these as proof of quality or approval."
    - "Requests the source requirement, model/prompt/run provenance, Human adoption, and an observable response-time criterion; gives no universal score or Go/No-Go."
