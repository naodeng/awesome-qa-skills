schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .

engine:
  name: claude_code

cases:
  files:
    - evals/cases/basic-success.yaml
    - evals/cases/edge-incomplete-input.yaml
    - evals/cases/edge-scope-boundary.yaml
    - evals/cases/review-complete-requirement-control.yaml
    - evals/cases/review-located-high-risk-gap.yaml
    - evals/cases/review-ai-generated-spec.yaml
    - evals/cases/edge-ai-evidence-boundary.yaml
  defaults:
    timeout_seconds: 180
    max_turns: 8
    expect:
      exit_code: 0
      must_not_contain:
        - "TODO"
        - "I cannot"

report:
  formats: [json]
benchmark:
  enabled: true
