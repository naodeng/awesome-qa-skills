schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .

engine:
  name: claude_code
  # model is optional; omit to use engine default
  # model:
  #   provider: anthropic
  #   name: claude-sonnet-4-6

cases:
  files:
    - evals/cases/basic-success.yaml
    - evals/cases/edge-incomplete-input.yaml
    - evals/cases/edge-risk-priority.yaml
    - evals/cases/prompt-regression-basic-success.yaml
    - evals/cases/prompt-regression-missing-baseline.yaml
    - evals/cases/prompt-regression-scope-boundary.yaml
    - evals/cases/review-paired-parser-semantic.yaml
    - evals/cases/review-changed-model-control.yaml
    - evals/cases/review-missing-evaluation-evidence.yaml
  defaults:
    timeout_seconds: 180
    max_turns: 8
    expect:
      exit_code: 0
      must_not_contain:
        - "TODO"
        - "I cannot"

benchmark:
  enabled: true

report:
  formats: [json]
