id: basic-success
title: "Quality Metrics Design: domain-complete scenario"
description: |
  Checks that the skill produces domain-specific quality metric analysis that is evidence-based, prioritized, and executable.

input:
  prompt: |
    Use the quality-metrics-design skill for this scenario: a team wants to use escaped-defect rate, regression pass rate, and repair time to measure quality, but numerator, denominator, sources, and windows are not aligned. Provide quality metric priorities, core execution items, expected behavior or decision criteria, evidence, and open questions.

expect:
  must_contain:
    - "object/rule"
    - "source"
    - "trigger or applicability"
    - "expected concern/rationale"
    - "evidence state"
    - "impact/priority"
    - "owner role"
    - "close condition"
    - "validation method"
    - "QMD-"
    - "Task Understanding"
    - "Input Audit"
    - "quality metric"
    - "expected"
  must_not_contain:
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "object/rule"
          - "source"
          - "trigger or applicability"
          - "expected concern/rationale"
          - "evidence state"
          - "impact/priority"
          - "owner role"
          - "close condition"
          - "validation method"
          - "QMD-"
          - "Task Understanding"
          - "Input Audit"
          - "quality metric"
