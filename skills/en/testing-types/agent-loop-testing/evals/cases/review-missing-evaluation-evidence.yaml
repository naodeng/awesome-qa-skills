id: review-missing-evaluation-evidence
title: "agent-loop-testing: Agent loop: stop condition and budget trace — missing run evidence"
description: "Checks loop review for iteration count, budget, and stop reason."
context:
  files:
    "structured-trace.json": |-
      {
        "trace_id": "TRACE-NORUN-AGENT-LOOP-TESTING",
        "subject": "agent-loop-testing",
        "identity": {
          "model_version": "model-A",
          "prompt_version": "prompt-1",
          "dataset_version": "dataset-1"
        },
        "run_id": null,
        "attempted": false,
        "run_evidence": [],
        "evaluation_status": "NOT_RUN"
      }
input:
  prompt: |
    Use agent-loop-testing to review structured-trace.json. Compare max_iterations, budget, and stop_reason for overrun or premature termination; preserve iteration_id and evidence.
    The trace has no run_id and no raw result. Output exactly these machine-readable lines:
    evaluation_status: NOT_RUN
    run_evidence: []
    domain_conclusion: UNASSESSED
expect:
  must_contain:
    - "evaluation_status: NOT_RUN"
    - "run_evidence: []"
    - "domain_conclusion: UNASSESSED"
judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "evaluation_status: NOT_RUN"
          - "run_evidence: []"
          - "domain_conclusion: UNASSESSED"
