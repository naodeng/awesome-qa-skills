id: trajectory-evidence
title: "agent-loop-testing: Agent loop: stop condition and budget trace"
description: "Checks loop review for iteration count, budget, and stop reason."
context:
  files:
    "structured-trace.json": |-
      {
        "trace_id": "TRACE-ALT-001",
        "subject": "agent-loop-testing",
        "run_id": "RUN-ALT-001",
        "attempted": true,
        "max_iterations": 3,
        "budget_limit": 100,
        "iterations": [
          {
            "iteration_id": 1,
            "tokens": 28,
            "action": "search"
          },
          {
            "iteration_id": 2,
            "tokens": 31,
            "action": "search"
          },
          {
            "iteration_id": 3,
            "tokens": 55,
            "action": "search"
          }
        ],
        "stop_reason": "max_iterations",
        "total_tokens": 114,
        "run_evidence": [
          "trace://RUN-ALT-001"
        ]
      }
input:
  prompt: |
    Use agent-loop-testing to review structured-trace.json. Compare max_iterations, budget, and stop_reason for overrun or premature termination; preserve iteration_id and evidence.
expect:
  must_contain:
    - "TRACE-ALT-001"
    - "iteration_id"
    - "114"
judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "TRACE-ALT-001"
          - "iteration_id"
          - "114"
