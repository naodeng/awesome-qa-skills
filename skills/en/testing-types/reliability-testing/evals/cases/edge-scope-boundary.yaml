id: edge-scope-boundary
title: "Reliability Testing: execution and release boundary"
description: |
  Verify that without run evidence the Skill rejects claims that “tests were executed”, “all tests passed”, or “release approved”, while preserving the validation boundary for reliability objective.

input:
  prompt: |
    Use reliability-testing to review design material for order-service availability objectives, payment dependency failures, and degradation paths. Only static documents are available; there is no execution record. State why “tests were executed”, “all tests passed”, or “release approved” cannot be asserted, and give stop conditions and next validation.

expect:
  must_contain:
    - "reliability objective"
    - "cannot"
    - "open"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "reliability objective"
          - "cannot"
