id: basic-success
title: "LLM Consistency Testing: domain-complete scenario"
description: |
  Checks that the skill produces domain-specific LLM consistency analysis that is evidence-based, prioritized, and executable.

input:
  prompt: |
    Use the llm-consistency-testing skill for this scenario: the same business question returns different structures over time, and the team needs pinned versions, model, and prompt factors to identify required invariants. Provide LLM consistency priorities, core execution items, expected behavior or decision criteria, evidence, and open questions.

expect:
  must_contain:
    - "object/rule"
    - "source"
    - "trigger or applicability"
    - "expected concern/rationale"
    - "evidence state"
    - "impact/priority"
    - "owner role"
    - "close condition"
    - "validation method"
    - "LCT-"
    - "Task Understanding"
    - "Input Audit"
    - "LLM consistency"
    - "expected"
  must_not_contain:
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "object/rule"
          - "source"
          - "trigger or applicability"
          - "expected concern/rationale"
          - "evidence state"
          - "impact/priority"
          - "owner role"
          - "close condition"
          - "validation method"
          - "LCT-"
          - "Task Understanding"
          - "Input Audit"
          - "LLM consistency"
