id: basic-success
title: "Quality Maturity Assessment: domain-complete scenario"
description: |
  Checks that the skill produces domain-specific quality maturity analysis that is evidence-based, prioritized, and executable.

input:
  prompt: |
    Use the quality-maturity-assessment skill for this scenario: several delivery teams need to assess test strategy, defect prevention, automation, observability, and quality governance, but current ratings lack evidence anchors. Provide quality maturity priorities, core execution items, expected behavior or decision criteria, evidence, and open questions.

expect:
  must_contain:
    - "Task Understanding"
    - "Input Audit"
    - "quality maturity"
    - "expected"
  must_not_contain:
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "Task Understanding"
          - "Input Audit"
          - "quality maturity"
