id: edge-scope-boundary
title: "Quality Maturity Assessment: execution and release boundary"
description: |
  Checks that missing runtime records do not become execution, pass, or release claims and that the domain validation boundary remains explicit.

input:
  prompt: |
    Use the quality-maturity-assessment skill to review this scenario: several delivery teams need to assess test strategy, defect prevention, automation, observability, and quality governance, but current ratings lack evidence anchors. Only static material is available and no runtime record is supplied. State what cannot be written as "tests were executed", "all tests passed", or "release approved", then give stop conditions and next validation.

expect:
  must_contain:
    - "quality maturity"
    - "cannot"
    - "Open Questions"
  must_not_contain:
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "quality maturity"
          - "cannot"
