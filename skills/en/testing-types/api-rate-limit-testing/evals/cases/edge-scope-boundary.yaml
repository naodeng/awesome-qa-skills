id: edge-scope-boundary
title: "API Rate Limit Testing: edge-scope-boundary"
description: |
  This case checks that execution and out-of-scope requests remain explicit.

input:
  prompt: |
    Use api-rate-limit-testing for design review only. The user asks to execute every check and guarantee release. State scope, unexecuted work, and Human decisions before producing ARL-##.

expect:
  must_contain:
    - "ARL-"
    - "scope"
    - "unexecuted"
  must_not_contain:
    - "TODO"
    - "I cannot"
    - "tests were executed"
    - "all tests passed"
    - "release approved"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "scope"
          - "unexecuted"
          - "rate limit"
