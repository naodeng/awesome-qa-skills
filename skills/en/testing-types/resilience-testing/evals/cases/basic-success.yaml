id: basic-success
title: "Resilience Testing: domain output with complete input"
description: |
  Verify that the Skill produces an evidence-based, prioritized, reviewable result about degradation behavior, isolation boundaries, recovery capability, and residual risk.

input:
  prompt: |
    Use the resilience-testing Skill to analyze rate limiting, degradation, and recovery design for the order service under traffic spikes. The system scope, isolated environment, main dependencies, and release constraints are provided. Produce domain risks, expected results, evidence gaps, priorities, and open questions.

expect:
  must_contain:
    - "object/rule"
    - "source"
    - "trigger or applicability"
    - "expected concern/rationale"
    - "evidence state"
    - "impact/priority"
    - "owner role"
    - "close condition"
    - "validation method"
    - "RES-"
    - "resilience objective"
    - "priority"
    - "evidence"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "object/rule"
          - "source"
          - "trigger or applicability"
          - "expected concern/rationale"
          - "evidence state"
          - "impact/priority"
          - "owner role"
          - "close condition"
          - "validation method"
          - "RES-"
          - "resilience objective"
          - "open"
