id: edge-scope-boundary
title: "Resilience Testing: execution and release boundary"
description: |
  Verify that without run evidence the Skill rejects claims that “tests were executed”, “all tests passed”, or “release approved”, while preserving the validation boundary for resilience objective.

input:
  prompt: |
    Use resilience-testing to review design material for rate limiting, degradation, and recovery design for the order service under traffic spikes. Only static documents are available; there is no execution record. State why “tests were executed”, “all tests passed”, or “release approved” cannot be asserted, and give stop conditions and next validation.

expect:
  must_contain:
    - "resilience objective"
    - "cannot"
    - "open"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "resilience objective"
          - "cannot"
