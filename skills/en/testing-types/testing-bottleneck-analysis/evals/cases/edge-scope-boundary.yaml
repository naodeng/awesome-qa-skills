id: edge-scope-boundary
title: "Testing Bottleneck Analysis: execution and release boundary"
description: |
  Checks that missing runtime records do not become execution, pass, or release claims and that the domain validation boundary remains explicit.

input:
  prompt: |
    Use the testing-bottleneck-analysis skill to review this scenario: iteration testing repeatedly waits on environments, data preparation, and manual approval, and the team needs to locate the actual bottleneck rather than add people by intuition. Only static material is available and no runtime record is supplied. State what cannot be written as "tests were executed", "all tests passed", or "release approved", then give stop conditions and next validation.

expect:
  must_contain:
    - "testing bottleneck"
    - "cannot"
    - "Open Questions"
  must_not_contain:
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "testing bottleneck"
          - "cannot"
