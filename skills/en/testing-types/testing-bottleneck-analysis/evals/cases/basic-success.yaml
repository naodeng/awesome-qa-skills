id: basic-success
title: "Testing Bottleneck Analysis: domain-complete scenario"
description: |
  Checks that the skill produces domain-specific testing bottleneck analysis that is evidence-based, prioritized, and executable.

input:
  prompt: |
    Use the testing-bottleneck-analysis skill for this scenario: iteration testing repeatedly waits on environments, data preparation, and manual approval, and the team needs to locate the actual bottleneck rather than add people by intuition. Provide testing bottleneck priorities, core execution items, expected behavior or decision criteria, evidence, and open questions.

expect:
  must_contain:
    - "object/rule"
    - "source"
    - "trigger or applicability"
    - "expected concern/rationale"
    - "evidence state"
    - "impact/priority"
    - "owner role"
    - "close condition"
    - "validation method"
    - "TBA-"
    - "Task Understanding"
    - "Input Audit"
    - "testing bottleneck"
    - "expected"
  must_not_contain:
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "object/rule"
          - "source"
          - "trigger or applicability"
          - "expected concern/rationale"
          - "evidence state"
          - "impact/priority"
          - "owner role"
          - "close condition"
          - "validation method"
          - "TBA-"
          - "Task Understanding"
          - "Input Audit"
          - "testing bottleneck"
