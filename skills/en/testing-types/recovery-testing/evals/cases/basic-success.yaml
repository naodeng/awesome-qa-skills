id: basic-success
title: "Recovery Testing: domain output with complete input"
description: |
  Verify that the Skill produces an evidence-based, prioritized, reviewable result about recovery point, recovery time, recovery steps, validation evidence, and human takeover.

input:
  prompt: |
    Use the recovery-testing Skill to analyze data recovery objectives and validation preparation after a payment-service failure. The system scope, isolated environment, main dependencies, and release constraints are provided. Produce domain risks, expected results, evidence gaps, priorities, and open questions.

expect:
  must_contain:
    - "object/rule"
    - "source"
    - "trigger or applicability"
    - "expected concern/rationale"
    - "evidence state"
    - "impact/priority"
    - "owner role"
    - "close condition"
    - "validation method"
    - "RCV-"
    - "recovery objective"
    - "priority"
    - "evidence"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "object/rule"
          - "source"
          - "trigger or applicability"
          - "expected concern/rationale"
          - "evidence state"
          - "impact/priority"
          - "owner role"
          - "close condition"
          - "validation method"
          - "RCV-"
          - "recovery objective"
          - "open"
