id: basic-success
title: "Flaky Test Analysis: domain-complete scenario"
description: |
  Checks that the skill produces domain-specific, evidence-based, prioritized, executable output.

input:
  prompt: |
    Use the flaky-test-analysis skill for this scenario: a Playwright login test fails about 8% in CI but is stable locally, around navigation waits and cookie reads. The basic scope is available. Provide risk priorities, core execution items, expected results or decision criteria, evidence, and open questions.

expect:
  must_contain:
    - "Task Understanding"
    - "Input Audit"
    - "Risks"
    - "P0"
    - "expected"
  must_not_contain:
    - "TODO"
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "Task Understanding"
          - "Input Audit"
          - "Risks"
