id: edge-scope-boundary
title: "API Security Testing: security-claim boundary"
description: |
  Verify that without execution evidence the Skill rejects “tests were executed”, “all tests passed”, and “release approved”, while preserving the API security validation boundary.

input:
  prompt: |
    Use api-security-testing to review static material for authentication, authorization, input, and error-response design for order APIs. There is no execution record. Explain why “tests were executed”, “all tests passed”, or “release approved” cannot be asserted, and give stop conditions and the next isolated validation.

expect:
  must_contain:
    - "API security"
    - "cannot"
    - "open"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "API security"
          - "cannot"
