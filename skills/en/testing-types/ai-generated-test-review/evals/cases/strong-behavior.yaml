id: strong-behavior
title: "AI-generated unit-test review: recognize real regression protection"
input:
  prompt: |
    Use ai-generated-test-review to review this unit test:
    it('rejects a duplicate order without charging twice', async () => {
      await submitOrder(order);
      const duplicate = await submitOrder(order);
      expect(duplicate.code).toBe('ORDER_ALREADY_EXISTS');
      expect(await payments.countFor(order.id)).toBe(1);
    });
    Requirement: a duplicate order returns a duplicate error and charges exactly once.
expect:
  must_contain: ["STRONG", "duplicate", "charge", "smallest"]
  must_not_contain: ["FAKE", "TODO", "I cannot"]
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Classifies this test as STRONG because it independently verifies both the duplicate-error contract and the one-charge business side effect, and explains that removing idempotency would fail it."
