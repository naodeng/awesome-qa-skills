id: fake-mocked-subject
title: "AI-generated unit-test review: recognize mocked subject"
input:
  prompt: |
    Use ai-generated-test-review to review:
    const orderService = { create: vi.fn().mockResolvedValue({ id: '1' }) };
    it('creates an order', async () => {
      await orderService.create(input);
      expect(orderService.create).toHaveBeenCalledWith(input);
    });
    The real duplicate-order validation in orderService.create is the subject under test.
expect:
  must_contain: ["FAKE", "mock", "smallest", "missing assertion"]
  must_not_contain: ["STRONG", "TODO", "I cannot"]
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Classifies this test as FAKE; identifies that the subject orderService.create is replaced with a mock and only a mock call is asserted, so broken real duplicate-order validation would still pass."
