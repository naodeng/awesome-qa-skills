id: trajectory-evidence
title: "AI-generated test trajectory: detect a false green from mocking the subject"
description: "Uses a structured generation trace, assertions, and requirement to separate test design from run evidence."
context:
  files:
    "renewal-contract.md": |-
      A declined card must leave the subscription inactive and preserve a retryable payment failure.
    "generated-test.js": |-
      test('renews a subscription', async () => {
        jest.spyOn(subscriptionService, 'renew').mockResolvedValue({ status: 'active' });
        const result = await subscriptionService.renew('S-7');
        expect(result.status).toBe('active');
      });
    "test-generation-trace.json": |-
      {
        "run_id": "TEST-RUN-19",
        "source": {"tool": "coding-agent", "model": "model-v3"},
        "events": [
          {"step_id": "T1", "type": "task.received", "source_id": "renewal-contract.md"},
          {"step_id": "T2", "type": "tool.call", "tool": "read_file", "args": {"path": "renewal-contract.md"}, "result_id": "TR2"},
          {"step_id": "T3", "type": "tool.call", "tool": "edit_file", "args": {"path": "generated-test.js", "change": "mock subscriptionService.renew to return active and assert the preset value"}, "result_id": "TR3"},
          {"step_id": "T4", "type": "tool.call", "tool": "run_command", "args": {"command": "npm test -- renewal.test.js"}, "result": "Agent-reported exit 0", "artifact": null}
        ]
      }
input:
  prompt: |
    Use ai-generated-test-review to statically review `renewal-contract.md`, `generated-test.js`, and `test-generation-trace.json`. Classify the test STRONG/WEAK/FAKE and state the smallest escaping defect. Preserve run/step IDs and distinguish the Agent-reported exit code from independent run evidence. Do not run commands.
expect:
  must_contain: ["FAKE", "subscriptionService.renew", "TEST-RUN-19", "T3", "UNKNOWN"]
  must_not_contain: ["independently verified", "production logic executed"]
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Classifies the test FAKE because it mocks the subject method to return active and asserts that preset value; cites the conflict with the declined-card contract."
    - "States a smallest escaping defect: renewal could activate a declined-card subscription while the mocked test still passes."
    - "Preserves TEST-RUN-19 and relevant step IDs (especially T3/T4), treats the command result as Agent-reported without an artifact, and marks independent execution evidence UNKNOWN."
    - "Does not run commands or claim production logic was exercised."
