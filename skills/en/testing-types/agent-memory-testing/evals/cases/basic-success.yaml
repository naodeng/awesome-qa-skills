id: basic-success
title: "Agent Memory Testing: domain-complete scenario"
description: |
  Checks that the skill produces domain-specific Agent memory analysis that is evidence-based, prioritized, and executable.

input:
  prompt: |
    Use the agent-memory-testing skill for this scenario: an Agent with long-term memory must retain preferences within user authorization and support deletion, so the team needs to verify provenance, isolation, and forgetting boundaries. Provide Agent memory priorities, core execution items, expected behavior or decision criteria, evidence, and open questions.

expect:
  must_contain:
    - "object/rule"
    - "source"
    - "trigger or applicability"
    - "expected concern/rationale"
    - "evidence state"
    - "impact/priority"
    - "owner role"
    - "close condition"
    - "validation method"
    - "AMT-"
    - "Task Understanding"
    - "Input Audit"
    - "Agent memory"
    - "expected"
  must_not_contain:
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "object/rule"
          - "source"
          - "trigger or applicability"
          - "expected concern/rationale"
          - "evidence state"
          - "impact/priority"
          - "owner role"
          - "close condition"
          - "validation method"
          - "AMT-"
          - "Task Understanding"
          - "Input Audit"
          - "Agent memory"
