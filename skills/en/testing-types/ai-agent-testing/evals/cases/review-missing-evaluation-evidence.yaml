id: review-missing-evaluation-evidence
title: "ai-agent-testing: Agent testing: step-level trace attribution — missing run evidence"
description: "Checks that Agent conclusions use run and step evidence rather than only the final answer."
context:
  files:
    "structured-trace.json": |-
      {
        "trace_id": "TRACE-NORUN-AI-AGENT-TESTING",
        "subject": "ai-agent-testing",
        "identity": {
          "model_version": "model-A",
          "prompt_version": "prompt-1",
          "dataset_version": "dataset-1"
        },
        "run_id": null,
        "attempted": false,
        "run_evidence": [],
        "evaluation_status": "NOT_RUN"
      }
input:
  prompt: |
    Use ai-agent-testing to review structured-trace.json. Reconstruct tool-call order and final-result provenance by step_id, report evidence gaps, and do not claim task success from final_answer alone.
    The trace has no run_id and no raw result. Output exactly these machine-readable lines:
    evaluation_status: NOT_RUN
    run_evidence: []
    domain_conclusion: UNASSESSED
expect:
  must_contain:
    - "evaluation_status: NOT_RUN"
    - "run_evidence: []"
    - "domain_conclusion: UNASSESSED"
judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "evaluation_status: NOT_RUN"
          - "run_evidence: []"
          - "domain_conclusion: UNASSESSED"
