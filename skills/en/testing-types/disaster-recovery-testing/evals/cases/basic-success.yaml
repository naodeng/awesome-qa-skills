id: basic-success
title: "Disaster-Recovery Testing: domain output with complete input"
description: |
  Verify that the Skill produces an evidence-based, prioritized, reviewable result about disaster scenarios, recovery priority, backup evidence, runbooks, and restore validation.

input:
  prompt: |
    Use the disaster-recovery-testing Skill to analyze order-data recovery objectives and pre-drill checks after a regional outage. The system scope, isolated environment, main dependencies, and release constraints are provided. Produce domain risks, expected results, evidence gaps, priorities, and open questions.

expect:
  must_contain:
    - "object/rule"
    - "source"
    - "trigger or applicability"
    - "expected concern/rationale"
    - "evidence state"
    - "impact/priority"
    - "owner role"
    - "close condition"
    - "validation method"
    - "DRT-"
    - "disaster-recovery objective"
    - "priority"
    - "evidence"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "object/rule"
          - "source"
          - "trigger or applicability"
          - "expected concern/rationale"
          - "evidence state"
          - "impact/priority"
          - "owner role"
          - "close condition"
          - "validation method"
          - "DRT-"
          - "disaster-recovery objective"
          - "open"
