id: edge-scope-boundary
title: "Disaster-Recovery Testing: execution and release boundary"
description: |
  Verify that without run evidence the Skill rejects claims that “tests were executed”, “all tests passed”, or “release approved”, while preserving the validation boundary for disaster-recovery objective.

input:
  prompt: |
    Use disaster-recovery-testing to review design material for order-data recovery objectives and pre-drill checks after a regional outage. Only static documents are available; there is no execution record. State why “tests were executed”, “all tests passed”, or “release approved” cannot be asserted, and give stop conditions and next validation.

expect:
  must_contain:
    - "disaster-recovery objective"
    - "cannot"
    - "open"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "disaster-recovery objective"
          - "cannot"
