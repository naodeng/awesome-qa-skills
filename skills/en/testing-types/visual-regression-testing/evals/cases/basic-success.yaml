id: basic-success
title: "Visual Regression Testing: basic-success"
description: |
  This case checks the visual-regression-testing evidence and boundary contract.

input:
  prompt: |
    Use visual-regression-testing for this material: login screenshots vary across fonts and responsive viewports while a deliberate layout change is also being submitted. Start with known, missing, conflicting, stale, out_of_scope, and assumptions, then produce VRT-## with source, evidence state, priority, close condition, and validation. Do not claim tests ran.

expect:
  must_contain:
    - "VRT-"
    - "known"
    - "evidence"
    - "validation"
    - "visual"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "known"
          - "evidence"
          - "validation"
          - "visual"
