id: "edge-risk-priority"
title: "Bug reporting: severity needs business impact"
description: |
  Severity must be justified; use agent_judge for semantic severity differentiation.

input:
  prompt: |
    Use bug-reporting.
    Issue A: admin report export is ~20s slower but still succeeds.
    Issue B: payment succeeds but double-charges (intermittent).
    Give two short bug summaries and explain why severity differs.

expect:
  must_contain:
    - "severity"
    - "payment"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Covers both the slow-export issue and the double-charge issue as separate items"
    - "Double-charge is ranked clearly higher severity than slow export, with business-impact rationale"
    - "Separates facts from guesses; does not invent logs or accounts not provided"
  pass_threshold: 0.67
