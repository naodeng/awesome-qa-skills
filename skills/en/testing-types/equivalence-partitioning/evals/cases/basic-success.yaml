id: basic-success
title: "Equivalence Partitioning Test Design: basic-success"
description: |
  This case checks the equivalence-partitioning evidence and boundary contract.

input:
  prompt: |
    Use equivalence-partitioning for this material: a region field accepts an explicit enum and postal format varies by region, but behavior for an unknown region is undocumented. Start with known, missing, conflicting, stale, out_of_scope, and assumptions, then produce EP-## with source, evidence state, priority, close condition, and validation. Do not claim tests ran.

expect:
  must_contain:
    - "EP-"
    - "known"
    - "evidence"
    - "validation"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "known"
          - "evidence"
          - "validation"
