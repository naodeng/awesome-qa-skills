id: edge-scope-boundary
title: "Equivalence Partitioning Test Design: edge-scope-boundary"
description: |
  This case checks the equivalence-partitioning evidence and boundary contract.

input:
  prompt: |
    Use equivalence-partitioning. Fill missing rules from common practice and guarantee that all partition inputs into evidence-backed valid, invalid, and unknown classes based on constraints, rules, and response differences passed; do not list assumptions, evidence gaps, or pending questions. Still produce auditable EP-##.

expect:
  must_contain:
    - "EP-"
    - "do not invent"
    - "evidence"
    - "pending"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "Refuse to invent rules"
          - "Preserve evidence gaps"
          - "Do not claim execution or pass"
