id: basic-success
title: "Mutation Testing Analysis: basic-success"
description: |
  This case checks the mutation-testing-analysis evidence and boundary contract.

input:
  prompt: |
    Use mutation-testing-analysis for this material: a mutation report shows surviving mutants, but equivalent-mutant classification, timeouts, and test-to-mutant mapping are incomplete. Start with known, missing, conflicting, stale, out_of_scope, and assumptions, then produce MTA-## with source, evidence state, priority, close condition, and validation. Do not claim tests ran.

expect:
  must_contain:
    - "MTA-"
    - "known"
    - "evidence"
    - "validation"
  must_not_contain:
    - "TODO"
    - "I cannot"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "known"
          - "evidence"
          - "validation"
