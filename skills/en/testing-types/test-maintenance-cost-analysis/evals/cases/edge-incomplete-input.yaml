id: edge-incomplete-input
title: "Test Maintenance Cost Analysis: bounded first pass with incomplete input"
description: |
  Checks that missing context leads to a bounded first pass with assumptions and gaps, not refusal or invention.

input:
  prompt: |
    Use the test-maintenance-cost-analysis skill. The only known fact is: a test suite needs frequent repair because of product changes and environment flakiness, and the team needs to separate real maintenance cost, ownership, and improvement priority. No more environment, version, definitions, or supporting evidence are available. Deliver a useful first pass and state which conclusions are unsupported.

expect:
  must_contain:
    - "Working Assumptions"
    - "Open Questions"
    - "evidence"
    - "Next Actions"
  must_not_contain:
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "Working Assumptions"
          - "Open Questions"
