id: edge-scope-boundary
title: "Test Maintenance Cost Analysis: execution and release boundary"
description: |
  Checks that missing runtime records do not become execution, pass, or release claims and that the domain validation boundary remains explicit.

input:
  prompt: |
    Use the test-maintenance-cost-analysis skill to review this scenario: a test suite needs frequent repair because of product changes and environment flakiness, and the team needs to separate real maintenance cost, ownership, and improvement priority. Only static material is available and no runtime record is supplied. State what cannot be written as "tests were executed", "all tests passed", or "release approved", then give stop conditions and next validation.

expect:
  must_contain:
    - "maintenance cost"
    - "cannot"
    - "Open Questions"
  must_not_contain:
    - "I cannot"
    - "unable to help"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "maintenance cost"
          - "cannot"
