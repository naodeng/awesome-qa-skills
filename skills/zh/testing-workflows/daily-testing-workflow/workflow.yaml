{
  "schema_version": "1.0.0",
  "id": "daily-testing-workflow",
  "version": "1.0.0",
  "kind": "sequence",
  "title": {
    "zh": "日常测试工作流程",
    "en": "Daily Testing Workflow"
  },
  "summary": {
    "zh": "按日组织 QA 计划、执行、缺陷记录和收口。",
    "en": "Organize QA planning, execution, defect tracking, and closeout by day."
  },
  "lifecycle_state": "UNASSESSED",
  "inputs": [
    {
      "id": "user_request",
      "required": true,
      "description": "User request and available project evidence."
    }
  ],
  "outputs": [
    {
      "id": "daily_scope",
      "description": "有来源的当日目标、工作项、环境和限制。",
      "evidence_kind": "fact"
    },
    {
      "id": "test_execution_evidence",
      "description": "可用时提供范围和结果明确的已核验检查与测试记录。",
      "evidence_kind": "execution"
    },
    {
      "id": "quality_assessment",
      "description": "根据所给证据得出的就绪度、质量风险和门禁评估。",
      "evidence_kind": "inference"
    },
    {
      "id": "next_actions",
      "description": "按优先级排列的日常工作、升级事项和下一 Skill 交接。",
      "evidence_kind": "plan"
    }
  ],
  "steps": [
    {
      "id": "plan",
      "description": "Plan",
      "skill_ids": [
        "test-strategy"
      ],
      "prompt": "prompts/daily-testing-workflow.md",
      "depends_on": [],
      "on_failure": "stop",
      "permission": "read_only",
      "approval_required": false
    },
    {
      "id": "execute",
      "description": "Execute",
      "skill_ids": [
        "manual-testing",
        "functional-testing"
      ],
      "prompt": "prompts/daily-testing-workflow.md",
      "depends_on": [
        "plan"
      ],
      "on_failure": "stop",
      "permission": "read_only",
      "approval_required": false
    },
    {
      "id": "triage",
      "description": "Triage",
      "skill_ids": [
        "bug-reporting"
      ],
      "prompt": "prompts/daily-testing-workflow.md",
      "depends_on": [
        "plan",
        "execute"
      ],
      "on_failure": "stop",
      "permission": "read_only",
      "approval_required": false
    },
    {
      "id": "closeout",
      "description": "Closeout",
      "skill_ids": [
        "test-reporting"
      ],
      "prompt": "prompts/daily-testing-workflow.md",
      "depends_on": [
        "plan",
        "execute",
        "triage"
      ],
      "on_failure": "stop",
      "permission": "read_only",
      "approval_required": false
    }
  ],
  "failure_policy": {
    "on_missing_dependency": "continue_with_limitations",
    "on_blocked": "stop"
  },
  "permission_policy": {
    "default": "read_only",
    "approval_required_for": [
      "execute_command",
      "write_repo",
      "external_write",
      "publish",
      "delete",
      "release_approval"
    ]
  },
  "checkpoint_policy": {
    "host_runtime_required": true,
    "fingerprint_fields": [
      "inputs",
      "commit_sha"
    ],
    "invalidate_on_change": [
      "inputs",
      "commit_sha"
    ],
    "automatic_replay": "side_effect_free_only"
  },
  "handoff": {
    "required_fields": [
      "workflow_id",
      "source",
      "status",
      "open_gaps",
      "next_step"
    ]
  },
  "evidence_contract_version": "1.0.0"
}
