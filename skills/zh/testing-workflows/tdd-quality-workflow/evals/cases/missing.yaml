id: missing
title: "missing evidence boundary"
input:
  prompt: "请使用 $tdd-quality-workflow，只评审：开发者认为 RED 和 GREEN 都曾执行过，但日志、运行记录与版本信息均不可用，执行情况无法核实；已确认没有重构，也没有执行重构回归或变异测试。不要执行测试或修改项目，可用只读命令读取 Skill 文件。说明各阶段判断和缺失证据。\n最后附一张用于评测的表，每个阶段恰好一行，格式 `阶段 | 状态 | 依据`，阶段名必须为 RED、GREEN、REFACTOR、MUTATION；前 3 个状态只使用 VERIFIED_RED、VERIFIED_GREEN、VERIFIED_REFACTOR、INCONCLUSIVE、NOT_EXECUTED（匹配各自阶段），MUTATION 使用 EXECUTED、INCONCLUSIVE、NOT_EXECUTED。每行依据不可为空。"
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/graders/missing.py
  timeout_seconds: 30
