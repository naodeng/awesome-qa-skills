id: capability-stage-routing
title: 路由：区分 AI Native QA 与 AI for QA
description: |
  用户要验证 LLM 的幻觉和拒答行为时，路由必须指出这是 AI Native QA 能力，
  使用当前已安装的 AI 功能/LLM Skill；使用 AI 协助现有 API 测试时才应推荐 ai-assisted-testing。

input:
  prompt: |
    本用例可信 Host 安装清单：`ai-feature-testing` 和 `llm-testing` 已安装且可调用。
    请使用 discover-testing 做路由：我要评估客服 LLM 的幻觉和拒答行为。
    主推荐 `ai-feature-testing`，可选辅助 `llm-testing` 用于模型输出评估；不要把它误归类为 AI for QA，也不要虚构其它 skill。

expect:
  must_contain:
    - "AI Native QA"
    - "llm-testing"
  must_not_contain:
    - "ai-assisted-testing"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "AI Native QA"
          - "llm-testing"
