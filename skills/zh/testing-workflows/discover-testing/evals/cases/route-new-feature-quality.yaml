id: route-new-feature-quality
title: 路由：新功能质量准备 Composition route
description: |
  从新需求和验收目标开始建立可测试的质量准备时，应选择 new-feature-quality，
  以 requirements-analysis 为主，可补充 test-strategy；不在 Router 内捏造验收标准或完整测试方案。

input:
  prompt: |
    请使用 discover-testing 路由：我们要为一个新的会员积分功能澄清用户目标、验收条件和主要风险，
    当前只有一页需求草稿，还没有完整测试方案。请先分别输出一行 `目标 | ...`、`理由 | ...`、`交接 | ...`，
    再说明 route ID、唯一主 Skill 和最多一个辅助 Skill。目标应指出会员积分功能；理由应说明为何从需求草稿和
    缺失的验收标准开始使用 requirements-analysis；交接输入应包含用户目标、验收条件和主要风险。不要捏造
    验收标准，也不要写完整测试方案。最后附一个 ```json 代码块，只包含 route、primary、optional 三个字段；
    optional 无则为 null。

expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/graders/route-new-feature-quality.py
  timeout_seconds: 30
