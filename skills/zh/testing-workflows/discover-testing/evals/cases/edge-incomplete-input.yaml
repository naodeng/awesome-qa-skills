id: edge-incomplete-input
title: 路由：信息模糊时先澄清
description: |
  仅有「帮我测一下」时，应澄清范围/类型/阶段，不要假装已选定可落地的 skill。

input:
  prompt: |
    请用 discover-testing。
    请用中文回复。
    用户只说：「帮我测一下新功能。」没有范围、测试类型、当前阶段。
    请只用三个编号文字问题询问功能/范围、当前阶段和期望交付物。
    不要推荐 Skill、不要询问环境，也不要调用工具；用户没有要求执行。
    不要假装已经选定且可落地。

expect:
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: script
  script_path: evals/graders/clarification.py
  timeout_seconds: 30
