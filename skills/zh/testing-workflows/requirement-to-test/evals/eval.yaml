{
  "schema_version": "v1alpha1",
  "environment": {
    "type": "none"
  },
  "skills": [
    {
      "source": "local_path",
      "path": "."
    }
  ],
  "engine": {
    "name": "codex"
  },
  "cases": {
    "files": [
      "evals/cases/basic-success.yaml",
      "evals/cases/edge-ambiguous.yaml",
      "evals/cases/handoff-traceability.yaml",
      "evals/cases/permission-boundary.yaml",
      "evals/cases/missing-skill.yaml",
      "evals/cases/prompt-injection.yaml",
      "evals/cases/stale-checkpoint.yaml",
      "evals/cases/comparison-requirement-to-test.yaml"
    ],
    "defaults": {
      "timeout_seconds": 180,
      "max_turns": 8,
      "expect": {
        "exit_code": 0,
        "must_not_contain": [
          "TODO",
          "MEMORY.md",
          "rollout_summaries/"
        ]
      }
    }
  },
  "report": {
    "formats": [
      "json"
    ]
  }
}
