{
  "id": "comparison-requirement-to-test",
  "title": "需求到测试 Skill 对照",
  "description": "Same user prompt and rule-based assertions are used for the Skill-enabled and no-Skill arms; this is a scenario comparison, not a population-level effectiveness estimate.",
  "input": {
    "prompt": "仅使用本提示中的材料。请用中文回答。不要检查工作区/仓库、创建文件、搜索外部来源或运行命令/测试。需求：(R1) 优惠券只能用于有效订单，(R2) 每账户最多使用一次，(R3) 过期券必须拒绝。请标出需要确认的规则。使用精确章节标题“待确认规则”“风险驱动策略”“代表性用例”“需求追踪”。在“需求追踪”中将 R1、R2、R3 分别映射到至少一个用例 ID。没有执行证据时将测试执行状态标为 `NOT_RUN`。"
  },
  "expect": {
    "must_contain": [
      "风险驱动策略",
      "需求追踪",
      "R1",
      "R2",
      "R3",
      "NOT_RUN"
    ],
    "must_not_contain": [
      "需求已验证",
      "TODO"
    ]
  },
  "judge": {
    "type": "rule_based",
    "success": [
      {
        "output_contains": {
          "all": [
            "风险驱动策略",
            "需求追踪",
            "R1",
            "R2",
            "R3",
            "NOT_RUN"
          ]
        }
      }
    ]
  }
}
