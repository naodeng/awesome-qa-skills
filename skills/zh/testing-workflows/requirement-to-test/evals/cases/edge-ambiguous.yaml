{
  "id": "edge-ambiguous",
  "title": "边界：标出模糊验收条件并提出最少问题",
  "description": "输入“快速响应”未定义阈值，不得擅自设数。",
  "input": {
    "prompt": "仅使用本提示中的材料。请用中文回答。不要检查工作区/仓库、创建文件、搜索外部来源或运行命令/测试。需求说页面应快速响应，但没有响应时间阈值、设备或网络范围。请指出不可测试之处，只提出决定用例设计所需的最少澄清问题，并把依赖答案的设计标记为待定。将依赖澄清的测试设计标记为 `UNKNOWN`。"
  },
  "expect": {
    "must_contain": [
      "设备",
      "UNKNOWN"
    ],
    "must_not_contain": [
      "≤ 100ms",
      "已满足",
      "TODO"
    ]
  },
  "judge": {
    "type": "rule_based",
    "success": [
      {
        "output_contains": {
          "all": [
            "设备",
            "UNKNOWN"
          ]
        }
      }
    ]
  }
}
