id: edge-incomplete-input
title: 迭代工作流：信息不全仍给初版
description: |
  缺少故事点与环境细节时，仍应给出 Sprint 节奏初版并标明假设与缺口。

input:
  prompt: |
    请用 sprint-testing-workflow。
    我只知道「这个迭代要测一波」，没有故事列表、容量、环境与 Definition of Done。
    请先给可用的迭代测试节奏初版，并列出必须补齐的信息。

expect:
  must_contain:
    - "假设"
    - "待确认"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "假设"
          - "待确认"
