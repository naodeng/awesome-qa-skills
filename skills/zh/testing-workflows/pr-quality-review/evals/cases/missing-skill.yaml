      "rollout_summaries/",
      "TODO"
    ]
  },
  "judge": {
    "type": "rule_based",
    "success": [
      {
        "output_contains": {
          "all": [
            "UNKNOWN",
            "NOT_RUN"
          ]
        }
      }
    ]
  }
}
