{
  "id": "edge-ai-evidence-boundary",
  "title": "AI PR review: separate NOT_RUN from UNKNOWN",
  "description": "Checks status boundaries when a PR is reviewable but test/CI and generation evidence are incomplete.",
  "input": {
    "prompt": "使用 pr-quality-review 静态审查 repo-a PR #431，base 4c29a13，head 887a20f。Diff：`retry(capture, key=order.id)` 改为 `retry(capture, key=uuid4())`。负责人明确确认测试未运行，没有 CI 结果、日志或平台状态。AI/Agent 来源、模型版本和轨迹也未提供。用 `test_status`、`ci_status`、`provenance_status` 明确记录边界，继续完成静态审查，不要批准合并或称测试通过。"
  },
  "expect": {
    "must_contain": ["NOT_RUN", "UNKNOWN", "test", "CI", "provenance"],
    "must_not_contain": ["tests passed", "approved for merge"]
  },
  "judge": {
    "type": "agent_judge",
    "model": "openai/gpt-5",
    "criteria": [
      "Continues a bounded static PR review because PR identity and diff are available; missing execution evidence alone is not BLOCKED.",
      "Marks test_status NOT_RUN because non-execution is explicit, ci_status UNKNOWN because no CI result is supplied, and provenance_status UNKNOWN because generation details are absent.",
      "Does not infer AI authorship, claim tests passed, or approve merge; preserves separation between review findings and execution evidence."
    ]
  }
}
