{
  "id": "edge-incomplete-input",
  "title": "边界：没有 Diff 时不推断代码风险",
  "description": "请求没有提供代码变更内容；必须指出证据缺口。",
  "input": {
    "prompt": "这是不含仓库定位信息的示例场景；不要搜索本地文件，也不要访问 GitHub。请审查 PR #51，但没有提供 Diff、文件列表、基线 SHA 或测试/CI 结果。请说明当前可得结论、缺少的输入和下一步。测试结果未提供时，必须将测试执行/结果状态标为 UNKNOWN，不要据此说测试未运行；只有输入明确说明没有执行时才标 NOT_RUN。不要编造发现或测试结果。"
  },
  "expect": {
    "must_contain": [
      "无法",
      "UNKNOWN"
    ],
    "must_not_contain": [
      "已发现 P0",
      "测试全部通过",
      "TODO",
      "MEMORY.md",
      "rollout_summaries/"
    ]
  },
  "judge": {
    "type": "script",
    "script_path": "evals/graders/execution_status.py",
    "timeout_seconds": 30
  }
}
