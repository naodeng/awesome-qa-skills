{
  "id": "review-ai-agent-pr",
  "title": "Agent PR：将任务、轨迹、测试和 CI 证据关联",
  "description": "验证 PR 工作流能审查 Agent 代码范围和门禁完整性，并保留上游证据 ID。",
  "context": {
    "files": {
      "agent-pr-trace.json": "{\n  \"run_id\": \"AGENT-RUN-44\",\n  \"task_id\": \"PAY-12\",\n  \"goal\": \"Preserve one charge per order across webhook retries\",\n  \"source\": {\"tool\": \"coding-agent\", \"model\": \"model-v3\"},\n  \"events\": [\n    {\"step_id\": \"A1\", \"type\": \"edit\", \"path\": \"src/payment/retry.py\", \"change\": \"replace stable order idempotency key with a new UUID per attempt\"},\n    {\"step_id\": \"A2\", \"type\": \"edit\", \"path\": \"tests/test_retry.py\", \"change\": \"remove duplicate-charge assertion; keep HTTP 200\"},\n    {\"step_id\": \"A3\", \"type\": \"edit\", \"path\": \".github/workflows/required.yml\", \"change\": \"disable required payment-integration job\"},\n    {\"step_id\": \"A4\", \"type\": \"run\", \"command\": \"pytest\", \"result\": \"Agent-reported exit 0\", \"artifact\": null}\n  ],\n  \"ci_run\": null\n}"
    }
  },
  "input": {
    "prompt": "使用 pr-quality-review 审查 PR #420，base 1b5e2a0，head 7180bc2。任务要求 PAY-12：同一订单多次 webhook 重试只能扣款一次。Diff 摘录：`retry(capture, key=order.id)` 改为 `retry(capture, key=uuid4())`；测试删除 `duplicate_callback_does_not_charge_twice()` 并只检查 HTTP 200；必需 `payment-integration` job 改为 `if: false`。agent-pr-trace.json 记录了这些修改。上游证据 ID E-22 指向重试重复扣款风险。保留 E-22 及轨迹 ID，按工作流输出代码风险、测试影响、执行状态、阻断项和下一步。不要运行测试、访问 GitHub 或批准合并。"
  },
  "expect": {
    "must_contain": ["E-22", "PAY-12", "P0", "A1", "A2", "A3", "UNKNOWN", "测试影响"],
    "must_not_contain": ["CI passed", "approved for merge"]
  },
  "judge": {
    "type": "agent_judge",
    "model": "openai/gpt-5",
    "criteria": [
      "Preserves upstream evidence ID E-22 and Agent run/step IDs; identifies new UUID idempotency per retry as a P0/equivalent risk to PAY-12.",
      "Identifies the removed duplicate-charge assertion and disabled payment-integration job, explaining their test/CI impact rather than treating green status as proof.",
      "Treats A4 as an Agent-reported result without an artifact, marks CI execution/result evidence UNKNOWN, and does not claim tests passed or approve merge.",
      "Uses the required PR workflow sections and keeps facts, inferences, execution evidence, and next actions distinct."
    ]
  }
}
