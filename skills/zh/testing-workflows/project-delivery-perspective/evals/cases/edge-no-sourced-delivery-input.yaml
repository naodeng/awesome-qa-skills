id: edge-no-sourced-delivery-input
title: 项目交付视角：无可归因交付输入时只报告缺口
description: |
  策略评审阶段没有带来源的日期、产能、依赖或行动时，PM 条件输入不命中，不得编造计划。
input:
  prompt: |
    请使用 project-delivery-perspective。
    stage: test-strategy-review
    待评审策略只写“请尽快完成测试”。没有日期、产能、依赖、里程碑、责任人、行动状态或来源。
    请给出项目交付输入；不要猜测日期、人力、责任人或质量结论。
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "识别 test-strategy-review 是支持阶段，但条件参与所需的可归因交付事实未提供，因而只输出已知事实、缺口、问题和取证行动。"
    - "明确缺少日期、产能、依赖、里程碑、责任人、行动状态和来源，不编造任何一项。"
    - "不判定策略质量、测试状态或发布决定，不把“尽快”改写为具体承诺。"
  pass_threshold: 0.8
