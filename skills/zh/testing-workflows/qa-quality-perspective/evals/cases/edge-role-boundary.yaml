id: edge-role-boundary
title: "QA 质量视角：不臆造产品意图或实现事实"
description: |
  QA 可以识别可测试性与质量风险，但不能把未提供的产品意图、代码行为或实现细节写成事实。

input:
  prompt: |
    请使用 qa-quality-perspective。
    stage: code-review
    项目材料：需求只写“增加一个更快的登录方式”。未提供目标用户、验收标准、PR、Diff、代码、接口契约、设计说明、测试记录或运行结果。
    请输出 QA 质量报告。说明能够和不能够得出的结论，列出需要澄清的产品意图和需要取得的实现/测试证据。不得推断具体登录方式、代码行为、实现质量或测试通过状态。

judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "报告明确把具体登录方式、目标用户、验收标准、代码行为和实现质量视为未知或待确认，而非把任何一项编造成事实。"
    - "报告说明由于缺少 PR、Diff、代码、接口契约、测试记录和运行结果，无法验证实现行为、代码正确性、测试执行或通过状态；这类限制表述是合格的。"
    - "报告从 QA 边界提出澄清问题和所需证据，并可指出风险，但不替产品决定意图、不假定实现细节，也不宣称测试通过或质量已验证。"
  pass_threshold: 0.8
