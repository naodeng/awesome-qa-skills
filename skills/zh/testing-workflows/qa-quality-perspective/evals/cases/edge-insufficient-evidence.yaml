id: edge-insufficient-evidence
title: "QA 质量视角：缺少执行证据时明确未执行或证据不足"
description: |
  没有执行记录时，QA 不得推断测试已经执行或通过；应报告证据不足、风险和补证行动。

input:
  prompt: |
    请使用 qa-quality-perspective。
    stage: test-reporting
    项目材料：本次发布包含新的优惠券能力。未提供测试执行记录、测试结果、缺陷清单、环境信息、日志、覆盖数据或运行链接。
    请输出 QA 质量报告，明确测试是否已执行和质量结论的证据状态，并列出风险、缺口和下一步动作。不要把任何未提供的执行结果写成事实。

judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "`stage: test-reporting` 是有效阶段；即使没有执行证据，报告仍适用且必须给出完整 QA 质量报告，不得返回“不适用”或只请求补充材料。"
    - "报告明确说明没有测试执行记录、结果或其他执行证据，因此测试状态为未执行、无法确认或证据不足；不能把测试描述为已经通过或完成。"
    - "报告区分事实、推断、缺失证据和建议，并包含可测试性、风险驱动覆盖、缺陷与质量风险、建议与下一步和信心等级；指出在没有覆盖、缺陷、环境或日志证据时无法形成已验证的质量结论。"
    - "报告列出与发布相关的质量风险和可执行的补证或测试行动，不臆造通过率、缺陷数量、覆盖率、环境状态或发布批准。"
  pass_threshold: 0.8
