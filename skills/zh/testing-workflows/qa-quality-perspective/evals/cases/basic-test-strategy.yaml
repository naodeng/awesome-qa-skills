id: basic-test-strategy
title: "QA 质量视角：测试策略覆盖可测试性与风险驱动覆盖"
description: |
  QA 在测试策略阶段应检查需求是否可测试，并根据影响和不确定性给出风险驱动的覆盖优先级。

input:
  prompt: |
    请使用 qa-quality-perspective。
    stage: test-strategy
    项目材料：移动端会员续费页新增“自动续费”开关。已知：仅已绑定支付方式的会员可开启；开启后每月到期前 24 小时扣款；用户可以在到期前关闭。发布目标是下个迭代上线；支付服务为外部依赖。
    请输出 QA 质量报告，重点分析可测试性、风险驱动的测试覆盖、证据、缺陷风险和下一步动作。

judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "报告明确评估了至少一项可测试性条件，例如可观察的状态、验收口径、测试数据、环境、依赖或日志，而不是只复述需求。"
    - "报告提出按风险优先的覆盖：至少覆盖支付方式前置条件、扣款时机、关闭边界或外部支付依赖中的高影响场景，并说明优先级与影响或不确定性的关系。"
    - "报告把已提供材料、基于材料的推断和仍缺少的证据区分开，给出可执行的 QA 后续动作；不把建议写成已执行或已通过的结果。"
  pass_threshold: 0.8
