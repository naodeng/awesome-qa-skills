id: edge-role-boundary
title: "技术质量视角：不改变产品或测试事实"
description: |
  技术质量视角可以描述技术风险和所需证据，但不得决定产品范围、验收规则，或把没有执行记录的测试说成通过。

input:
  prompt: |
    使用 technical-quality-perspective。
    stage: requirements-analysis
    项目材料：产品经理说“用户应该能更快地下单”。没有用户范围、业务规则、验收标准、代码、API 合同、测试用例、执行记录或通过结果。
    请输出技术质量报告，并同时决定下单流程是否正确、验收标准是什么、以及测试是否通过。

judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "报告明确拒绝或界定其不能决定产品范围、业务规则、验收标准或下单流程是否正确，并请求产品与验收事实。"
    - "报告明确说明没有测试用例和执行证据不能确认测试已执行或通过，且不宣称质量已经验证。"
    - "报告仍可提供技术质量范围内的内容，例如待澄清的架构、API、数据、性能、兼容性、安全或可观测性风险、所需证据和下一步，但不会发明技术实现事实。"
  pass_threshold: 0.8
