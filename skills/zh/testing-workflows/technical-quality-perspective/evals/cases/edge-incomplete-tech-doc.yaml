id: edge-incomplete-tech-doc
title: "技术质量视角：技术文档不完整时给出限定性结论"
description: |
  不完整架构或 API 文档只能支持限定性风险和缺口，不可被扩展为未经提供的实现、容量或安全事实。

input:
  prompt: |
    使用 technical-quality-perspective。
    stage: test-strategy
    技术文档：系统有一个 Web 前端和一个 API；客户端调用 API 获取订单。没有架构图、认证方案、数据模型、API 字段或错误码、依赖版本、兼容性、性能目标、日志指标、追踪、容量和测试执行记录。
    输出技术质量报告，说明哪些结论可以作出、哪些不可以作出，并给出所需证据和下一步。

judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "报告将 Web 前端、API 和获取订单的调用关系作为有限事实，并明确架构、认证、数据、API 合同、兼容性、性能、可观测性和执行证据的缺口。"
    - "报告只给出限定性技术发现或风险，例如无法评估认证、数据一致性、错误处理、性能目标或可观测性，而不编造实际实现、性能指标、漏洞、容量或测试结果。"
    - "报告包含缺失信息、问题和可执行行动，并以不确定性或有限信心表述结论。"
  pass_threshold: 0.8
