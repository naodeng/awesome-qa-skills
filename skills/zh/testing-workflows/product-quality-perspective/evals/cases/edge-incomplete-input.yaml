id: edge-incomplete-input
title: 产品视角：信息不完整时区分事实和缺口
description: |
  材料不足时，不应补造业务规则；应明确已知事实、信息缺口、需要澄清的问题和受影响的行动。

input:
  prompt: |
    请使用 product-quality-perspective。
    stage: test-strategy
    项目材料：下周发布新的“优惠券”能力。
    没有需求、范围、规则、用户群、技术方案或历史数据。请输出产品质量报告：将“下周发布新的优惠券能力”作为唯一已知事实；明确业务规则、适用用户、使用门槛、有效期和叠加规则均未提供；提出待确认问题。不得把任何未提供的优惠券规则作为事实或结论；可以将其表述为待确认问题。

judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "仅将“下周发布新的优惠券能力”及其发布时间作为已提供的事实，而不把任何未提供的优惠券业务规则写成事实。"
    - "清楚区分事实和信息缺口，说明业务规则、适用用户、使用门槛、有效期和叠加规则缺失，并提出有用的待确认问题。"
    - "不臆造或断言任何优惠券资格、使用限制、金额门槛、有效期、叠加规则或其他业务规则；将此类内容明确作为未知或待确认问题是合格的。"
  pass_threshold: 0.8
