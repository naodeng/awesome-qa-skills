id: edge-gates-handoff
title: 发布工作流：进出标准与执行 skill 交接
description: |
  应写清功能冻结、RC、Go/No-Go 等门禁，并用文案说明如何交接给性能/安全/报告等执行类 skill。

input:
  prompt: |
    使用 release-testing-workflow。
    场景：功能冻结未过不得进入 RC；阻塞缺陷未清不得 Go；专项测试需在 T-5～T-4 完成。
    请写清发布阶段进出标准/门禁，并说明如何交接给执行类 skill（如 performance-testing、security-testing、test-reporting——只写 skill 名与交接要点，不要给其他 skill 的文件路径链接）。

expect:
  must_contain:
    - "进出标准"
    - "交接"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "门禁"
          - "交接"
