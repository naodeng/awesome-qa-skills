id: edge-incomplete-input
title: 发布工作流：信息不全仍给初版
description: |
  缺少确切发布日与 SLA 时，仍应给出 T-14 至 T+1 的发布节奏初版、未评估门禁状态和待补信息。

input:
  prompt: |
    请用 release-testing-workflow 并用中文回复。
    我只知道「快要发版了，帮我安排发布测试」，没有确切日期、变更列表、环境与验收标准。
    请给出从 T-14 到 T+1 的发布测试节奏初版，将未评估门禁标为 `UNKNOWN`，并列出必须补齐的信息。标题可以不同。

expect:
  must_contain:
    - "T-14"
    - "UNKNOWN"
  must_not_contain:
    - "TODO"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "T-14"
          - "UNKNOWN"
