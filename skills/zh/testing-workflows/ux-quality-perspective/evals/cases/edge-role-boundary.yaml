id: edge-role-boundary
title: UX 视角：不编造后端实现结论
description: |
  UX 质量视角不替代后端代码审查、安全评估或测试执行；缺乏相应证据时不得断言实现正确、接口可靠或测试通过。

input:
  prompt: |
    请使用 ux-quality-perspective。
    stage: test-report-review
    项目材料：报告声称“结账页体验已验收”，仅附一张桌面截图和一句“服务端订单计算已修复”。未提供后端 diff、接口记录、日志、安全评估、测试执行结果，也没有移动端或键盘测试证据。
    输出 UX 质量报告，明确 UX 能评估和不能评估的范围，说明所需证据与后续行动。不要断言后端实现正确、接口可靠、安全、测试已通过或可以发布。

judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "将桌面截图限制为可支持的 UX 视觉证据，并指出移动端、键盘等 UX 证据缺口。"
    - "明确说明不能根据材料判断后端实现正确性、接口可靠性、安全性、测试通过或发布可行性，并提出所需证据与行动。"
    - "不通过肯定表述或同义改写断言后端已修复正确、接口可靠、安全、测试通过或发布获批。"
  pass_threshold: 0.8
