id: edge-no-prototype
title: UX 视角：没有原型时报告证据缺口而非编造界面
description: |
  需求存在但未提供原型或 UI 证据时，需求分析仍可适用，但只能明确 UX 证据缺口和需要补充的材料。

input:
  prompt: |
    请使用 ux-quality-perspective。
    stage: requirements-analysis
    项目材料：需求说“用户可在账户中修改通知偏好”。未提供原型、页面说明、组件规范、用户流程、状态定义或任何跨设备规则。
    输出 UX 质量报告。不要假定存在任何开关、页面布局、提示文案、错误状态或移动端行为；说明能确认的事实、UX 证据缺口、待确认问题和下一步。

judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "将账户通知偏好可修改作为唯一产品需求事实，明确缺少原型、界面/组件说明、流程、状态和跨设备证据。"
    - "不臆造通知设置页面、开关、布局、文案、错误状态、响应式行为或其他 UI 事实。"
    - "即使没有原型，也输出有用的 UX 证据缺口、待确认问题与下一步，而不是虚构 UI 发现或无内容的拒绝。"
  pass_threshold: 0.8
