id: basic-requirements-analysis
title: UX 视角：原型需求分析覆盖信息架构、状态、一致性、响应式与无障碍
description: |
  有界面原型时，UX 质量视角应以可见证据分析导航、交互状态、一致性、响应式行为和无障碍风险。

input:
  prompt: |
    请使用 ux-quality-perspective。
    stage: requirements-analysis
    项目材料：移动端购物 App 的商品详情原型。顶部有返回和购物车；主区展示商品图、名称、价格、颜色选择和“加入购物车”；颜色缺货时该选项呈灰色；底部固定“加入购物车”按钮。需求说明：窄屏保持单列，颜色选择需要键盘可操作，并在缺货时告知原因。
    请输出 UX 质量报告，分析信息架构、交互状态、一致性、响应式行为和无障碍，并给出风险、缺口、问题和行动。

judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "以提供的商品详情原型和说明为证据，给出与信息架构、颜色缺货状态、交互一致性、窄屏行为或键盘可操作性相关的可行动 UX 分析。"
    - "区分已提供证据、推断和信息缺口；不把未给出的页面、状态或设备行为描述成已证实事实。"
    - "输出包含风险、待确认问题和有责任角色的下一步行动。"
  pass_threshold: 0.8
