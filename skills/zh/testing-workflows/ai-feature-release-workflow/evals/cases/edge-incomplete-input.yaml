id: edge-incomplete-input
title: "数据集和 judge 证据缺失时阻断 AI 发布门禁"
description: "缺少评测资产版本和原始证据的摘要不能通过发布门禁。"
input:
  prompt: |
    使用 ai-feature-release-workflow。团队称模型 v3 的准确率为 98% 并要求 Go，但没有提供数据集或 judge 版本、run ID、原始报告、样本数、置信下界或授权批准人。给出最小可用初版，指出缺失证据，不要编造阈值或批准发布。
expect:
  must_contain:
    - "evaluation_gate_status: BLOCKED"
    - "human_release_decision: PENDING"
    - "run ID"
    - "数据集"
    - "judge"
  must_not_contain:
    - "evaluation_gate_status: PASS"
    - "human_release_decision: APPROVED"
judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "evaluation_gate_status: BLOCKED"
          - "human_release_decision: PENDING"
