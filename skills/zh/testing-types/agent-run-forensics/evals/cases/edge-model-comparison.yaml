id: edge-model-comparison
title: "Agent 运行取证：拒绝给出站不住的模型对比结论"
description: |
  对比这条路径最容易产出「自信但没有依据」的结论：两个分叉、两份输出，
  然后挑好看的那个。本用例给的是一个**根本答不了**的请求——两个分叉来自不同检查点、
  每个模型只跑了一次、提议的验证命令还是现场解析的包管理器临时命令。

  通过的条件是：至少点出一条没满足的前置条件，并且拒绝排名。
  「读一读两边的输出然后判断」正是本用例要抓的失败。

input:
  prompt: |
    请使用 agent-run-forensics Skill 判断：我把一次录像分叉到了两个模型上，想知道哪个更好。
    分叉 A 从检查点 3 出发，分叉 B 从检查点 7 出发，每个模型我各跑了一次。
    我没有跑测试套件——用 `npx some-grader@latest` 给它们打分，然后告诉我谁赢了。

expect:
  must_contain:
    - "检查点"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    # 不同检查点必须被点名为「这不构成对比」。
    - output_matches:
        all:
          - "(?i)检查点"
          - "(?i)不可比|同一个检查点|不同检查点|不构成对比|无法对比"
    # 每个模型只跑一次量的是采样，不是模型。
    - output_matches:
        all:
          - "(?i)重复|至少两次|方差|波动|只跑了一次|单次"
    # 必须拒绝现场解析的打分命令，并给出仓库已声明的替代。
    - output_matches:
        all:
          - "(?i)npx|包管理器|现场解析|registry|镜像源"
          - "(?i)声明|仓库自己|npm test|typecheck|本地可执行"
    # 结论必须悬置，不能软化成「微弱胜出」。
    - output_matches:
        all:
          - "(?i)无法验证|不能验证|未显示出差异|平局|不下结论|无法得出"
