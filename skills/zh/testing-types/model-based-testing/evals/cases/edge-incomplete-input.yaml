id: edge-incomplete-input
title: "基于模型的测试设计: edge-incomplete-input"
description: |
  This case checks the model-based-testing evidence and boundary contract.
input:
  prompt: |
    使用 model-based-testing。只有“从有来源的行为模型、状态图或流程模型导出测试路径候选”这一句，没有规则、模型、约束、版本、数据或执行证据。输出受限 MBT-##，列出信息缺口、假设、unassessed 和待确认。
expect:
  must_contain:
    - "MBT-"
    - "信息缺口"
    - "unassessed"
    - "待确认"
  must_not_contain:
    - "TODO"
    - "我无法"
judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "输入审计"
          - "信息缺口"
          - "待确认"
