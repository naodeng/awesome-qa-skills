id: basic-success
title: "Agent 记忆测试：领域完整场景"
description: |
  验证 Skill 能针对Agent 记忆输入给出有证据、有优先级、可执行的产出。

input:
  prompt: |
    请使用 agent-memory-testing Skill 分析以下场景：带长期记忆的 Agent 需要在用户授权范围内保存偏好并支持删除，团队要验证记忆来源、隔离和遗忘边界。请给出Agent 记忆相关的风险优先级、核心执行项、预期结果或判断标准，并标明证据和待确认问题。

expect:
  must_contain:
    - "对象/规则"
    - "来源"
    - "触发条件或适用范围"
    - "预期关注点/理由"
    - "证据状态"
    - "影响/优先级"
    - "责任角色"
    - "关闭条件"
    - "验证方法"
    - "AMT-"
    - "任务理解"
    - "输入审计"
    - "Agent 记忆"
    - "预期"
  must_not_contain:
    - "我无法"
    - "无法提供帮助"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "对象/规则"
          - "来源"
          - "触发条件或适用范围"
          - "预期关注点/理由"
          - "证据状态"
          - "影响/优先级"
          - "责任角色"
          - "关闭条件"
          - "验证方法"
          - "AMT-"
          - "任务理解"
          - "输入审计"
          - "Agent 记忆"
