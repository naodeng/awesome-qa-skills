id: edge-incomplete-input
title: 移动端：无设备清单仍给初版
description: |
  缺少机型/系统版本时标假设与缺口。

input:
  prompt: |
    用 mobile-testing。产品说「新版本要测手机端积分兑换」，没有机型列表、没有系统版本、没有权限说明。
    请给初版，并列出必须确认的设备与环境信息。

expect:
  must_contain:
    - "假设"
    - "待确认"
    - "信息缺口"
    - "需确认"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "假设"
          - "设备"
          - "信息缺口"
