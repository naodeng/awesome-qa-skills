id: edge-incomplete-input
title: "测试有效性分析：信息不完整时的受限初版"
description: |
  验证输入不足时不会拒绝或编造，而是交付受限初版并标出假设与缺口。

input:
  prompt: |
    请使用 test-effectiveness-analysis Skill。当前只知道：团队看到测试通过率很高但线上仍有高影响缺陷，需要分析测试信号是否真的覆盖关键风险。没有更多环境、版本、口径或证据，请先给出可用初版，并明确哪些结论不能成立。

expect:
  must_contain:
    - "当前假设"
    - "信息缺口"
    - "待确认"
    - "下一步"
  must_not_contain:
    - "我无法"
    - "无法提供帮助"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "当前假设"
          - "信息缺口"
