id: basic-pass
title: "订阅升级测试报告评审"
description: |
  评审版本明确、范围完整且可与原始执行和缺陷记录逐项核对的测试报告。

input:
  prompt: |
    请评审订阅升级测试报告 TR-SUB-12 v1.3，供明天的质量会议参考。

    需求 REQ-SUB-12 v2.1：Web 和 Android 月付用户可升级年付，按剩余天数抵扣；支付失败后原套餐必须保持有效。iOS 和企业账号不在本次批准范围。验收要求包括金额边界、重复回调幂等、异步权益更新和失败回滚。
    测试策略 STRAT-SUB-4 v1.4：覆盖 Web/Android 关键旅程、抵扣 0/1/365 天边界、支付成功/余额不足/超时、重复回调、事件乱序和失败回滚；进入/退出门禁为关键旅程 100% 通过、零 P0/P1、所有失败回滚有归档证据。
    测试报告 TR-SUB-12 v1.3：候选构建 build-2026.09.18-rc2、环境 qa-billing-7，共计划并执行 146 条，146 条通过；上述范围均列为已测，未测范围为“无”，缺陷汇总为 0 个未关闭 P0/P1、2 个 P2 均在 rc2 复验通过。报告建议通过。
    执行证据 EXEC-SUB-12 v1.2：146 条用例逐条记录用例 ID、build-2026.09.18-rc2、时间戳和日志链接；关键旅程 24/24，抵扣规则 38/38，失败回滚 28/28，幂等与事件乱序 20/20，其余回归 36/36。归档哈希 manifest-77 与报告一致。
    缺陷证据 DEF-SUB-12 v1.1：P2-331 和 P2-334 状态均为 verified_fixed，复验记录关联 rc2；无其他已知缺陷。
    角色报告：产品 PRODUCT-SUB v1.0、QA QA-SUB v1.2、技术 TECH-SUB v1.1、UX UX-SUB v1.0 均引用 rc2 和上述证据，未报告矛盾或未处理高风险。
    项目行动 ACTION-SUB v1.0：Li Qing 负责归档 manifest-77，状态 done；发布会议由 Human 评审者作最终决定。

judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "给出明确的 AI 辅助建议 `recommendation: pass`，同时输出 `human_final_decision: pending`，说明 Human 保留最终决定权。"
    - "逐项核对报告、执行证据与缺陷证据的一致性，并引用 build、环境、数量、门禁和版本化来源；不得只复述报告摘要。"
    - "明确列出已测与未测范围、矛盾（无时明确写无）、残余风险（无已知实质风险时如实说明）、开放行动（无时明确写无）和全部关键来源版本。"
    - "不虚构额外测试、缺陷、风险接受、发布批准、人员或日期。"
  pass_threshold: 0.8
