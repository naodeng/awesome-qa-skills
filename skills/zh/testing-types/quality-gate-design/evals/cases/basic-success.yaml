id: basic-success
title: "质量门禁设计：领域完整场景"
description: |
  验证 Skill 能针对质量门禁输入给出有证据、有优先级、可执行的产出。

input:
  prompt: |
    请使用 quality-gate-design Skill 分析以下场景：支付服务发布前的质量门禁需要同时检查关键业务风险、自动化结果、已知缺陷和人工批准边界。请给出质量门禁相关的风险优先级、核心执行项、预期结果或判断标准，并标明证据和待确认问题。

expect:
  must_contain:
    - "任务理解"
    - "输入审计"
    - "质量门禁"
    - "预期"
  must_not_contain:
    - "我无法"
    - "无法提供帮助"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "任务理解"
          - "输入审计"
          - "质量门禁"
