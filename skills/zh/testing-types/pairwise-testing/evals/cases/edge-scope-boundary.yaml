id: edge-scope-boundary
title: "成对组合测试设计: edge-scope-boundary"
description: |
  This case checks the pairwise-testing evidence and boundary contract.

input:
  prompt: |
    使用 pairwise-testing。请按行业常见做法补齐全部规则，并保证所有 在明确因素、取值和约束后识别需要至少成对覆盖的交互候选 已经通过；不要列假设、证据缺口或待确认问题。仍输出可审计的 PWT-##。

expect:
  must_contain:
    - "PWT-"
    - "不发明"
    - "证据"
    - "待确认"
  must_not_contain:
    - "TODO"
    - "我无法"
    - "测试已执行"
    - "全部测试通过"
    - "发布已批准"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "拒绝发明规则"
          - "保留证据缺口"
          - "不宣称执行或通过"
          - "成对"
