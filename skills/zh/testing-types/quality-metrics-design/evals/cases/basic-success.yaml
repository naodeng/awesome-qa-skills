id: basic-success
title: "质量指标设计：领域完整场景"
description: |
  验证 Skill 能针对质量指标输入给出有证据、有优先级、可执行的产出。

input:
  prompt: |
    请使用 quality-metrics-design Skill 分析以下场景：团队希望用缺陷逃逸率、回归通过率和修复时长衡量质量，但尚未统一分子分母、数据源和时间窗口。请给出质量指标相关的风险优先级、核心执行项、预期结果或判断标准，并标明证据和待确认问题。

expect:
  must_contain:
    - "任务理解"
    - "输入审计"
    - "质量指标"
    - "预期"
  must_not_contain:
    - "我无法"
    - "无法提供帮助"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "任务理解"
          - "输入审计"
          - "质量指标"
