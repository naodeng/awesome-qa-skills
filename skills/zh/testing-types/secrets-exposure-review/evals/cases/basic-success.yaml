id: basic-success
title: "敏感信息暴露审查：完整输入下的安全产出"
description: |
  验证 Skill 能围绕敏感信息位置、流转、日志暴露、配置边界和轮换证据给出有证据、有优先级、可复核的安全产出。

input:
  prompt: |
    请使用 secrets-exposure-review Skill 分析配置文件、CI 日志和错误响应中的敏感信息风险。已提供系统范围、测试环境、角色和安全约束。请输出敏感信息暴露风险、预期结果、证据缺口、优先级和待确认项。

expect:
  must_contain:
    - "敏感信息暴露"
    - "优先级"
    - "证据"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "敏感信息暴露"
          - "待确认"
