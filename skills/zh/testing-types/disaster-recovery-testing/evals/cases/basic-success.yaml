id: basic-success
title: "灾备测试：完整输入下的领域产出"
description: |
  验证 Skill 能围绕灾难场景、恢复优先级、备份证据、Runbook 和恢复验证给出有证据、有优先级、可复核的领域产出。

input:
  prompt: |
    请使用 disaster-recovery-testing Skill 分析区域故障后的订单数据恢复目标和演练前检查。已提供系统范围、隔离环境、主要依赖和发布限制。请输出领域风险、预期结果、证据缺口、优先级和待确认项。

expect:
  must_contain:
    - "灾备目标"
    - "优先级"
    - "证据"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "灾备目标"
          - "待确认"
