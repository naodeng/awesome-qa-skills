id: edge-incomplete-input
title: "Agent 故障恢复测试：信息不完整时的受限初版"
description: |
  验证输入不足时不会拒绝或编造，而是交付受限初版并标出假设与缺口。

input:
  prompt: |
    请使用 agent-failure-recovery-testing Skill。当前只知道：Agent 调用外部工具超时或返回不完整结果时，团队需要判断重试、回退、升级和状态一致性是否可复核。没有更多环境、版本、模型或证据，请先给出可用初版，并明确哪些结论不能成立。

expect:
  must_contain:
    - "当前假设"
    - "信息缺口"
    - "待确认"
    - "下一步"
  must_not_contain:
    - "我无法"
    - "无法提供帮助"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "当前假设"
          - "信息缺口"
