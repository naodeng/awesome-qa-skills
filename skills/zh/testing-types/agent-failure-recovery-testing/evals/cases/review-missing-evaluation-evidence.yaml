id: review-missing-evaluation-evidence
title: "agent-failure-recovery-testing: Agent 故障恢复：重试与副作用轨迹 — missing run evidence"
description: "验证恢复分析能区分失败、重试、幂等性与重复副作用。"
context:
  files:
    "structured-trace.json": |-
      {
        "trace_id": "TRACE-NORUN-AGENT-FAILURE-RECOVERY-TESTING",
        "subject": "agent-failure-recovery-testing",
        "identity": {
          "model_version": "model-A",
          "prompt_version": "prompt-1",
          "dataset_version": "dataset-1"
        },
        "run_id": null,
        "attempted": false,
        "run_evidence": [],
        "evaluation_status": "NOT_RUN"
      }
input:
  prompt: |
    请使用 agent-failure-recovery-testing 审阅 structured-trace.json。判断重试是否发生在副作用后、idempotency_key 是否保持一致，并区分观测证据与恢复建议。
    The trace has no run_id and no raw result. Output exactly these machine-readable lines:
    evaluation_status: NOT_RUN
    run_evidence: []
    domain_conclusion: UNASSESSED
expect:
  must_contain:
    - "evaluation_status: NOT_RUN"
    - "run_evidence: []"
    - "domain_conclusion: UNASSESSED"
judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "evaluation_status: NOT_RUN"
          - "run_evidence: []"
          - "domain_conclusion: UNASSESSED"
