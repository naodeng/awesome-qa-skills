id: basic-success
title: "韧性测试：完整输入下的领域产出"
description: |
  验证 Skill 能围绕退化行为、隔离边界、恢复能力和剩余风险给出有证据、有优先级、可复核的领域产出。

input:
  prompt: |
    请使用 resilience-testing Skill 分析流量突增时订单服务的限流、降级和恢复设计。已提供系统范围、隔离环境、主要依赖和发布限制。请输出领域风险、预期结果、证据缺口、优先级和待确认项。

expect:
  must_contain:
    - "对象/规则"
    - "来源"
    - "触发条件或适用范围"
    - "预期关注点/理由"
    - "证据状态"
    - "影响/优先级"
    - "责任角色"
    - "关闭条件"
    - "验证方法"
    - "RES-"
    - "韧性目标"
    - "优先级"
    - "证据"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "对象/规则"
          - "来源"
          - "触发条件或适用范围"
          - "预期关注点/理由"
          - "证据状态"
          - "影响/优先级"
          - "责任角色"
          - "关闭条件"
          - "验证方法"
          - "RES-"
          - "韧性目标"
          - "待确认"
