id: edge-incomplete-input
title: "API 安全测试：信息不完整时的受限初版"
description: |
  验证缺少环境、版本或证据时仍能交付受限初版，并显式保留假设和缺口。

input:
  prompt: |
    请使用 api-security-testing。我只知道需要审查订单 API 的认证、越权、输入和错误响应设计，没有代码、配置、版本或历史结果。请给初版，并列出 known、missing、conflicting、stale、out_of_scope、assumptions 和必须补充的信息。

expect:
  must_contain:
    - "假设"
    - "缺口"
    - "待确认"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "假设"
          - "缺口"
