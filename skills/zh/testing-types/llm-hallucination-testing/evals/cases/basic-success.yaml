id: basic-success
title: "LLM 幻觉测试：领域完整场景"
description: |
  验证 Skill 能针对LLM 幻觉输入给出有证据、有优先级、可执行的产出。

input:
  prompt: |
    请使用 llm-hallucination-testing Skill 分析以下场景：回答助手可能把不存在的政策条款说成事实，团队需要基于声明级证据区分支持、矛盾和无来源内容。请给出LLM 幻觉相关的风险优先级、核心执行项、预期结果或判断标准，并标明证据和待确认问题。

expect:
  must_contain:
    - "任务理解"
    - "输入审计"
    - "LLM 幻觉"
    - "预期"
  must_not_contain:
    - "我无法"
    - "无法提供帮助"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "任务理解"
          - "输入审计"
          - "LLM 幻觉"
