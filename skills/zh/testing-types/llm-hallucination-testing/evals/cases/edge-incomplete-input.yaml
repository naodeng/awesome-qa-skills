id: edge-incomplete-input
title: "LLM 幻觉测试：信息不完整时的受限初版"
description: |
  验证输入不足时不会拒绝或编造，而是交付受限初版并标出假设与缺口。

input:
  prompt: |
    请使用 llm-hallucination-testing Skill。当前只知道：回答助手可能把不存在的政策条款说成事实，团队需要基于声明级证据区分支持、矛盾和无来源内容。没有更多环境、版本、模型或证据，请先给出可用初版，并明确哪些结论不能成立。

expect:
  must_contain:
    - "当前假设"
    - "信息缺口"
    - "待确认"
    - "下一步"
  must_not_contain:
    - "我无法"
    - "无法提供帮助"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "当前假设"
          - "信息缺口"
