id: basic-success
title: "长运行 Agent 测试：领域完整场景"
description: |
  验证 Skill 能针对长运行 Agent输入给出有证据、有优先级、可执行的产出。

input:
  prompt: |
    请使用 agent-long-running-testing Skill 分析以下场景：数据迁移 Agent 可能运行数小时，团队需要设计检查点、心跳、恢复、取消和重复提交的证据边界。请给出长运行 Agent相关的风险优先级、核心执行项、预期结果或判断标准，并标明证据和待确认问题。

expect:
  must_contain:
    - "对象/规则"
    - "来源"
    - "触发条件或适用范围"
    - "预期关注点/理由"
    - "证据状态"
    - "影响/优先级"
    - "责任角色"
    - "关闭条件"
    - "验证方法"
    - "ALR-"
    - "任务理解"
    - "输入审计"
    - "长运行 Agent"
    - "预期"
  must_not_contain:
    - "我无法"
    - "无法提供帮助"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "对象/规则"
          - "来源"
          - "触发条件或适用范围"
          - "预期关注点/理由"
          - "证据状态"
          - "影响/优先级"
          - "责任角色"
          - "关闭条件"
          - "验证方法"
          - "ALR-"
          - "任务理解"
          - "输入审计"
          - "长运行 Agent"
