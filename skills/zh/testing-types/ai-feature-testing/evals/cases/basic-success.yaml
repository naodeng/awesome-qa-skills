id: basic-success
title: "AI 功能测试：领域完整场景"
description: |
  验证 Skill 能针对领域输入给出有证据、有优先级、可执行的产出。

input:
  prompt: |
    请使用 ai-feature-testing Skill 分析以下场景：电商商品描述生成功能面向中英文商家，需控制事实错误、敏感内容和品牌语气。已提供基本范围，请给出风险优先级、核心执行项、预期结果或判断标准，并标明证据和待确认问题。

expect:
  must_contain:
    - "任务理解"
    - "输入审计"
    - "风险"
    - "P0"
    - "预期"
  must_not_contain:
    - "TODO"
    - "我无法"
    - "无法提供帮助"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "任务理解"
          - "输入审计"
          - "风险"
