id: edge-incomplete-input
title: Supertest：无 schema 仍给初版
description: |
  只有一句话、无 schema 时仍应给 Supertest 初版并显式缺口/假设。

input:
  prompt: |
    用 api-test-supertest。需求只有一句：积分兑换接口要自动化。没有路径、字段和现有 Jest 结构。
    请先给可用的 Supertest 初版结构，并列出必须补齐的信息与假设。

expect:
  must_contain:
    - "假设"
    - "缺口"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "假设"
          - "Supertest"
