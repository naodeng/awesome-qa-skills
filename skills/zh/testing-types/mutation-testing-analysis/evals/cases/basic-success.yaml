id: basic-success
title: "变异测试分析: basic-success"
description: |
  验证 mutation-testing-analysis 的证据和边界契约。

input:
  prompt: |
    请使用 mutation-testing-analysis 分析：变异报告显示多个存活变异，但等价变异分类、超时和测试到变异的映射不完整。先列出已知事实、信息缺口、冲突、过期信息、范围外和假设，再输出 MTA-##，保留来源、证据状态、优先级、关闭条件和验证。不要声称测试已执行。

expect:
  must_contain:
    - "MTA-"
    - "输入审计"
    - "证据"
    - "验证"
    - "变异"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "输入审计"
          - "证据"
          - "验证"
          - "变异"
