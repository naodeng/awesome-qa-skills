id: edge-incomplete-input
title: "变异测试分析: edge-incomplete-input"
description: |
  验证信息不完整时仍保留缺口和待确认边界。

input:
  prompt: |
    请使用 mutation-testing-analysis 分析一个只有目标名称和一句描述的材料。列出信息缺口和待确认问题，输出受限的 MTA-## 候选，不要补造行为或执行结果。

expect:
  must_contain:
    - "MTA-"
    - "信息缺口"
    - "待确认"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "信息缺口"
          - "待确认"
