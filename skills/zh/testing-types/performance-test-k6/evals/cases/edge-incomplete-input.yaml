id: edge-incomplete-input
title: k6：无流量数据时写清假设
description: |
  缺少基线数据时不能编造精确容量结论。

input:
  prompt: |
    用 performance-test-k6。产品说「要测一下性能」，没有 SLA、没有历史流量。
    系统是积分兑换接口。请给初版方案，并把所有数字目标标成假设。

expect:
  must_contain:
    - "假设"
    - "缺口"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "假设"
          - "k6"
