id: basic-success
title: "恢复测试：完整输入下的领域产出"
description: |
  验证 Skill 能围绕恢复点、恢复时间、恢复步骤、验证证据和人工接管给出有证据、有优先级、可复核的领域产出。

input:
  prompt: |
    请使用 recovery-testing Skill 分析支付服务故障后的数据恢复目标和验证准备。已提供系统范围、隔离环境、主要依赖和发布限制。请输出领域风险、预期结果、证据缺口、优先级和待确认项。

expect:
  must_contain:
    - "对象/规则"
    - "来源"
    - "触发条件或适用范围"
    - "预期关注点/理由"
    - "证据状态"
    - "影响/优先级"
    - "责任角色"
    - "关闭条件"
    - "验证方法"
    - "RCV-"
    - "恢复目标"
    - "优先级"
    - "证据"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "对象/规则"
          - "来源"
          - "触发条件或适用范围"
          - "预期关注点/理由"
          - "证据状态"
          - "影响/优先级"
          - "责任角色"
          - "关闭条件"
          - "验证方法"
          - "RCV-"
          - "恢复目标"
          - "待确认"
