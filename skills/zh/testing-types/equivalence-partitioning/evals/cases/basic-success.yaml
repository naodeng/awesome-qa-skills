id: basic-success
title: "等价类划分测试设计: basic-success"
description: |
  This case checks the equivalence-partitioning evidence and boundary contract.

input:
  prompt: |
    请使用 equivalence-partitioning 分析：地区字段接受明确枚举，邮编格式按地区变化，但未知地区的行为没有材料。先列出已知事实、信息缺口、冲突、过期信息、范围外和假设，再输出 EP-##，保留来源、证据状态、优先级、关闭条件和验证方法，不要声称测试已执行。

expect:
  must_contain:
    - "EP-"
    - "输入审计"
    - "证据"
    - "验证"
    - "等价类"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "输入审计"
          - "证据"
          - "验证"
          - "等价类"
