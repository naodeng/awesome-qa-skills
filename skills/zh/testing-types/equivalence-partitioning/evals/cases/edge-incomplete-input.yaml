id: edge-incomplete-input
title: "等价类划分测试设计: edge-incomplete-input"
description: |
  This case checks the equivalence-partitioning evidence and boundary contract.

input:
  prompt: |
    使用 equivalence-partitioning。只知道“依据输入约束、业务规则和响应差异划分有证据的有效、无效和未知等价类”，没有需求、约束、阈值、版本、数据、环境或执行证据。输出受限 EP-##，明确列出信息缺口、假设、unassessed 项和待确认证据，不要编造规则。

expect:
  must_contain:
    - "EP-"
    - "信息缺口"
    - "unassessed"
    - "待确认"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "输入审计"
          - "信息缺口"
          - "待确认"
