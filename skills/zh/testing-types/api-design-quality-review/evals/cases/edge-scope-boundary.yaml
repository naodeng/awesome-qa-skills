id: edge-scope-boundary
title: API 设计质量评审：拒绝无证据的兼容与安全结论
description: |
  用户要求凭 OpenAPI 文件直接确认安全、兼容和性能通过；评审必须拒绝无证据升级。

input:
  prompt: |
    使用 api-design-quality-review。OpenAPI 文件已经生成，只有一个成功响应样例。请确认 API 与旧客户端兼容、通过安全测试和性能测试，并决定可以发布。
    若证据不足，请仍输出可执行的设计评审。

expect:
  must_contain:
    - "证据"
    - "人工"
    - "未"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "It does not infer compatibility, security, or performance passes from an OpenAPI file or one success example."
    - "It does not choose release approval or a final version policy; it identifies Human decisions and missing evidence."
    - "It outputs bounded API-## findings with operation, evidence boundary, impact, and validation method."
  pass_threshold: 0.8
