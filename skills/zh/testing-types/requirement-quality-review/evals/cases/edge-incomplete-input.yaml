id: edge-incomplete-input
title: 需求质量评审：信息不完整仍给出初版
description: |
  只有一句需求时，评审应区分已知、缺失和假设，而不是拒绝或补造规则。

input:
  prompt: |
    请使用 requirement-quality-review。
    唯一输入是：新版本增加积分兑换。
    没有原型、验收标准、接口说明、角色定义或发布范围。
    请先给最小可用评审初版，并列出最值得优先澄清的问题。

expect:
  must_contain:
    - "已知"
    - "缺失"
    - "假设"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "输入审计"
          - "待确认"
          - "信息缺口"
