id: edge-ai-evidence-boundary
title: AI 生成需求：来源、人工决定与验证证据不足
input:
  prompt: |
    使用 requirement-quality-review 评审唯一材料：“系统应快速处理积分退款。”该句由 AI 生成，但没有原始需求、模型/Prompt 版本、run 轨迹、人工审核或采纳记录。明确确认没有做验证或运行测试。请给证据受限的初版，并说明 `provenance_status`、`adoption_status`、`validation_status`，列出需要补充的材料；不要批准进入实现。
expect:
  must_contain: ["provenance_status", "UNKNOWN", "adoption_status", "UNASSESSED", "validation_status", "NOT_RUN"]
  must_not_contain: ["已批准", "Go/No-Go", "需求质量评分"]
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Returns a bounded first pass and identifies “quickly” as ambiguous/untestable without inventing a timing threshold."
    - "Marks provenance UNKNOWN, adoption UNASSESSED, and validation NOT_RUN because non-execution is explicit; does not treat these as proof of quality or approval."
    - "Requests source requirement, model/prompt/run provenance, Human adoption, and an observable response-time criterion; does not give a universal score or Go/No-Go."
