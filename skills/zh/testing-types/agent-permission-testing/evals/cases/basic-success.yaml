id: basic-success
title: "Agent 权限测试：领域完整场景"
description: |
  验证 Skill 能针对Agent 权限输入给出有证据、有优先级、可执行的产出。

input:
  prompt: |
    请使用 agent-permission-testing Skill 分析以下场景：客服 Agent 可以读取订单并申请退款，团队需要证明不同身份、工具权限和人工批准边界不会被越权绕过。请给出Agent 权限相关的风险优先级、核心执行项、预期结果或判断标准，并标明证据和待确认问题。

expect:
  must_contain:
    - "对象/规则"
    - "来源"
    - "触发条件或适用范围"
    - "预期关注点/理由"
    - "证据状态"
    - "影响/优先级"
    - "责任角色"
    - "关闭条件"
    - "验证方法"
    - "AGP-"
    - "任务理解"
    - "输入审计"
    - "Agent 权限"
    - "预期"
  must_not_contain:
    - "我无法"
    - "无法提供帮助"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "对象/规则"
          - "来源"
          - "触发条件或适用范围"
          - "预期关注点/理由"
          - "证据状态"
          - "影响/优先级"
          - "责任角色"
          - "关闭条件"
          - "验证方法"
          - "AGP-"
          - "任务理解"
          - "输入审计"
          - "Agent 权限"
