id: edge-role-source-deduplication
title: 测试用例编写：合并等价角色场景并保留全部来源
description: |
  多个角色提出语义等价场景时，应形成一套统一用例并保留贡献角色与需求追踪。

input:
  prompt: |
    请使用 test-case-writing 为支付重试需求编写测试用例。

    需求 REQ-PAY-17：支付请求超时后，用户可重试；同一订单不得重复扣款。
    验收标准 AC-PAY-17-1：同一订单重复支付时最多产生一笔成功扣款。

    已收集到这些角色场景候选：
    - 产品（product）：支付超时后用户再次点击支付，同一订单不能产生第二笔扣款。风险标签：资损。
    - QA（qa）：第一次支付返回超时后，用同一订单重试，账务侧只能记录一次成功扣款。风险标签：回归、幂等。
    - 技术（technical）：两个同订单支付请求并发到达时，只允许一次扣款成功，另一次必须得到可判定的非成功结果。风险标签：并发、幂等。

    请给出可执行的测试用例。

judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "输出是一套统一测试用例，而不是按 product、qa、technical 分成多套角色用例；产品与 QA 的超时后同订单重试候选被识别为等价并合并为一条测试意图，不生成两条仅措辞不同的重复用例。"
    - "合并后的超时重试用例同时保留 product 和 qa 两个 source_role（字段名可使用 source_role、来源角色等价表达），而不是只保留其中一个来源或写成无来源共识。"
    - "每条由角色候选形成的用例都保留可核对的需求追踪；超时重试用例至少关联 REQ-PAY-17 和 AC-PAY-17-1，并发候选也关联相关需求或验收标准。"
    - "技术角色的并发候选若与超时重试在触发条件或测试方法上不同，可作为同一统一用例集中的独立用例，但保留 technical 来源；不得扩写成按角色复制的完整套件。"
    - "用例包含可执行的前置条件、步骤和可判定预期结果，且未臆造具体接口路径、错误码或产品未提供的业务规则。"
  pass_threshold: 0.8
