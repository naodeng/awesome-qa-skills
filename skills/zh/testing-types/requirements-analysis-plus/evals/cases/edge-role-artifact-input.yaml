id: edge-role-artifact-input
title: 需求分析增强：组合使用带来源角色的报告
description: |
  多份材料附带角色报告时，仍产出可追溯的独立需求分析。

input:
  prompt: |
    请使用 requirements-analysis-plus 分析积分兑换改版。
    PRD v3：兑换提交后立即扣减积分，库存不足时返回失败。
    接口说明 v2：请求进入异步队列，重复请求依赖幂等键去重。
    另外有两份评审记录：
    - 来源角色「产品经理」：失败时应立即退还积分，但退款时限尚未决定。
    - 来源角色「QA」：未找到重复提交和异步失败的验收标准，认为无法判定端到端结果。
    请给出可供评审的增强版需求分析。

judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - 结果保持原有独立需求分析结构，并覆盖事实、假设、风险、来源和开放问题；角色报告是可选组合输入，不被当作完成分析的前置条件。
    - 凡使用产品经理或 QA 报告中的观点、风险或问题，均明确保留对应来源角色，不改写为无来源的统一结论，也不把角色观点冒充 PRD 或接口事实。
    - 对 PRD、接口说明与角色报告之间的一致、冲突、缺失或不可测状态进行可追溯说明；未知退款时限和验收标准保持为待确认问题，不自行补全。
    - 不要求读取、安装或链接任何角色 Skill 的内部文件；只处理请求中已声明来源角色的报告内容。
  pass_threshold: 0.8
