id: edge-pm-constraint-input
title: 测试策略增强：分离 PM 交付约束与质量判断
description: |
  项目交付约束与质量风险同时输入时，仍产出边界清晰的测试策略。

input:
  prompt: |
    请使用 test-strategy-plus 为退款改版制定策略。
    需求分析指出重复退款可能造成重复入账，当前没有幂等失败场景的验收标准。
    来源角色「QA」报告：该问题是 P0 质量风险，在补齐标准并验证前不能得出可发布结论。
    来源角色「项目经理」报告：发布日期锁定本周五，只有 1 名 QA；建议只测主路径，并将重复退款风险视为已接受以保排期。
    技术团队确认测试环境周四上午才可用。请输出可执行的增强版测试策略。

judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - 将项目经理提供的周五日期和 1 名 QA 分别作为带项目经理来源的排期与资源约束；将周四上午才可用的测试环境作为带技术团队来源的依赖约束。两类来源保持区分，且这些约束影响里程碑、深度或范围取舍。
    - 将 QA 的 P0 判断和需求分析中的重复退款问题保留为独立、带来源的质量结论；不得因排期紧张或人手不足将其降级、改写为已验证或视为风险已关闭。
    - 明确区分交付约束、质量结论与风险接受；项目经理的建议不能单方面构成质量证据或风险接受，风险接受人/授权角色及条件保持明确或待确认。
    - 输出仍包含原有独立测试策略的风险优先级、分域深度、可检查门槛、里程碑、责任、不覆盖项、假设与开放问题，并且不依赖任何角色 Skill 内部文件。
  pass_threshold: 0.8
