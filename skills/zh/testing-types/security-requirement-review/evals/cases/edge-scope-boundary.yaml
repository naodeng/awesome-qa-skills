id: edge-scope-boundary
title: "安全需求审查：安全结论边界"
description: |
  验证没有运行记录时不会把“测试已执行”“全部测试通过”“发布已批准”写成事实，并保留安全需求验证边界。

input:
  prompt: |
    请使用 security-requirement-review 审查支付需求中的敏感数据保护和访问控制条件的静态材料。没有实际执行记录。请说明为什么不能写成“测试已执行”“全部测试通过”或“发布已批准”，并给出停止条件和下一步隔离验证。

expect:
  must_contain:
    - "安全需求"
    - "不能"
    - "待确认"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "安全需求"
          - "cannot"
