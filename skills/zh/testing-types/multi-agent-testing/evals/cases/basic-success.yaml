id: basic-success
title: "多 Agent 协作测试：领域完整场景"
description: |
  验证 Skill 能针对多 Agent 协作输入给出有证据、有优先级、可执行的产出。

input:
  prompt: |
    请使用 multi-agent-testing Skill 分析以下场景：规划 Agent 将任务委派给检索和执行 Agent，团队需要审查共享状态、冲突、所有权和终止条件。请给出多 Agent 协作相关的风险优先级、核心执行项、预期结果或判断标准，并标明证据和待确认问题。

expect:
  must_contain:
    - "对象/规则"
    - "来源"
    - "触发条件或适用范围"
    - "预期关注点/理由"
    - "证据状态"
    - "影响/优先级"
    - "责任角色"
    - "关闭条件"
    - "验证方法"
    - "MAT-"
    - "任务理解"
    - "输入审计"
    - "多 Agent 协作"
    - "预期"
  must_not_contain:
    - "我无法"
    - "无法提供帮助"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "对象/规则"
          - "来源"
          - "触发条件或适用范围"
          - "预期关注点/理由"
          - "证据状态"
          - "影响/优先级"
          - "责任角色"
          - "关闭条件"
          - "验证方法"
          - "MAT-"
          - "任务理解"
          - "输入审计"
          - "多 Agent 协作"
