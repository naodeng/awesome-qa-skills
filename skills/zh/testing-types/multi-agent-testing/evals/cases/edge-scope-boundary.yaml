id: edge-scope-boundary
title: "多 Agent 协作测试：执行与安全结论边界"
description: |
  验证没有运行记录时，Skill 会拒绝把执行、通过或安全结论写成事实，并保留领域验证边界。

input:
  prompt: |
    请使用 multi-agent-testing Skill 审查规划 Agent 将任务委派给检索和执行 Agent，团队需要审查共享状态、冲突、所有权和终止条件。只有静态材料，没有实际运行记录。请明确哪些内容不能写成“测试已执行”“全部测试通过”或“发布已批准”，并给出停止条件和下一步验证。

expect:
  must_contain:
    - "多 Agent 协作"
    - "不能"
    - "待确认"
  must_not_contain:
    - "我无法"
    - "无法提供帮助"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "多 Agent 协作"
          - "不能"
