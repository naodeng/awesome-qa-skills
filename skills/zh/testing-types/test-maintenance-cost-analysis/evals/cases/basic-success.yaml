id: basic-success
title: "测试维护成本分析：领域完整场景"
description: |
  验证 Skill 能针对维护成本输入给出有证据、有优先级、可执行的产出。

input:
  prompt: |
    请使用 test-maintenance-cost-analysis Skill 分析以下场景：测试套件频繁因产品变更和环境波动需要修复，团队需要拆分真实维护成本、责任归属和改进优先级。请给出维护成本相关的风险优先级、核心执行项、预期结果或判断标准，并标明证据和待确认问题。

expect:
  must_contain:
    - "任务理解"
    - "输入审计"
    - "维护成本"
    - "预期"
  must_not_contain:
    - "我无法"
    - "无法提供帮助"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "任务理解"
          - "输入审计"
          - "维护成本"
