id: basic-success
title: AI 生成 API 测试审查：识别弱断言
input:
  prompt: |
    使用 ai-generated-test-review 审查：
    it('creates a user', async () => {
      const response = await api.post('/users', validUser);
      expect(response.status).toBe(200);
    });
    接口应创建用户，重复邮箱应返回冲突，且不得写入重复记录。
expect:
  must_contain: ["P1", "WEAK", "重复", "断言", "风险", "最小"]
  must_not_contain: ["TODO", "我无法"]
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "将该测试判为 WEAK 而非 STRONG 或 FAKE；明确指出只验证 HTTP 200，未验证重复邮箱冲突和不得重复写入的业务后置条件，并给出能逃逸的最小缺陷。"
