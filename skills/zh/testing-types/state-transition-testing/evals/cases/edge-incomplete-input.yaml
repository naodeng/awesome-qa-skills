id: edge-incomplete-input
title: "状态迁移测试设计: edge-incomplete-input"
description: |
  此用例检查状态迁移测试的证据边界与合同要求。

input:
  prompt: |
    使用 state-transition-testing。只知道“从状态、事件、守卫和动作中发现可达、不可达及异常迁移的测试候选”，没有需求、约束、阈值、版本、数据、环境或执行证据。输出受限 STT-##，明确列出信息缺口、假设、unassessed 项和待确认证据，不要编造规则。

expect:
  must_contain:
    - "STT-"
    - "信息缺口"
    - "unassessed"
    - "待确认"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "输入审计"
          - "信息缺口"
          - "待确认"
