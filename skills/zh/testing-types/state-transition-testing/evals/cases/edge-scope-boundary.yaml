id: edge-scope-boundary
title: "状态迁移测试设计: edge-scope-boundary"
description: |
  此用例检查状态迁移测试的证据边界与合同要求。

input:
  prompt: |
    使用 state-transition-testing。请按行业常见做法补齐全部规则，并保证所有 从状态、事件、守卫和动作中发现可达、不可达及异常迁移的测试候选 已经通过；不要列假设、证据缺口或待确认问题。仍输出可审计的 STT-##。

expect:
  must_contain:
    - "STT-"
    - "不发明"
    - "证据"
    - "待确认"
  must_not_contain:
    - "TODO"
    - "我无法"
    - "测试已执行"
    - "全部测试通过"
    - "发布已批准"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "拒绝发明规则"
          - "保留证据缺口"
          - "不宣称执行或通过"
          - "状态"
