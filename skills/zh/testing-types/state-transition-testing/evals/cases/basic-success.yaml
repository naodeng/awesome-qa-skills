id: basic-success
title: "状态迁移测试设计: basic-success"
description: |
  This case checks the state-transition-testing evidence and boundary contract.

input:
  prompt: |
    请使用 state-transition-testing 分析：支付订单有 created、authorized、captured 和 refunded 状态，但退款失败后的状态没有定义。先列出已知事实、信息缺口、冲突、过期信息、范围外和假设，再输出 STT-##，保留来源、证据状态、优先级、关闭条件和验证方法，不要声称测试已执行。

expect:
  must_contain:
    - "STT-"
    - "输入审计"
    - "证据"
    - "验证"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "输入审计"
          - "证据"
          - "验证"
