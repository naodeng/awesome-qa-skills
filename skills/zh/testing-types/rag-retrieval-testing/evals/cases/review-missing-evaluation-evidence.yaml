id: review-missing-evaluation-evidence
title: "rag-retrieval-testing: RAG 检索：排名与权限轨迹 — missing run evidence"
description: "验证检索审查覆盖排名、文档版本与租户权限。"
context:
  files:
    "structured-trace.json": |-
      {
        "trace_id": "TRACE-NORUN-RAG-RETRIEVAL-TESTING",
        "subject": "rag-retrieval-testing",
        "identity": {
          "model_version": "model-A",
          "prompt_version": "prompt-1",
          "dataset_version": "dataset-1"
        },
        "run_id": null,
        "attempted": false,
        "run_evidence": [],
        "evaluation_status": "NOT_RUN"
      }
input:
  prompt: |
    请使用 rag-retrieval-testing 审阅 structured-trace.json。逐条报告 rank、document_id、版本和 tenant filter；相关但越权的结果必须判为失败，不用平均分抵消。
    The trace has no run_id and no raw result. Output exactly these machine-readable lines:
    evaluation_status: NOT_RUN
    run_evidence: []
    domain_conclusion: UNASSESSED
expect:
  must_contain:
    - "evaluation_status: NOT_RUN"
    - "run_evidence: []"
    - "domain_conclusion: UNASSESSED"
judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "evaluation_status: NOT_RUN"
          - "run_evidence: []"
          - "domain_conclusion: UNASSESSED"
