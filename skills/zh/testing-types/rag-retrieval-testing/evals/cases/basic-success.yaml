id: basic-success
title: "RAG 检索测试：领域完整场景"
description: |
  验证 Skill 能针对检索结果输入给出有证据、有优先级、可执行的产出。

input:
  prompt: |
    请使用 rag-retrieval-testing Skill 分析以下场景：企业知识库改版后检索结果变少，团队需要区分查询改写、分块、过滤和排序造成的证据差异。请给出检索结果相关的风险优先级、核心执行项、预期结果或判断标准，并标明证据和待确认问题。

expect:
  must_contain:
    - "任务理解"
    - "输入审计"
    - "检索结果"
    - "预期"
  must_not_contain:
    - "我无法"
    - "无法提供帮助"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "任务理解"
          - "输入审计"
          - "检索结果"
