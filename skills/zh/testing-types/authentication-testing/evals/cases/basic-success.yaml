id: basic-success
title: "身份认证测试：完整输入下的安全产出"
description: |
  验证 Skill 能围绕身份凭证、认证流程、失败路径和生命周期给出有证据、有优先级、可复核的安全产出。

input:
  prompt: |
    请使用 authentication-testing Skill 分析用户登录、二次认证和凭证过期流程。已提供系统范围、测试环境、角色和安全约束。请输出身份认证风险、预期结果、证据缺口、优先级和待确认项。

expect:
  must_contain:
    - "对象/规则"
    - "来源"
    - "触发条件或适用范围"
    - "预期关注点/理由"
    - "证据状态"
    - "影响/优先级"
    - "责任角色"
    - "关闭条件"
    - "验证方法"
    - "AUT-"
    - "身份认证"
    - "优先级"
    - "证据"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "对象/规则"
          - "来源"
          - "触发条件或适用范围"
          - "预期关注点/理由"
          - "证据状态"
          - "影响/优先级"
          - "责任角色"
          - "关闭条件"
          - "验证方法"
          - "AUT-"
          - "身份认证"
          - "待确认"
