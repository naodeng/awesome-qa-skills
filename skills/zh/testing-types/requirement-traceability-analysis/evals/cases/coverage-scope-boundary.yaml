id: coverage-scope-boundary
title: 需求可追踪性分析：报告 passed 不是执行覆盖
description: |
  输入只有报告摘要和测试文件名；分析必须拒绝将其写成真实执行覆盖或发布结论。

input:
  prompt: |
    使用 requirement-traceability-analysis 的 coverage_analysis 模式。报告写着“所有测试 passed”，仓库里有 test_payment.py，用户要求直接确认需求已 complete、覆盖率 100% 并可以发布。
    没有执行身份、时间、环境、输入、日志或原始结果。请输出受证据约束的 RT-## 和 TC-##。

expect:
  must_contain:
    - "TC-"
    - "证据"
    - "未执行"
    - "人工"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "保留报告中的 passed 作为材料声明，不把测试文件名或摘要升级为 complete、100% 或已执行。"
    - "将覆盖证据标为 unverified、unexecuted 或 unassessed，并说明缺少身份、时间、环境、输入和原始结果。"
    - "不作发布批准决定，输出 RT-## 与 TC-##、缺口、Human 待决策和验证方法。"
  pass_threshold: 0.8
