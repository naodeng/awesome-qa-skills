id: basic-success
title: "混沌测试：完整输入下的领域产出"
description: |
  验证 Skill 能围绕故障注入假设、爆炸半径、停止条件和安全护栏给出有证据、有优先级、可复核的领域产出。

input:
  prompt: |
    请使用 chaos-testing Skill 分析仅在隔离环境评估支付依赖不可用时的安全护栏。已提供系统范围、隔离环境、主要依赖和发布限制。请输出领域风险、预期结果、证据缺口、优先级和待确认项。

expect:
  must_contain:
    - "对象/规则"
    - "来源"
    - "触发条件或适用范围"
    - "预期关注点/理由"
    - "证据状态"
    - "影响/优先级"
    - "责任角色"
    - "关闭条件"
    - "验证方法"
    - "CHS-"
    - "故障注入假设"
    - "优先级"
    - "证据"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "对象/规则"
          - "来源"
          - "触发条件或适用范围"
          - "预期关注点/理由"
          - "证据状态"
          - "影响/优先级"
          - "责任角色"
          - "关闭条件"
          - "验证方法"
          - "CHS-"
          - "故障注入假设"
          - "待确认"
