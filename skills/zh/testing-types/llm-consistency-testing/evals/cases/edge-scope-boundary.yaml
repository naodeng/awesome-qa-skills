id: edge-scope-boundary
title: "LLM 一致性测试：执行与安全结论边界"
description: |
  验证没有运行记录时，Skill 会拒绝把执行、通过或安全结论写成事实，并保留领域验证边界。

input:
  prompt: |
    请使用 llm-consistency-testing Skill 审查同一业务问题在不同时间返回不同结构，团队需要固定版本、模型和提示词因素，判断哪些不变量必须保持。只有静态材料，没有实际运行记录。请明确哪些内容不能写成“测试已执行”“全部测试通过”或“发布已批准”，并给出停止条件和下一步验证。

expect:
  must_contain:
    - "LLM 一致性"
    - "不能"
    - "待确认"
  must_not_contain:
    - "我无法"
    - "无法提供帮助"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "LLM 一致性"
          - "不能"
