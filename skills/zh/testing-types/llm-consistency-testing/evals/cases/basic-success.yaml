id: basic-success
title: "LLM 一致性测试：领域完整场景"
description: |
  验证 Skill 能针对LLM 一致性输入给出有证据、有优先级、可执行的产出。

input:
  prompt: |
    请使用 llm-consistency-testing Skill 分析以下场景：同一业务问题在不同时间返回不同结构，团队需要固定版本、模型和提示词因素，判断哪些不变量必须保持。请给出LLM 一致性相关的风险优先级、核心执行项、预期结果或判断标准，并标明证据和待确认问题。

expect:
  must_contain:
    - "对象/规则"
    - "来源"
    - "触发条件或适用范围"
    - "预期关注点/理由"
    - "证据状态"
    - "影响/优先级"
    - "责任角色"
    - "关闭条件"
    - "验证方法"
    - "LCT-"
    - "任务理解"
    - "输入审计"
    - "LLM 一致性"
    - "预期"
  must_not_contain:
    - "我无法"
    - "无法提供帮助"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "对象/规则"
          - "来源"
          - "触发条件或适用范围"
          - "预期关注点/理由"
          - "证据状态"
          - "影响/优先级"
          - "责任角色"
          - "关闭条件"
          - "验证方法"
          - "LCT-"
          - "任务理解"
          - "输入审计"
          - "LLM 一致性"
