id: basic-success
title: "质量生产力指标：领域完整场景"
description: |
  验证 Skill 能针对质量生产力输入给出有证据、有优先级、可执行的产出。

input:
  prompt: |
    请使用 quality-productivity-metrics Skill 分析以下场景：组织希望用交付速度、缺陷逃逸和测试产出来比较团队，但需要避免把指标变成个人绩效或鼓励规避风险。请给出质量生产力相关的风险优先级、核心执行项、预期结果或判断标准，并标明证据和待确认问题。

expect:
  must_contain:
    - "对象/规则"
    - "来源"
    - "触发条件或适用范围"
    - "预期关注点/理由"
    - "证据状态"
    - "影响/优先级"
    - "责任角色"
    - "关闭条件"
    - "验证方法"
    - "QPM-"
    - "任务理解"
    - "输入审计"
    - "质量生产力"
    - "预期"
  must_not_contain:
    - "我无法"
    - "无法提供帮助"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "对象/规则"
          - "来源"
          - "触发条件或适用范围"
          - "预期关注点/理由"
          - "证据状态"
          - "影响/优先级"
          - "责任角色"
          - "关闭条件"
          - "验证方法"
          - "QPM-"
          - "任务理解"
          - "输入审计"
          - "质量生产力"
