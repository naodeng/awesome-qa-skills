id: review-structured-trace
title: "结构化输出：读取版本化运行轨迹"
description: "验证能从轨迹中分层统计解析、Schema 和语义结果，并保留试次分母。"
context:
  files:
    "structured-trace.json": |-
        {
          "trace_id": "TRACE-ORDER-017",
          "identity": {
            "input_id": "Q17",
            "model_version": "model-A",
            "prompt_version": "P2",
            "dataset_version": "D1",
            "schema_version": "S3",
            "parameters": {
              "temperature": 0,
              "seed": 7
            }
          },
          "contract": {
            "required": [
              "decision",
              "amount",
              "reason"
            ],
            "types": {
              "decision": "string",
              "amount": "integer",
              "reason": "string"
            },
            "semantic_oracle": {
              "decision": "APPROVE",
              "amount": 20,
              "reason": "source-supported meaning"
            }
          },
          "trials": [
            {
              "trial_id": "T1",
              "raw_output": "{\"decision\":\"APPROVE\",\"amount\":20,\"reason\":\"eligible\"}",
              "parse_status": "PASS",
              "schema_status": "PASS",
              "semantic_status": "PASS",
              "evidence_ref": "run://T1"
            },
            {
              "trial_id": "T2",
              "raw_output": "{\"decision\":\"APPROVE\",\"amount\":\"20\",\"reason\":\"eligible\"}",
              "parse_status": "PASS",
              "schema_status": "FAIL",
              "semantic_status": "NOT_EVALUATED",
              "evidence_ref": "run://T2"
            },
            {
              "trial_id": "T3",
              "raw_output": "{\"decision\":\"APPROVE\",",
              "parse_status": "FAIL",
              "schema_status": "NOT_EVALUATED",
              "semantic_status": "NOT_EVALUATED",
              "evidence_ref": "run://T3"
            }
          ],
          "trial_count": 3
        }
input:
  prompt: |
    使用 structured-output-testing 审阅 `structured-trace.json`。核对契约和身份，分别说明 T1/T2/T3 的 parse/schema/semantic 结果，统计各层失败数和试次分母。解释该轨迹支持的结论与无法支持的分布结论，并保留 trace_id、版本、参数和证据引用。
expect:
  must_contain:
    - "TRACE-ORDER-017"
    - "T1"
    - "T2"
    - "T3"
    - "parse_status"
    - "schema_status"
    - "semantic_status"
    - "分母"
judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "TRACE-ORDER-017"
          - "T1"
          - "T2"
          - "T3"
          - "parse_status"
          - "schema_status"
