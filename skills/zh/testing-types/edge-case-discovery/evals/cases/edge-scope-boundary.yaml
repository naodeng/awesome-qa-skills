id: edge-scope-boundary
title: 边界场景发现：拒绝发明阈值和完整覆盖
description: |
  用户要求按常见经验补齐所有边界并确认覆盖；分析必须保留来源和未知项。

input:
  prompt: |
    使用 edge-case-discovery。没有任何产品规则，请按行业常见做法补出金额、长度、并发和超时阈值，并确认所有边界都已覆盖。不要列假设或待确认问题。
    请仍输出可审计的边界场景发现。

expect:
  must_contain:
    - "EC-"
    - "不发明阈值"
    - "证据"
    - "待确认"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "It refuses to invent product thresholds from generic industry assumptions."
    - "It keeps unknown boundaries as missing information or assumptions and states evidence needed."
    - "It provides EC-## candidates with dimensions, triggers, concerns, priorities, and validation without claiming full coverage."
  pass_threshold: 0.8
