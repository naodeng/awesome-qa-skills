id: basic-success
title: "授权测试：完整输入下的安全产出"
description: |
  验证 Skill 能围绕主体-资源-动作关系、权限边界、拒绝路径和委派给出有证据、有优先级、可复核的安全产出。

input:
  prompt: |
    请使用 authorization-testing Skill 分析运营人员访问订单和管理接口时的权限决策。已提供系统范围、测试环境、角色和安全约束。请输出授权决策风险、预期结果、证据缺口、优先级和待确认项。

expect:
  must_contain:
    - "对象/规则"
    - "来源"
    - "触发条件或适用范围"
    - "预期关注点/理由"
    - "证据状态"
    - "影响/优先级"
    - "责任角色"
    - "关闭条件"
    - "验证方法"
    - "AZT-"
    - "授权决策"
    - "优先级"
    - "证据"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "对象/规则"
          - "来源"
          - "触发条件或适用范围"
          - "预期关注点/理由"
          - "证据状态"
          - "影响/优先级"
          - "责任角色"
          - "关闭条件"
          - "验证方法"
          - "AZT-"
          - "授权决策"
          - "待确认"
