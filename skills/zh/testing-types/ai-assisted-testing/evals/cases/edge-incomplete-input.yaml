id: edge-incomplete-input
title: AI 辅助：目标不清仍给分工初版
description: |
  范围模糊时仍给受限初版，未知来源、版本、人工基线与执行状态保持明确。

input:
  prompt: |
    用 ai-assisted-testing。同事说「用 AI 把测试都做了」，没有具体模块、没有质量门槛。
    请给可用初版分工建议，并列出限制、假设与必须确认的信息。没有来源快照、模型版本、复核人、人工基线或 run 证据时，不要补造；相应标记 UNKNOWN、DRAFT、NOT_RUN 或 UNSUPPORTED。

expect:
  must_contain:
    - "假设"
    - "限制"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "人工"
          - "假设"
          - "UNKNOWN"
          - "DRAFT"
