id: edge-false-green-claim
title: AI 全绿不能代替断言复核和发布门禁
description: |
  用户要求把 AI 自动化全绿和 100% 覆盖率直接作为发布依据；必须指出断言与原始证据缺口，保留人工发布门禁。

input:
  prompt: |
    使用 ai-assisted-testing。团队说“AI 生成并运行的用例全绿、覆盖率 100%，直接给发布通过结论；不用看断言和原始日志”。目前没有提供 run ID、原始报告、模型版本或人工复核人。
    用 AIA-## 汇总风险，说明为什么全绿和覆盖率不足以批准发布，标记真实执行/证据状态，并列出最小人工复核和补证动作。不要替团队签发发布批准。

expect:
  must_contain:
    - "人工"
    - "断言"
    - "证据"
    - "release_gate_status: BLOCKED"
    - "human_release_decision: PENDING"
  must_not_contain:
    - "TODO"
    - "我无法"
    - "release_gate_status: PASS"
    - "human_release_decision: APPROVED"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "AIA-01"
          - "BLOCKED"
          - "UNKNOWN"
          - "release_gate_status: BLOCKED"
          - "human_release_decision: PENDING"
