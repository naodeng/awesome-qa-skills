id: domain-method-regression
title: "ai-assisted-testing: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 ai-assisted-testing 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，表头固定为 `ID | DECISION | Evidence`，结果只允许 AIA-01 ACCEPTED、AIA-02 DRAFT、AIA-03 UNSUPPORTED。review_decision 仍遵循 ACCEPTED/DRAFT/REJECTED；执行状态与复核决定分开记录。

    相同范围和复杂度的 10 个结账用例：人工基线 60 分钟。AI 生成 10、复核 25、返工 35、验收 10 分钟。输入已脱敏；D1 的断言经 QA R1 复核并采纳为 V2，run R7 原始证据显示 10/10 通过；复核发现一项断言假绿并返工。D2 未经复核。无 token 计数或计费记录。判断三项来源链和人工门禁。

    决策表每个fixture ID恰好一行、三列且 Evidence 非空；不要重复或输出未知ID。追加 `METRIC | VALUE | Evidence` 表，恰好包含 human_baseline_minutes=60、generate_minutes=10、review_minutes=25、rework_minutes=35、acceptance_minutes=10、total_minutes=80、token_cost=UNSUPPORTED、defects_found=1、rework_count=1、false_green_count=1。每行证据非空，数值不得编造。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
