id: basic-success
title: AI 辅助：分工与人工把关点
description: |
  应给出 AI/人工分工、来源链、AIA 编号、成本口径和人工门禁。

input:
  prompt: |
    请使用 ai-assisted-testing。
    任务：两天内完成积分兑换相关用例草稿 + 一轮探索清单；团队可用 AI 生成草稿。
    请用 AIA-## 编号给出草稿分工，并明确 source_snapshot_id、assistant/model、prompt/instruction_version、draft_id、reviewer、review_decision、adopted_version_id、execution_evidence、成本字段及人工把关点。当前尚未生成或执行，请保留相应未知和未运行状态。

expect:
  must_contain:
    - "人工"
    - "复核"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "任务理解"
          - "AIA-01"
          - "source_snapshot_id"
          - "DRAFT"
          - "高风险"
