id: edge-incomplete-input
title: 功能测试：信息不全仍给初版
description: |
  只有一句话需求时仍应给可用初版并列出缺口。

input:
  prompt: |
    用 functional-testing 帮我设计测试。
    需求只有一句：新版本加了积分兑换。没有原型和接口文档。
    请先给可用初版，并列出必须补齐的信息。

expect:
  must_contain:
    - "假设"
    - "待确认"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "假设"
          - "待确认"
