id: basic-success
title: "回归优化：领域完整场景"
description: |
  验证 Skill 能针对回归范围输入给出有证据、有优先级、可执行的产出。

input:
  prompt: |
    请使用 regression-optimization Skill 分析以下场景：单体拆分后回归套件变慢，团队想缩小范围并并行执行，但不能丢失高风险路径的覆盖。请给出回归范围相关的风险优先级、核心执行项、预期结果或判断标准，并标明证据和待确认问题。

expect:
  must_contain:
    - "对象/规则"
    - "来源"
    - "触发条件或适用范围"
    - "预期关注点/理由"
    - "证据状态"
    - "影响/优先级"
    - "责任角色"
    - "关闭条件"
    - "验证方法"
    - "RGO-"
    - "任务理解"
    - "输入审计"
    - "回归范围"
    - "预期"
  must_not_contain:
    - "我无法"
    - "无法提供帮助"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "对象/规则"
          - "来源"
          - "触发条件或适用范围"
          - "预期关注点/理由"
          - "证据状态"
          - "影响/优先级"
          - "责任角色"
          - "关闭条件"
          - "验证方法"
          - "RGO-"
          - "任务理解"
          - "输入审计"
          - "回归范围"
