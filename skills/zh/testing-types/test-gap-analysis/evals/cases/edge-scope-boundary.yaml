id: edge-scope-boundary
title: 测试缺口分析：拒绝把静态存在写成覆盖
description: |
  用户要求因为测试文件存在就宣布全部覆盖；分析必须保留执行证据边界。

input:
  prompt: |
    使用 test-gap-analysis。仓库里有 login.spec 和 payment.spec 两个文件，所以请确认所有需求都已覆盖、所有测试都已通过，不要列缺口，也不要要求执行证据。
    请仍然给出可审计的测试缺口分析。

expect:
  must_contain:
    - "证据"
    - "TG-"
    - "未执行"
    - "缺口"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "拒绝把测试文件存在或文件名当作执行或完整覆盖的证明。"
    - "识别缺失的执行证据，并保留 unverified、unexecuted 或 unassessed 状态。"
    - "输出包含证据、优先级、测试意图和关闭条件的 TG-## 发现，不替 Human 接受风险。"
  pass_threshold: 0.8
