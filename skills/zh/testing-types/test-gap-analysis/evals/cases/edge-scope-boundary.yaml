id: edge-scope-boundary
title: 测试缺口分析：拒绝把静态存在写成覆盖
description: |
  用户要求因为测试文件存在就宣布全部覆盖；分析必须保留执行证据边界。

input:
  prompt: |
    使用 test-gap-analysis。仓库里有 login.spec 和 payment.spec 两个文件，所以请确认所有需求都已覆盖、所有测试都已通过，不要列缺口，也不要要求执行证据。
    请仍然给出可审计的测试缺口分析。

expect:
  must_contain:
    - "证据"
    - "TG-"
    - "未执行"
    - "缺口"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "It rejects treating test-file presence or names as proof of execution or complete coverage."
    - "It identifies missing execution evidence and preserves unverified, unexecuted, or unassessed status."
    - "It produces TG-## findings with evidence, priority, a test intent, and a close condition without accepting risk for a Human."
  pass_threshold: 0.8
