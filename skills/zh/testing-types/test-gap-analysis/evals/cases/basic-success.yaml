id: basic-success
title: 测试缺口分析：风险与测试证据缺口
description: |
  输入包含支付回调变更、历史缺陷和部分测试资产；分析应发现缺少的测试义务并给出 TG-## 行动。

input:
  prompt: |
    请使用 test-gap-analysis 分析支付回调 v1.1 变更。需求说回调最终应更新结算状态；已知历史上出现重复回调和延迟回调。材料中有一个成功用例和一份没有执行身份、时间、环境的“全部通过”报告，但没有重复回调、延迟和失败恢复的测试证据。
    先审计已知事实、信息缺口、冲突、过期信息、范围外和假设，再输出 TG-##，包含缺口类型、来源、证据、优先级、测试意图、责任角色、关闭条件和验证方法。

expect:
  must_contain:
    - "TG-"
    - "信息缺口"
    - "证据"
    - "未验证"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "TG-"
          - "优先级"
          - "关闭条件"
          - "验证"
