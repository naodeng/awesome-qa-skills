schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .

engine:
  name: codex

cases:
  files:
    - evals/cases/basic-success.yaml
    - evals/cases/edge-no-corpus.yaml
    - evals/cases/edge-score-is-not-selection.yaml
