id: edge-scope-boundary
title: "自动化投资回报分析：执行与发布结论边界"
description: |
  验证没有运行记录时，Skill 会拒绝把执行、通过或发布结论写成事实，并保留领域验证边界。

input:
  prompt: |
    请使用 automation-roi-analysis Skill 审查团队要决定是否自动化一组回归流程，但只有粗略的执行频率和维护估计，缺少可比的时间窗与敏感性分析。只有静态材料，没有实际运行记录。请明确哪些内容不能写成“测试已执行”“全部测试通过”或“发布已批准”，并给出停止条件和下一步验证。

expect:
  must_contain:
    - "自动化投资回报"
    - "不能"
    - "待确认"
  must_not_contain:
    - "我无法"
    - "无法提供帮助"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "自动化投资回报"
          - "不能"
