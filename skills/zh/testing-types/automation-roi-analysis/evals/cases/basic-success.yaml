id: basic-success
title: "自动化投资回报分析：领域完整场景"
description: |
  验证 Skill 能针对自动化投资回报输入给出有证据、有优先级、可执行的产出。

input:
  prompt: |
    请使用 automation-roi-analysis Skill 分析以下场景：团队要决定是否自动化一组回归流程，但只有粗略的执行频率和维护估计，缺少可比的时间窗与敏感性分析。请给出自动化投资回报相关的风险优先级、核心执行项、预期结果或判断标准，并标明证据和待确认问题。

expect:
  must_contain:
    - "对象/规则"
    - "来源"
    - "触发条件或适用范围"
    - "预期关注点/理由"
    - "证据状态"
    - "影响/优先级"
    - "责任角色"
    - "关闭条件"
    - "验证方法"
    - "ARO-"
    - "任务理解"
    - "输入审计"
    - "自动化投资回报"
    - "预期"
  must_not_contain:
    - "我无法"
    - "无法提供帮助"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "对象/规则"
          - "来源"
          - "触发条件或适用范围"
          - "预期关注点/理由"
          - "证据状态"
          - "影响/优先级"
          - "责任角色"
          - "关闭条件"
          - "验证方法"
          - "ARO-"
          - "任务理解"
          - "输入审计"
          - "自动化投资回报"
