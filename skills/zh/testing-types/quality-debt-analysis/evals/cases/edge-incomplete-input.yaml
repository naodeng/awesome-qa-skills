id: edge-incomplete-input
title: "质量债务分析：信息不完整时的受限初版"
description: |
  验证输入不足时不会拒绝或编造，而是交付受限初版并标出假设与缺口。

input:
  prompt: |
    请使用 quality-debt-analysis Skill。当前只知道：订单系统积累了未覆盖的边界场景、脆弱测试和过期测试数据，团队需要判断哪些质量债务先偿还。没有更多环境、版本、口径或证据，请先给出可用初版，并明确哪些结论不能成立。

expect:
  must_contain:
    - "当前假设"
    - "信息缺口"
    - "待确认"
    - "下一步"
  must_not_contain:
    - "我无法"
    - "无法提供帮助"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "当前假设"
          - "信息缺口"
