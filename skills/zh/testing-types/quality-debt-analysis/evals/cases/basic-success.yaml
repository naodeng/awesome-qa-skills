id: basic-success
title: "质量债务分析：领域完整场景"
description: |
  验证 Skill 能针对质量债务输入给出有证据、有优先级、可执行的产出。

input:
  prompt: |
    请使用 quality-debt-analysis Skill 分析以下场景：订单系统积累了未覆盖的边界场景、脆弱测试和过期测试数据，团队需要判断哪些质量债务先偿还。请给出质量债务相关的风险优先级、核心执行项、预期结果或判断标准，并标明证据和待确认问题。

expect:
  must_contain:
    - "对象/规则"
    - "来源"
    - "触发条件或适用范围"
    - "预期关注点/理由"
    - "证据状态"
    - "影响/优先级"
    - "责任角色"
    - "关闭条件"
    - "验证方法"
    - "QDA-"
    - "任务理解"
    - "输入审计"
    - "质量债务"
    - "预期"
  must_not_contain:
    - "我无法"
    - "无法提供帮助"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "对象/规则"
          - "来源"
          - "触发条件或适用范围"
          - "预期关注点/理由"
          - "证据状态"
          - "影响/优先级"
          - "责任角色"
          - "关闭条件"
          - "验证方法"
          - "QDA-"
          - "任务理解"
          - "输入审计"
          - "质量债务"
