id: review-ai-generated-code-signals
title: "代码审查：将 Agent 轨迹与测试和 CI 改动关联"
description: "检查 AI/Agent 变更的意图、范围、门禁完整性和证据状态。"
context:
  files:
    "agent-pr-evidence.json": |-
      {
        "run_id": "PR-RUN-83",
        "task": "Keep a webhook retry from charging one order twice",
        "source": {"tool": "coding-agent", "model": "UNKNOWN", "prompt_version": "UNKNOWN"},
        "events": [
          {"step_id": "E1", "type": "edit", "path": "src/billing/retry.py", "change": "replace stable order idempotency key with uuid4() per attempt"},
          {"step_id": "E2", "type": "edit", "path": "tests/test_retry.py", "change": "remove duplicate-charge assertion; keep status 200"},
          {"step_id": "E3", "type": "edit", "path": ".github/workflows/required.yml", "change": "set required-ci job if: false"},
          {"step_id": "E4", "type": "run", "command": "pytest", "result": "Agent-reported exit 0", "artifact": null}
        ],
        "diff": "src/billing/retry.py: new UUID idempotency key on each retry; tests/test_retry.py: removes duplicate-charge assertion; .github/workflows/required.yml: required-ci disabled",
        "ci_artifact": null
      }
input:
  prompt: |
    使用 code-review 静态审查 billing 仓库 PR #83，head 018cab1，base 9a11d23。读取 `agent-pr-evidence.json`，按业务风险输出发现，保留轨迹 ID，并区分代码 Diff、Agent 自报运行结果、CI 证据和来源缺口。不要运行命令。
expect:
  must_contain: ["P0", "idempotency", "required-ci", "PR-RUN-83", "E1", "E3", "UNKNOWN"]
  must_not_contain: ["CI 已通过", "建议直接合并"]
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Identifies the per-attempt UUID as a P0/equivalent duplicate-charge risk tied to the retry requirement, and identifies the removed assertion and disabled required-ci job."
    - "Retains PR-RUN-83 and relevant E1-E4 IDs; treats E4 as an Agent self-report with no artifact, not verified execution."
    - "Marks CI outcome and absent model/prompt provenance UNKNOWN, does not claim tests or CI passed, and provides a concrete repair direction."
