id: edge-ai-evidence-boundary
title: AI 生成代码评审：明确未运行与结果未知
input:
  prompt: |
    使用 code-review 评审 repo-a PR #91，head b0921aa，base 33d102e；下方 Diff 可读。AI/Agent 来源没有提供。我明确说测试没有运行，也没有提供 CI 日志或平台结果。请做静态评审并输出 `review_status`、`test_status`、`ci_status`、`provenance_status`；不要声称通过或批准。
    ```diff
    - retry(call, idempotency_key=order.id)
    + retry(call, idempotency_key=uuid4())
    ```
expect:
  must_contain: ["review_status", "COMPLETE", "test_status", "NOT_RUN", "ci_status", "UNKNOWN", "provenance_status"]
  must_not_contain: ["测试通过", "批准合并"]
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Completes a bounded static review because identity and diff are supplied; does not block solely because execution evidence is absent."
    - "Marks tests NOT_RUN because non-execution is explicit, CI UNKNOWN because no result is supplied, and provenance UNKNOWN because AI/Agent source details are absent."
    - "Reports the per-retry idempotency change as a conditional risk only if the applicable contract is not supplied; does not invent a duplicate-charge contract or claim test success."
