id: edge-risk-priority
title: ai-agent-testing：必须按风险排优先级
description: |
  防止平均摊铺；结果应区分 P0/高优先级与可延后项。

input:
  prompt: |
    使用 ai-agent-testing。功能很多：登录、搜索、下单、支付、优惠券、积分、客服工单、后台报表。
    发版窗口只有半天。请只保留最关键路径，并说明为什么其他项可降级。

expect:
  must_contain:
    - "P0"
    - "优先级"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "P0"
          - "优先级"
