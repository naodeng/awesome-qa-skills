id: edge-risk-priority
title: 缺陷报告：严重程度必须有业务依据
description: |
  避免情绪化定级；用语义 judge 检查两份缺陷的严重程度区分是否合理。

input:
  prompt: |
    使用 bug-reporting。
    问题：后台报表导出比平时慢约 20 秒，业务仍能导出成功。
    同时另有：支付成功但扣款翻倍（偶发）。
    请分别给出两份简版缺陷摘要，并解释严重程度为何不同。

expect:
  must_contain:
    - "严重"
    - "支付"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "分别覆盖「报表变慢」与「扣款翻倍」两类问题，而不是混成一条"
    - "扣款翻倍的严重程度明显高于报表变慢，并给出业务影响依据"
    - "事实与猜测/根因推测分开，没有编造未提供的日志或账号细节"
  pass_threshold: 0.67
