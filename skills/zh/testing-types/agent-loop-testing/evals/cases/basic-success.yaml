id: basic-success
title: "Agent 循环测试：领域完整场景"
description: |
  验证 Skill 能针对Agent 循环输入给出有证据、有优先级、可执行的产出。

input:
  prompt: |
    请使用 agent-loop-testing Skill 分析以下场景：工具型 Agent 在任务失败后反复调用同一工具，团队需要审查循环状态、停止条件、预算和 trace 证据。请给出Agent 循环相关的风险优先级、核心执行项、预期结果或判断标准，并标明证据和待确认问题。

expect:
  must_contain:
    - "任务理解"
    - "输入审计"
    - "Agent 循环"
    - "预期"
  must_not_contain:
    - "我无法"
    - "无法提供帮助"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "任务理解"
          - "输入审计"
          - "Agent 循环"
