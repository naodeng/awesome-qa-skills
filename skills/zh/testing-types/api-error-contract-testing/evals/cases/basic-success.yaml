id: basic-success
title: "API 错误契约测试: basic-success"
description: |
  验证 api-error-contract-testing 的证据和边界契约。

input:
  prompt: |
    请使用 api-error-contract-testing 分析：多个 API 对相同校验错误返回不同状态码和字段结构，且内部异常是否脱敏没有明确证据。先列出已知事实、信息缺口、冲突、过期信息、范围外和假设，再输出 AEC-##，保留来源、证据状态、优先级、关闭条件和验证。不要声称测试已执行。

expect:
  must_contain:
    - "AEC-"
    - "输入审计"
    - "证据"
    - "验证"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "输入审计"
          - "证据"
          - "验证"
