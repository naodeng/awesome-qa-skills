id: basic-success
title: 数据库设计质量评审：约束与迁移证据
description: |
  输入包含订单表、索引和扩展迁移草案，但缺少回滚、并发和恢复细节；评审应输出 DB-## 和关闭条件。

input:
  prompt: |
    请使用 database-design-quality-review 评审脱敏的订单 schema：orders(id, user_id, status, total)，user_id 有索引，status 允许任意字符串；迁移新增 total；设计说“可在线迁移”，没有数据范围、回滚、事务、并发、备份恢复和查询证据。
    先做 known、missing、conflicting、stale、out_of_scope、assumptions 审计，再输出对象矩阵和 DB-##。不要连接数据库或猜测金额精度。

expect:
  must_contain:
    - "DB-"
    - "约束"
    - "迁移"
    - "脱敏"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "输入审计"
          - "回滚"
          - "验证"
