id: edge-scope-boundary
title: "CI 测试流水线优化：执行与发布结论边界"
description: |
  验证没有运行记录时，Skill 会拒绝把执行、通过或发布结论写成事实，并保留领域验证边界。

input:
  prompt: |
    请使用 ci-test-optimization Skill 审查CI 测试流水线在高峰期排队，失败重跑增加成本，团队需要在反馈速度、稳定性和资源之间做有证据的优化。只有静态材料，没有实际运行记录。请明确哪些内容不能写成“测试已执行”“全部测试通过”或“发布已批准”，并给出停止条件和下一步验证。

expect:
  must_contain:
    - "CI 测试流水线"
    - "不能"
    - "待确认"
  must_not_contain:
    - "我无法"
    - "无法提供帮助"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "CI 测试流水线"
          - "不能"
