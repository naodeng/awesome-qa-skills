id: basic-success
title: "可靠性测试：完整输入下的领域产出"
description: |
  验证 Skill 能围绕可用性目标、失败模式、暴露窗口和证据准备给出有证据、有优先级、可复核的领域产出。

input:
  prompt: |
    请使用 reliability-testing Skill 分析订单服务的可用性目标、支付依赖故障和降级路径。已提供系统范围、隔离环境、主要依赖和发布限制。请输出领域风险、预期结果、证据缺口、优先级和待确认项。

expect:
  must_contain:
    - "可靠性目标"
    - "优先级"
    - "证据"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "可靠性目标"
          - "待确认"
