id: basic-success
title: "测试代码评审: basic-success"
description: |
  验证 test-code-review 的证据和边界契约。

input:
  prompt: |
    请使用 test-code-review 分析：测试通过依赖共享数据库和执行顺序，断言只检查状态码，失败日志也不能证明业务结果。先列出已知事实、信息缺口、冲突、过期信息、范围外和假设，再输出 TCR-##，保留来源、证据状态、优先级、关闭条件和验证。不要声称测试已执行。

expect:
  must_contain:
    - "TCR-"
    - "输入审计"
    - "证据"
    - "验证"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "输入审计"
          - "证据"
          - "验证"
