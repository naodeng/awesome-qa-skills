id: basic-success
title: "UI 测试选择器评审: basic-success"
description: |
  验证 ui-test-selector-review 的证据和边界契约。

input:
  prompt: |
    请使用 ui-test-selector-review 分析：UI 测试混用动态 class、XPath 和文本定位，组件已有可访问名称但选择器风险没有记录。先列出已知事实、信息缺口、冲突、过期信息、范围外和假设，再输出 USR-##，保留来源、证据状态、优先级、关闭条件和验证。不要声称测试已执行。

expect:
  must_contain:
    - "USR-"
    - "输入审计"
    - "证据"
    - "验证"
    - "选择器"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "输入审计"
          - "证据"
          - "验证"
          - "选择器"
