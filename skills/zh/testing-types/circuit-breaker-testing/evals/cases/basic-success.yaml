id: basic-success
title: "熔断器测试：完整输入下的领域产出"
description: |
  验证 Skill 能围绕closed、open、half-open 状态、阈值证据、恢复探测和兜底给出有证据、有优先级、可复核的领域产出。

input:
  prompt: |
    请使用 circuit-breaker-testing Skill 分析支付依赖连续失败时熔断状态转换和恢复探测。已提供系统范围、隔离环境、主要依赖和发布限制。请输出领域风险、预期结果、证据缺口、优先级和待确认项。

expect:
  must_contain:
    - "对象/规则"
    - "来源"
    - "触发条件或适用范围"
    - "预期关注点/理由"
    - "证据状态"
    - "影响/优先级"
    - "责任角色"
    - "关闭条件"
    - "验证方法"
    - "CBR-"
    - "熔断状态"
    - "优先级"
    - "证据"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "对象/规则"
          - "来源"
          - "触发条件或适用范围"
          - "预期关注点/理由"
          - "证据状态"
          - "影响/优先级"
          - "责任角色"
          - "关闭条件"
          - "验证方法"
          - "CBR-"
          - "熔断状态"
          - "待确认"
