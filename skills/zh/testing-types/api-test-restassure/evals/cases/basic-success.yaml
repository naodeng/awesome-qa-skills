id: basic-success
title: RestAssured：有 OpenAPI/curl 时给出套件结构
description: |
  提供简短 OpenAPI 与 curl 时，应产出 REST Assured Java 套件/公共设置/断言结构说明。

input:
  prompt: |
    请使用 api-test-restassure。
    环境：SIT。认证：Bearer {{token}}（勿硬编码真实 token）。技术栈：Java + Maven。
    OpenAPI 片段：
      POST /v1/orders
      GET /v1/orders/{id}
    curl（脱敏）：
      curl -X GET https://api.example.com/v1/orders/ORD-1 -H "Authorization: Bearer $TOKEN"
    请给出 REST Assured 方案：包结构、BaseApiTest/公共设置、高优先级用例与断言重点。不必输出超长代码。

expect:
  must_contain:
    - "REST Assured"
    - "BaseApiTest"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "任务理解"
          - "REST Assured"
