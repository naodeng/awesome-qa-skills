id: basic-success
title: "AI 安全测试：领域完整场景"
description: |
  验证 Skill 能针对AI 安全输入给出有证据、有优先级、可执行的产出。

input:
  prompt: |
    请使用 ai-safety-testing Skill 分析以下场景：面向用户的 AI 助手需要处理自伤、隐私和越权请求，团队要审查拒答、重定向、升级和人工风险决策边界。请给出AI 安全相关的风险优先级、核心执行项、预期结果或判断标准，并标明证据和待确认问题。

expect:
  must_contain:
    - "对象/规则"
    - "来源"
    - "触发条件或适用范围"
    - "预期关注点/理由"
    - "证据状态"
    - "影响/优先级"
    - "责任角色"
    - "关闭条件"
    - "验证方法"
    - "AIS-"
    - "任务理解"
    - "输入审计"
    - "AI 安全"
    - "预期"
  must_not_contain:
    - "我无法"
    - "无法提供帮助"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "对象/规则"
          - "来源"
          - "触发条件或适用范围"
          - "预期关注点/理由"
          - "证据状态"
          - "影响/优先级"
          - "责任角色"
          - "关闭条件"
          - "验证方法"
          - "AIS-"
          - "任务理解"
          - "输入审计"
          - "AI 安全"
