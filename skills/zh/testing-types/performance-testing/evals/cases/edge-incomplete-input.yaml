id: edge-incomplete-input
title: 性能测试：无 SLA/流量仍给初版
description: |
  缺少基线数据时不能编造容量结论，必须标假设与缺口。

input:
  prompt: |
    用 performance-testing。产品只说「测一下性能」，没有 SLA、没有历史流量。
    系统是积分兑换。请给初版方案，并把数字目标标成假设，列出缺口。

expect:
  must_contain:
    - "假设"
    - "待确认"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "假设"
          - "待确认"
