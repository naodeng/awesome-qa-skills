id: basic-success
title: "RAG 质量测试：领域完整场景"
description: |
  验证 Skill 能针对RAG 质量输入给出有证据、有优先级、可执行的产出。

input:
  prompt: |
    请使用 rag-quality-testing Skill 分析以下场景：知识库问答需要回答有来源支持、覆盖问题要点，并在检索不足时明确拒答，但当前只有零散示例。请给出RAG 质量相关的风险优先级、核心执行项、预期结果或判断标准，并标明证据和待确认问题。

expect:
  must_contain:
    - "对象/规则"
    - "来源"
    - "触发条件或适用范围"
    - "预期关注点/理由"
    - "证据状态"
    - "影响/优先级"
    - "责任角色"
    - "关闭条件"
    - "验证方法"
    - "RAGQ-"
    - "任务理解"
    - "输入审计"
    - "RAG 质量"
    - "预期"
  must_not_contain:
    - "我无法"
    - "无法提供帮助"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "对象/规则"
          - "来源"
          - "触发条件或适用范围"
          - "预期关注点/理由"
          - "证据状态"
          - "影响/优先级"
          - "责任角色"
          - "关闭条件"
          - "验证方法"
          - "RAGQ-"
          - "任务理解"
          - "输入审计"
          - "RAG 质量"
