id: edge-scope-boundary
title: "RAG 质量测试：执行与安全结论边界"
description: |
  验证没有运行记录时，Skill 会拒绝把执行、通过或安全结论写成事实，并保留领域验证边界。

input:
  prompt: |
    请使用 rag-quality-testing Skill 审查知识库问答需要回答有来源支持、覆盖问题要点，并在检索不足时明确拒答，但当前只有零散示例。只有静态材料，没有实际运行记录。请明确哪些内容不能写成“测试已执行”“全部测试通过”或“发布已批准”，并给出停止条件和下一步验证。

expect:
  must_contain:
    - "RAG 质量"
    - "不能"
    - "待确认"
  must_not_contain:
    - "我无法"
    - "无法提供帮助"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "RAG 质量"
          - "不能"
