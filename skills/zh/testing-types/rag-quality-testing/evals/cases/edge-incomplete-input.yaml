id: edge-incomplete-input
title: "RAG 质量测试：信息不完整时的受限初版"
description: |
  验证输入不足时不会拒绝或编造，而是交付受限初版并标出假设与缺口。

input:
  prompt: |
    请使用 rag-quality-testing Skill。当前只知道：知识库问答需要回答有来源支持、覆盖问题要点，并在检索不足时明确拒答，但当前只有零散示例。没有更多环境、版本、模型或证据，请先给出可用初版，并明确哪些结论不能成立。

expect:
  must_contain:
    - "当前假设"
    - "信息缺口"
    - "待确认"
    - "下一步"
  must_not_contain:
    - "我无法"
    - "无法提供帮助"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "当前假设"
          - "信息缺口"
