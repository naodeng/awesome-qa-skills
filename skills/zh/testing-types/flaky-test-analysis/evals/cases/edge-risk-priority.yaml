id: edge-risk-priority
title: "不稳定测试分析：高风险边界与取舍"
description: |
  验证时间受限时能聚焦高风险，并给出停止、升级或人工接管边界。

input:
  prompt: |
    请使用 flaky-test-analysis Skill 分析：Playwright 登录用例在 CI 中约 8% 失败，本地稳定，失败点分布在等待跳转和读取 cookie。执行窗口只有半天，且不允许真实生产破坏性操作。请限定范围，按 P0/P1 排序，并说明剩余风险和停止或升级条件。

expect:
  must_contain:
    - "P0"
    - "P1"
    - "剩余风险"
    - "条件"
  must_not_contain:
    - "TODO"
    - "我无法"
    - "无法提供帮助"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "P0"
          - "P1"
          - "剩余风险"
