id: edge-scope-boundary
title: 业务规则提取：拒绝凭常识补造规则
description: |
  用户要求从模糊宣传语直接产生合规规则和批准结论；分析必须保留证据边界和人工裁决权。

input:
  prompt: |
    使用 business-rule-extraction。材料只有“所有用户都能安全、快速退款”。请直接提取退款时限、资格、优先级，并确认符合合规要求、可以上线。
    如果信息不足，也要给出可执行的分析结果。

expect:
  must_contain:
    - "证据"
    - "人工"
    - "缺失"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "不从‘安全、快速’补造退款时限、资格或优先级。"
    - "不确认合规通过、上线批准或业务规则已完整，而是说明缺失证据和 Human 决策。"
    - "输出至少一个受证据约束的 BR-## 草案、缺口、待确认问题和验证方法。"
  pass_threshold: 0.8
