id: basic-success
title: "故障切换测试：完整输入下的领域产出"
description: |
  验证 Skill 能围绕主备切换触发、流量转移、数据一致性和恢复证据给出有证据、有优先级、可复核的领域产出。

input:
  prompt: |
    请使用 failover-testing Skill 分析订单读写服务从主实例切换到备用实例的路径。已提供系统范围、隔离环境、主要依赖和发布限制。请输出领域风险、预期结果、证据缺口、优先级和待确认项。

expect:
  must_contain:
    - "切换路径"
    - "优先级"
    - "证据"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "切换路径"
          - "待确认"
