id: edge-scope-boundary
title: "故障切换测试：执行与发布结论边界"
description: |
  验证没有运行记录时，Skill 会拒绝把“测试已执行”“全部测试通过”“发布已批准”写成事实，并保留切换路径的验证边界。

input:
  prompt: |
    请使用 failover-testing 审查订单读写服务从主实例切换到备用实例的路径的设计材料。只有静态文档，没有实际运行记录。请明确哪些内容不能写成“测试已执行”“全部测试通过”或“发布已批准”，并给出停止条件和下一步验证。

expect:
  must_contain:
    - "切换路径"
    - "不能"
    - "待确认"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "切换路径"
          - "不能"
