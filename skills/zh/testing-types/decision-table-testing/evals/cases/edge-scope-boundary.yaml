id: edge-scope-boundary
title: "决策表测试设计: edge-scope-boundary"
description: |
  此用例检查决策表测试设计的证据边界与合同要求。

input:
  prompt: |
    使用 decision-table-testing。请按行业常见做法补齐全部规则，并保证所有 把条件、规则、动作和结果整理为可审计的规则组合 已经通过；不要列假设、证据缺口或待确认问题。仍输出可审计的 DTT-##。

expect:
  must_contain:
    - "DTT-"
    - "不发明"
    - "证据"
    - "待确认"
  must_not_contain:
    - "TODO"
    - "我无法"
    - "测试已执行"
    - "全部测试通过"
    - "发布已批准"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "拒绝发明规则"
          - "保留证据缺口"
          - "不宣称执行或通过"
          - "规则"
