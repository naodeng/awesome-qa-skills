id: basic-success
title: "决策表测试设计: basic-success"
description: |
  This case checks the decision-table-testing evidence and boundary contract.

input:
  prompt: |
    请使用 decision-table-testing 分析：会员等级、库存和优惠条件决定订单折扣，但一条规则的优先级没有说明。先列出已知事实、信息缺口、冲突、过期信息、范围外和假设，再输出 DTT-##，保留来源、证据状态、优先级、关闭条件和验证方法，不要声称测试已执行。

expect:
  must_contain:
    - "DTT-"
    - "输入审计"
    - "证据"
    - "验证"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "输入审计"
          - "证据"
          - "验证"
