id: edge-incomplete-input
title: "决策表测试设计: edge-incomplete-input"
description: |
  此用例检查决策表测试设计的证据边界与合同要求。

input:
  prompt: |
    使用 decision-table-testing。只知道“把条件、规则、动作和结果整理为可审计的规则组合”，没有需求、约束、阈值、版本、数据、环境或执行证据。输出受限 DTT-##，明确列出信息缺口、假设、unassessed 项和待确认证据，不要编造规则。

expect:
  must_contain:
    - "DTT-"
    - "信息缺口"
    - "unassessed"
    - "待确认"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "输入审计"
          - "信息缺口"
          - "待确认"
