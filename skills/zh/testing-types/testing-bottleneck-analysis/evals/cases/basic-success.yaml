id: basic-success
title: "测试瓶颈分析：领域完整场景"
description: |
  验证 Skill 能针对测试瓶颈输入给出有证据、有优先级、可执行的产出。

input:
  prompt: |
    请使用 testing-bottleneck-analysis Skill 分析以下场景：迭代测试经常在环境、数据准备和人工审批处等待，团队需要定位真正的测试瓶颈而不是凭感觉加人。请给出测试瓶颈相关的风险优先级、核心执行项、预期结果或判断标准，并标明证据和待确认问题。

expect:
  must_contain:
    - "任务理解"
    - "输入审计"
    - "测试瓶颈"
    - "预期"
  must_not_contain:
    - "我无法"
    - "无法提供帮助"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "任务理解"
          - "输入审计"
          - "测试瓶颈"
