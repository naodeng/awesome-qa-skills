id: basic-success
title: "测试运行时间优化：领域完整场景"
description: |
  验证 Skill 能针对测试运行时间输入给出有证据、有优先级、可执行的产出。

input:
  prompt: |
    请使用 test-runtime-optimization Skill 分析以下场景：端到端套件运行时间持续增长，团队怀疑初始化、清理和串行依赖造成延迟，但尚未有可复核的基线。请给出测试运行时间相关的风险优先级、核心执行项、预期结果或判断标准，并标明证据和待确认问题。

expect:
  must_contain:
    - "对象/规则"
    - "来源"
    - "触发条件或适用范围"
    - "预期关注点/理由"
    - "证据状态"
    - "影响/优先级"
    - "责任角色"
    - "关闭条件"
    - "验证方法"
    - "TRO-"
    - "任务理解"
    - "输入审计"
    - "测试运行时间"
    - "预期"
  must_not_contain:
    - "我无法"
    - "无法提供帮助"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "对象/规则"
          - "来源"
          - "触发条件或适用范围"
          - "预期关注点/理由"
          - "证据状态"
          - "影响/优先级"
          - "责任角色"
          - "关闭条件"
          - "验证方法"
          - "TRO-"
          - "任务理解"
          - "输入审计"
          - "测试运行时间"
