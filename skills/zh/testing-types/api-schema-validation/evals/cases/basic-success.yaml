id: basic-success
title: "API Schema 校验: basic-success"
description: |
  验证 api-schema-validation 的证据和边界契约。

input:
  prompt: |
    请使用 api-schema-validation 分析：OpenAPI 约束声明了必填字段和枚举值，但响应样例缺少版本来源且错误响应未建模。先列出已知事实、信息缺口、冲突、过期信息、范围外和假设，再输出 ASV-##，保留来源、证据状态、优先级、关闭条件和验证。不要声称测试已执行。

expect:
  must_contain:
    - "ASV-"
    - "输入审计"
    - "证据"
    - "验证"
    - "schema"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "输入审计"
          - "证据"
          - "验证"
          - "schema"
