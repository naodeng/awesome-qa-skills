id: basic-success
title: "API 分页测试: basic-success"
description: |
  验证 api-pagination-testing 的证据和边界契约。

input:
  prompt: |
    请使用 api-pagination-testing 分析：列表接口同时支持 page、limit 和 cursor，但空页、重复记录、数据变更和排序稳定性没有证据。先列出已知事实、信息缺口、冲突、过期信息、范围外和假设，再输出 APT-##，保留来源、证据状态、优先级、关闭条件和验证。不要声称测试已执行。

expect:
  must_contain:
    - "APT-"
    - "输入审计"
    - "证据"
    - "验证"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "输入审计"
          - "证据"
          - "验证"
