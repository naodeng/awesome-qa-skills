id: basic-pass
title: 测试策略评审：完整策略建议通过
description: |
  证据完整、风险与约束均有对应措施时，AI 应建议通过，同时保留 Human 最终决策权。

input:
  prompt: |
    请评审这份会员订阅升级测试策略，供评审会决策。

    需求：REQ-SUB-12 要求 Web 和 Android 用户可从月付升级为年付，按剩余天数抵扣；支付失败必须保持原套餐有效。明确排除 iOS 和企业账户。
    产品分析：核心路径是查看抵扣金额、确认升级、支付成功；不可接受风险是重复扣款、错误抵扣或失败后套餐失效。
    技术约束：BILLING-V3 通过异步事件更新权益；支付沙箱可返回成功、余额不足、超时和重复回调；测试环境已启用事件追踪。
    项目约束：QA 负责人李青；开发负责人王磊；数据负责人陈敏；候选版本 9 月 18 日冻结。

    策略 STRAT-SUB-4：
    - 范围覆盖 Web/Android 月付转年付、抵扣边界、成功/余额不足/超时/重复回调、事件乱序、失败回滚和原套餐保持；明确排除 iOS/企业账户并引用 REQ-SUB-12。
    - 单元测试覆盖抵扣与幂等规则，API 集成测试覆盖支付和事件状态机，Web/Android E2E 覆盖核心用户路径；重复回调和事件乱序执行并发测试。
    - QA 环境与支付沙箱已确认；数据集 TD-SUB-7 包含月末、闰日、0/1/365 剩余天数、成功及各失败码，陈敏负责在 9 月 12 日刷新。
    - 进入门槛：需求与接口契约已基线化、候选构建可部署、TD-SUB-7 校验通过。退出门槛：P0/P1 为 0，核心路径 100% 通过，抵扣规则覆盖率 100%，无重复扣款，所有失败回滚证据已归档。
    - 依赖：BILLING-V3 与支付沙箱；沙箱不可用时 API 合约桩只用于非端到端检查，核心支付 E2E 延后且不得计入退出门槛。
    - 李青维护覆盖矩阵，王磊处理实现缺陷；9 月 13 日评审环境、数据和依赖就绪状态。

judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "给出明确的 AI 辅助建议 pass，并清楚说明这不是最终 Human 批准，最终决策由 Human 评审者作出。"
    - "核对业务覆盖、测试深度与方法、可执行性、环境、数据、质量门禁、依赖/降级和明确排除项，并用输入中的具体证据说明策略完整性。"
    - "将阻塞项与非阻塞项分开；阻塞项应明确为无，若提出非阻塞改进则不得把它伪装成阻塞条件。"
    - "保留李青、王磊、陈敏已有责任归属；任何修订请求都说明对象、负责人和完成条件，不虚构人员或最终审批。"
  pass_threshold: 0.8
