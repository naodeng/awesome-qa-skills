id: basic-conditional-pass
title: 测试策略评审：可修订缺口建议有条件通过
description: |
  策略主体可执行但存在限时补齐项时，应建议有条件通过并给出可验证的修订请求。

input:
  prompt: |
    请评审订单取消功能的测试策略。

    需求 REQ-ORD-31：未发货订单可在 Web 和 Android 取消；优惠券立即返还，退款在 24 小时内完成。海外订单本期明确排除。
    技术说明 TECH-ORD-8：取消请求可能重复提交，退款由异步任务执行；测试环境已有支付沙箱，但退款超时错误码映射将在 8 月 16 日提供。
    项目说明：策略负责人是 QA 周宁；错误码映射由后端赵凯交付；数据准备由测试数据团队负责，但尚未指定具体责任人。8 月 20 日开始系统测试。

    策略 STRAT-ORD-9：覆盖 Web/Android 未发货取消、优惠券返还、退款成功、重复请求幂等和异步状态查询；单元/API/E2E 层次、入口门槛、P0/P1 为 0 与退款时限证据等退出门槛已定义；海外订单列为排除项。环境与支付沙箱可用。当前未列退款超时错误码场景，测试数据清单也没有退款超时数据和负责人。其余数据与依赖已就绪。

judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "给出明确的 AI 辅助建议 conditional_pass，并说明 Human 评审者保留最终决定权。"
    - "将退款超时错误码场景、相应测试数据以及未明确的数据责任人识别为必须补齐的非阻塞/条件项，而不是声称策略已经完全通过。"
    - "明确区分阻塞项与非阻塞项：没有证据表明当前缺口使整份策略无法评审，但条件必须在系统测试或适用门槛前关闭。"
    - "修订请求至少要求赵凯提供错误码映射、周宁更新覆盖/策略，并要求项目确认测试数据负责人和验收证据；不得编造具体负责人姓名。"
    - "仍评审业务覆盖、测试深度、可执行性、环境、数据、门禁、依赖和排除项，不因一个缺口忽略其余维度。"
  pass_threshold: 0.8
