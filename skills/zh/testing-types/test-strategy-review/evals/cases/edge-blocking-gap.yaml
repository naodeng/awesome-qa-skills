id: edge-blocking-gap
title: 测试策略评审：关键业务风险无覆盖时建议驳回
description: |
  不可接受业务风险既无测试覆盖也无修订责任时，AI 应把它列为阻塞项并建议驳回。

input:
  prompt: |
    请评审即时转账测试策略。

    需求 PAY-77：用户可向联系人转账；网络超时后不得重复扣款，账务与余额最终必须一致。产品把重复扣款和账实不一致列为不可接受风险。
    技术约束：转账跨支付网关和账务服务，使用幂等键与异步补偿；测试环境只能稳定模拟成功请求，故障注入环境是否可用尚未确认。
    项目约束：QA 负责人孙悦；支付网关负责人高峰；候选版本两周后冻结。

    策略 PAY-STRAT-2：只安排成功转账 UI 测试、金额边界和联系人校验；退出门槛为已计划用例 95% 通过且无 P0。文档没有超时重试、重复回调、幂等、异步补偿、账务对账测试，也没有对应环境、测试数据、依赖降级或责任人。策略写着“异常路径后续版本再补”，但需求没有把这些路径排除。

judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "给出明确的 AI 辅助建议 reject，并说明最终驳回/通过决定仍由 Human 评审者作出。"
    - "把超时重试、重复回调/扣款、幂等、异步补偿和账务一致性未覆盖识别为具体阻塞项，解释它们直接关联不可接受业务风险且不属于有效排除范围。"
    - "阻塞项与非阻塞项分区；不得把环境、数据、依赖和责任人缺失淡化为一般优化，也不得凭空声称已有故障注入能力。"
    - "修订请求分别指向孙悦更新风险覆盖/门禁、要求高峰或已知技术责任方确认网关故障能力，并要求项目明确环境/数据/依赖责任；未知负责人保持待指派。"
    - "评审明确涉及业务覆盖、测试深度、可执行性、环境、数据、质量门禁、依赖与排除项。"
  pass_threshold: 0.8
