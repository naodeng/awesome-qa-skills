id: edge-incomplete-input
title: 测试策略评审：缺少策略正文时停止实质评审
description: |
  只有需求摘要而没有待评审策略时，AI 不得编造覆盖结论，应暴露输入阻塞并请求材料。

input:
  prompt: |
    我们明天要开购物车促销测试策略评审会。需求要求满 300 减 50，可与会员折扣叠加但不能与品类券叠加；Web 和 iOS 在范围内。产品负责人林珊，QA 负责人方宇。请现在给出策略评审结果。

    我手头没有策略正文、覆盖矩阵、测试层次、环境与数据方案、质量门禁、依赖清单或排除项说明。不要替我们写一份新策略，只评审已提供材料。

judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "输出精确结构字段 `recommendation: reject`，并把缺少待评审测试策略列为阻塞性输入缺口；不得用 pass、conditional_pass 或只有叙述性拒绝而没有该字段来替代。"
    - "输出 `human_final_decision: pending`，明确结果只是 AI 辅助建议且不伪造已完成的 Human 评审批准。"
    - "不编造业务覆盖、测试深度、环境、数据、门禁、依赖或排除项已经充分；逐类列出缺口、待确认问题以及完成实质评审所需的策略正文、覆盖矩阵和相应证据。"
    - "阻塞项与非阻塞项分开，非阻塞项可明确为当前无法判断；修订请求由方宇提供策略/覆盖材料并由林珊确认业务规则，未知技术、数据或环境负责人标为待指派。"
  pass_threshold: 0.8
