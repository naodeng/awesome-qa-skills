id: edge-conflicting-input
title: 测试策略评审：范围证据冲突未解决时建议驳回
description: |
  需求和策略对关键平台范围相互冲突时，AI 应保留冲突、阻止无依据裁决并请求负责人解决。

input:
  prompt: |
    请评审登录安全增强测试策略。

    已批准需求 REQ-AUTH-55（产品负责人顾言）写明：Web、Android 和 iOS 均必须覆盖短信 MFA；三次失败锁定、验证码重放和无障碍读屏是验收范围，不设平台排除。
    项目纪要 PLAN-55（项目经理唐薇）写明：本期为了 9 月上线只做 Web 和 Android，iOS 延至下一期，但没有附需求变更审批。
    技术说明 AUTH-ARCH-9：三个客户端共用 MFA API；测试环境可模拟过期、重放和限流。
    QA 负责人：何晴。

    策略 AUTH-STRAT-6：覆盖 Web/Android 的成功、失败锁定、过期、重放、限流、API 集成和无障碍；已有环境、数据、P0/P1 门禁与 MFA API 依赖。它把 iOS 列为明确排除项，依据仅为 PLAN-55；没有 iOS 风险处置或需求豁免记录。

judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "给出明确的 AI 辅助建议 reject，并说明 Human 评审者保留最终决定权；不得自行选择项目纪要覆盖已批准需求。"
    - "准确保留 REQ-AUTH-55 与 PLAN-55 关于 iOS 范围的冲突，把未获批准的 iOS 排除识别为阻塞项，同时承认 Web/Android 已有覆盖是非阻塞/正面证据。"
    - "将阻塞项与非阻塞项分开，检查测试深度、可执行性、环境、数据、门禁、依赖及排除项，且不虚构需求变更或 Human 风险接受。"
    - "修订请求要求顾言/授权需求负责人确认范围或变更，唐薇提供已批准的计划/豁免证据，何晴在决议后更新策略和风险覆盖；给出可验证的关闭条件。"
  pass_threshold: 0.8
