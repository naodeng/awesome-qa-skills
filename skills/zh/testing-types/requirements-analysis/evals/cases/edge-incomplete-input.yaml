id: edge-incomplete-input
title: 需求分析：一句话需求仍给初版
description: |
  材料极薄时仍应给可用初版并列出假设与缺口。

input:
  prompt: |
    用 requirements-analysis。需求只有一句：新版本加了积分兑换。没有验收标准与原型。
    请先给需求分析初版，并列出必须补齐的信息。

expect:
  must_contain:
    - "假设"
    - "缺口"
  must_not_contain:
    - "TODO"
    - "我无法"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "假设"
          - "缺口"
