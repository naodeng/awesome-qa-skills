version: 1
metadata:
  key: "skill-prose-review"
interface:
  display_name: "Skill 文案契约审查"
  short_description: "审查 Skill、Prompt 与文档的可执行契约、边界和证据要求。"
  default_prompt: "Use the skill-prose-review skill to audit this Skill or Prompt contract."
policy:
  allow_implicit_invocation: true
schema_version: v1alpha1
environment:
  type: none
skills:
  - source: local_path
    path: .
engine:
  name: claude_code
cases:
  files:
    - evals/cases/basic-success.yaml
    - evals/cases/edge-incomplete-input.yaml
    - evals/cases/edge-scope-risk.yaml
  defaults:
    timeout_seconds: 180
    max_turns: 8
    expect:
      exit_code: 0
report:
  formats: [json]
