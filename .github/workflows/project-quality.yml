name: Project Quality

on:
  pull_request:
  push:
    branches:
      - main
      - explore

permissions:
  contents: read

jobs:
  project-quality:
    name: Project quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for executable eval fixtures
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pinned skill-up
        env:
          SKILL_UP_VERSION: "0.12.0"
          INSTALL_DIR: ${{ runner.temp }}/skill-up/bin
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/alibaba/skill-up/main/install.sh | bash
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"
          "$INSTALL_DIR/skill-up" --version

      - name: Run project-document unit tests
        run: python3 -m unittest scripts.tests.test_check_docs_bilingual -v

      - name: Run project quality gate
        env:
          REQUIRE_SKILL_UP: "1"
        run: bash scripts/check_skills_quality.sh

  skills-cli-compatibility:
    name: Skills CLI compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for pinned Agent Skills CLI
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Skills CLI compatibility gate
        env:
          SKILLS_CLI_PACKAGE: ${{ github.workspace }}
        run: bash scripts/check_skills_cli_compatibility.sh
